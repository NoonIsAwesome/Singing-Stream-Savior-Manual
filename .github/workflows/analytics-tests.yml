name: Website analytics checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run offline JavaScript regressions
        run: |
          node --test scripts/test-built-site.mjs scripts/test-site-analytics.mjs scripts/test-download-clicks.mjs scripts/test-download-config.mjs
          node scripts/validate-privacy.mjs
      - name: Build the complete manual without deploying
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check rendered pages in all languages
        run: |
          node scripts/validate-built-site.mjs _site
          node scripts/validate-site-analytics.mjs _site
          node scripts/validate-download-clicks.mjs _site
          node scripts/validate-privacy.mjs _site
          node scripts/validate-player-window-guide.mjs _site
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Windows PowerShell 5.1, BOM, output and CMD wrapper
        shell: powershell
        run: |
          .\scripts\test-site-analytics.ps1
          .\scripts\test-download-clicks.ps1
      - name: Read-only CounterAPI V2 availability (not a collection test)
        shell: powershell
        run: |
          $result = & .\scripts\get-site-analytics.ps1 -Probe
          $result | Select-Object Provider, Status, ReadVerified, CollectionVerified, CollectionEnabled, HttpStatus, CheckedAt | ConvertTo-Json
          if ($result.CollectionEnabled -and -not $result.ReadVerified) { throw 'Enabled page-view endpoint is not readable.' }
          $clicks = & .\scripts\get-download-clicks.ps1 -Probe
          $clicks | Select-Object Provider, Metric, Status, ReadVerified, CollectionEnabled, HttpStatus, CheckedAt | ConvertTo-Json
          if ($clicks.CollectionEnabled -and -not $clicks.ReadVerified) { throw 'Enabled download-click endpoint is not readable.' }

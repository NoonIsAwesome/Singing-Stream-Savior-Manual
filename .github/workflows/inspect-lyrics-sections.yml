name: Inspect lyrics documentation assets
on:
  push:
    branches: [verify/lyrics-sections-20260921]
    paths: [.github/workflows/inspect-lyrics-sections.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: b472f9659c1dfa0df42bb0caaf258f8161e8ba3b
      - name: Package existing documentation and screenshots without running scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, subprocess
          assert not subprocess.check_output(['git','status','--porcelain']).strip()
          files=[p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and (p.suffix in ['.md','.html','.json','.yml','.mjs','.css','.js'] or p.name in ['lyrics-viewer.png','demo-lyrics-preview.png','lyrics-reading-preview.png'])]
          with zipfile.ZipFile('/tmp/lyrics-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in files: z.write(p,p.as_posix())
          print('Read-only source bundle:',len(files),'files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-documentation-source
          path: /tmp/lyrics-source.zip
          retention-days: 1

name: Player window guide live verification

on:
  push:
    branches: [verify/counterapi-v2-live-20260921]
    paths: [.github/workflows/player-window-live-verification.yml]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b472f9659c1dfa0df42bb0caaf258f8161e8ba3b
          persist-credentials: false
      - name: Read deployed guide pages without executing counters or downloading installation files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          import {setTimeout as sleep} from 'node:timers/promises';
          const commit='b472f9659c1dfa0df42bb0caaf258f8161e8ba3b';
          const origin='https://noonisawesome.github.io',base='/Singing-Stream-Savior-Manual/';
          const copies=JSON.parse(readFileSync('_data/player_window_buttons.json','utf8'));
          const views=JSON.parse(readFileSync('_data/analytics.json','utf8'));
          const clicks=JSON.parse(readFileSync('_data/download_clicks.json','utf8'));
          const attr=(tag,key)=>tag.match(new RegExp(`\\s${key}\\s*=\\s*["']([^"']*)["']`,'i'))?.[1];
          const decode=t=>t.replace(/&#(?:39|x27);|&apos;/gi,"'").replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
          const report=o=>{const line=JSON.stringify(o);console.log(line);appendFileSync(process.env.GITHUB_STEP_SUMMARY,line+'\n\n');};
          async function read(path,binary=false){
            const url=new URL(base+path,origin);assert.equal(url.origin,origin);assert.ok(url.pathname.startsWith(base));
            url.searchParams.set('analytics','off');url.searchParams.set('verification',`${process.env.GITHUB_RUN_ID}-${Date.now()}`);
            const r=await fetch(url,{redirect:'error',cache:'no-store',credentials:'omit',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(12000)});
            return {status:r.status,body:binary?Buffer.from(await r.arrayBuffer()):await r.text()};
          }
          let ready=false;
          for(let i=0;i<24;i++){
            const r=await read('lyrics.html');ready=r.status===200&&r.body.includes(commit)&&r.body.includes('id="player-window-buttons"');
            if(ready)break;await sleep(5000);
          }
          assert.ok(ready,'Expected Pages deployment not visible');
          for(const lang of ['zh-TW','zh-CN','en','ja','ko']){
            const path=lang==='zh-TW'?'lyrics.html':`${lang}/guide.html`,r=await read(path);
            assert.equal(r.status,200);assert.ok(r.body.includes(commit));
            const section=r.body.match(/<section\b[^>]*id="player-window-buttons"[\s\S]*?<\/section>/)?.[0];assert.ok(section);
            const text=decode(section.replace(/<[^>]*>/g,'')),copy=copies[lang];
            for(const key of ['title','intro','lyrics_title','lyrics_body','youtube_title','youtube_body','modes','caption'])assert.ok(text.includes(copy[key]),`${lang}: ${key}`);
            assert.equal((r.body.match(/id="player-window-buttons"/g)||[]).length,1);
            assert.ok(section.includes('viewBox="1048 224 456 292"'));
            assert.ok(section.includes('x="1411" y="262"')&&section.includes('x="1451" y="262"'));
            assert.ok(/<a\b[^>]*>\s*<svg\b/.test(section),'Screenshot itself must link to the original');
            assert.ok(!/<figcaption[^>]*>[\s\S]*?<a\b[\s\S]*?<\/figcaption>/i.test(section),'Do not inherit image-link styling in caption');
            const body=r.body.match(/<body\b[^>]*>/)?.[0]||'';
            for(const [key,value] of Object.entries({'data-counter-enabled':String(views.enabled),'data-counter-name':views.counter,'data-download-counter-enabled':String(clicks.enabled),'data-download-counter-name':clicks.counter}))assert.equal(attr(body,key),value);
            report({lang,path,http:200,copy_and_annotations_verified:true,counter_config_unchanged:true});
          }
          const image=await read('assets/images/demo-lyrics-preview.png',true);assert.equal(image.status,200);assert.ok(image.body.equals(readFileSync('assets/images/demo-lyrics-preview.png')));
          for(const path of ['assets/js/site-analytics.js','assets/js/download-clicks.js']){
            const r=await read(path);assert.equal(r.status,200);assert.equal(r.body,readFileSync(path,'utf8'));
          }
          assert.equal((await read('scripts/validate-player-window-guide.mjs')).status,404);
          report({commit,checked_at:new Date().toISOString(),five_language_pages_verified:true,original_screenshot_unchanged:true,counter_requests:0,release_asset_downloads:0,verification:'Read-only production HTTP content comparison; no scripts executed'});
          NODE

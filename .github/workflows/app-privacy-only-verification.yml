name: App-only privacy deployment verification

on:
  push:
    branches: [verify/counterapi-v2-live-20260921]
    paths: [.github/workflows/app-privacy-only-verification.yml]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 6bffe3f09c20b141725346f6d5a4bedb84aa0d67
          persist-credentials: false
      - name: Verify public pages without running scripts or counter requests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync, appendFileSync} from 'node:fs';
          import {setTimeout as sleep} from 'node:timers/promises';
          const origin='https://noonisawesome.github.io', base='/Singing-Stream-Savior-Manual/';
          const commit='6bffe3f09c20b141725346f6d5a4bedb84aa0d67';
          const data=JSON.parse(readFileSync('_data/privacy.json','utf8'));
          const views=JSON.parse(readFileSync('_data/analytics.json','utf8'));
          const clicks=JSON.parse(readFileSync('_data/download_clicks.json','utf8'));
          const report=obj=>{const line=JSON.stringify({checked_at:new Date().toISOString(),...obj});console.log(line);appendFileSync(process.env.GITHUB_STEP_SUMMARY,'```json\n'+line+'\n```\n');};
          const attr=(tag,name)=>tag.match(new RegExp(`\\s${name}\\s*=\\s*["']([^"']*)["']`,'i'))?.[1];
          const visible=html=>html.replace(/<!--[\s\S]*?-->/g,'').replace(/<(script|style|template)\b[^>]*>[\s\S]*?<\/\1>/gi,'').replace(/<[^>]*>/g,'');
          // Only this site's HTML, JS, CSS, sitemap and retired maintenance URLs are allowed.
          // No CounterAPI endpoints, /up, /down, /reset or release assets are requested.
          async function read(path){
            const url=new URL(base+path,origin);
            assert.equal(url.origin,origin);assert.ok(url.pathname.startsWith(base));
            url.searchParams.set('analytics','off');
            url.searchParams.set('verification',`${process.env.GITHUB_RUN_ID}-${Date.now()}`);
            const r=await fetch(url,{method:'GET',redirect:'error',cache:'no-store',credentials:'omit',headers:{'Cache-Control':'no-cache','User-Agent':'S3S-ReadOnly-Privacy-Verification'},signal:AbortSignal.timeout(12000)});
            const text=await r.text();assert.ok(text.length<4000000);
            return {status:r.status,text};
          }
          let ready=false;
          for(let i=0;i<24;i++){
            const page=await read('privacy.html');
            ready=page.status===200&&page.text.includes('data-privacy-content="app"')&&!page.text.includes('website-privacy.html')&&page.text.includes(commit);
            if(ready)break;await sleep(5000);
          }
          assert.ok(ready,'Expected deployment not yet visible');
          let pages=0;
          for(const lang of ['zh-TW','zh-CN','en','ja','ko']){
            const prefix=lang==='zh-TW'?'':lang+'/';
            for(const page of ['', 'resources.html','privacy.html']){
              const r=await read(prefix+page);assert.equal(r.status,200);
              const html=r.text, body=html.match(/<body\b[^>]*>/i)?.[0]||'';
              assert.ok(!/CounterAPI|官網統計|官网统计/i.test(visible(html)),'Unwanted visible statistics text');
              const anchors=[...html.matchAll(/<a\b[^>]*>/gi)].map(([t])=>t);
              assert.ok(!anchors.some(t=>/website-privacy\.html|counterapi\.dev/i.test(attr(t,'href')||'')),'Unwanted public statistics link');
              const footer=html.match(/<footer\b[^>]*>[\s\S]*?<\/footer>/i)?.[0]||'';
              const links=[...footer.matchAll(/<a\b[^>]*>/gi)].map(([t])=>t);
              assert.equal(links.filter(t=>attr(t,'href')===base+prefix+'privacy.html').length,1);
              for(const [key,value] of Object.entries({'data-counter-enabled':String(views.enabled),'data-counter-name':views.counter,'data-counter-workspace':views.workspace,'data-download-counter-enabled':String(clicks.enabled),'data-download-counter-name':clicks.counter}))assert.equal(attr(body,key),value);
              if(page==='privacy.html'){
                const main=html.match(/<main\b[^>]*>[\s\S]*?<\/main>/i)?.[0]||'';
                assert.ok(main.includes(`<h1>${data[lang].title}</h1>`));
                for(const term of ['LRCLIB','MusicBrainz','Cover Art Archive','TagLib'])assert.ok(main.includes(term));
                for(const project of data.projects)assert.ok(anchors.some(t=>attr(t,'href')===project.url));
                for(const other of ['zh-TW','zh-CN','en','ja','ko']){
                  const target=base+(other==='zh-TW'?'':other+'/')+'privacy.html';
                  assert.ok([...html.matchAll(/<option\b[^>]*>/gi)].some(([t])=>attr(t,'data-lang')===other&&attr(t,'value')===target));
                }
              }
              pages++;
            }
            assert.equal((await read(prefix+'website-privacy.html')).status,404,'Retired page must be absent');
            report({locale:lang,app_privacy_and_links_verified:true,retired_page_http:404,unchanged_counter_config:true});
          }
          for(const file of ['assets/js/site-analytics.js','assets/js/download-clicks.js','assets/css/privacy.css']){
            const r=await read(file);assert.equal(r.status,200);assert.equal(r.text,readFileSync(file,'utf8'),'Deployed source mismatch');
          }
          for(const path of ['scripts/PRIVACY_NOTICE_REVIEW.md','scripts/get-site-stats.ps1',encodeURIComponent('查看網站統計.cmd')])assert.equal((await read(path)).status,404);
          const sitemap=await read('sitemap.xml');assert.equal(sitemap.status,200);assert.ok(!sitemap.text.includes('website-privacy'));
          report({commit,public_pages_checked:pages,removed_pages_checked:5,app_notice_languages:5,public_statistics_copy_removed:true,counter_scripts_match_source:true,counter_requests:0,release_asset_downloads:0,verification:'HTTP content and source comparison; not visual browser inspection'});
          NODE

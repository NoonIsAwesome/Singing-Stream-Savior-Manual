name: Privacy developer wording verification

on:
  push:
    branches: [verify/counterapi-v2-live-20260921]
    paths: [.github/workflows/privacy-wording-verification.yml]

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4bdb7cde367a5f6fc8fe10a58b41d4a7ced0abf8
          persist-credentials: false
      - name: Verify five live privacy pages without executing scripts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';
          const commit = '4bdb7cde367a5f6fc8fe10a58b41d4a7ced0abf8';
          const origin = 'https://noonisawesome.github.io';
          const base = '/Singing-Stream-Savior-Manual/';
          const data = JSON.parse(readFileSync('_data/privacy.json', 'utf8'));
          const decode = text => text.replace(/&#(?:39|x27);|&apos;/gi, "'").replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
          async function read(path) {
            const url = new URL(base + path, origin);
            assert.equal(url.origin, origin);
            assert.ok(url.pathname.startsWith(base));
            url.searchParams.set('analytics', 'off');
            url.searchParams.set('verification', `${process.env.GITHUB_RUN_ID}-${Date.now()}`);
            const r = await fetch(url, { redirect: 'error', cache: 'no-store', credentials: 'omit', headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(12000) });
            const html = await r.text();
            assert.ok(html.length < 4000000);
            return { status: r.status, html };
          }
          let ready = false;
          for (let i = 0; i < 18; i++) {
            const r = await read('privacy.html');
            ready = r.status === 200 && r.html.includes(commit);
            if (ready) break;
            await sleep(5000);
          }
          assert.ok(ready, 'Expected deployment is not yet available');
          for (const lang of ['zh-TW', 'zh-CN', 'en', 'ja', 'ko']) {
            const copy = data[lang];
            const paragraphs = copy.sections.flatMap(s => s.paragraphs);
            assert.ok(!/沐橙|Noon/.test(JSON.stringify([paragraphs, copy.contact_text])), `${lang}: author name remains in prose`);
            assert.ok(copy.scope.includes('NoonIsAwesome'), `${lang}: formal identity must remain`);
            const r = await read((lang === 'zh-TW' ? '' : lang + '/') + 'privacy.html');
            assert.equal(r.status, 200);
            assert.ok(r.html.includes(commit));
            const main = r.html.match(/<main\b[^>]*>[\s\S]*?<\/main>/i)?.[0];
            assert.ok(main, `${lang}: main content missing`);
            const text = decode(main.replace(/<[^>]*>/g, ''));
            for (const expected of [...paragraphs, copy.scope, copy.contact_text]) assert.ok(text.includes(expected), `${lang}: deployed prose mismatch`);
            assert.ok(!/CounterAPI|website-statistics/.test(text));
            const result = JSON.stringify({ locale: lang, http: r.status, developer_wording_verified: true, formal_identity_preserved: true });
            console.log(result);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, result + '\n\n');
          }
          const result = JSON.stringify({ commit, checked_at: new Date().toISOString(), languages: 5, counter_requests: 0, release_asset_downloads: 0, verification: 'Read-only HTTP text comparison, no browser scripts executed' });
          console.log(result);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, result + '\n');
          NODE

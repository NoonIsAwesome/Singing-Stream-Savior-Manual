name: Verify registered CounterAPI V2 endpoint

on:
  push:
    branches: [verify/counterapi-v2-live-20260921]
    paths: [.github/workflows/counter-live-verification.yml]

permissions:
  contents: read

jobs:
  single-increment:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check existing browser and Node availability
        run: |
          node --version
          command -v google-chrome || command -v chromium || true
      - name: Anonymous read, one authorized increment, and readback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';
          const endpoint = 'https://api.counterapi.dev/v2/noonisawesome-singing-stream-savior-manual/noonisawesome-s3s-manual-pageviews';
          const origin = 'https://noonisawesome.github.io';
          const report = (value) => {
            const text = JSON.stringify({ checked_at: new Date().toISOString(), ...value });
            console.log(text);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + text + '\n```\n');
          };
          const validData = (payload) => [200, '200'].includes(payload?.code)
            && Number.isSafeInteger(payload?.data?.up_count) && payload.data.up_count >= 0
            && Number.isSafeInteger(payload?.data?.down_count) && payload.data.down_count >= 0
            && payload.data.down_count <= payload.data.up_count;
          async function request(suffix = '') {
            assert.ok(suffix === '' || suffix === '/up');
            const response = await fetch(endpoint + suffix, {
              method: 'GET', redirect: 'error', cache: 'no-store', credentials: 'omit',
              headers: { Accept: 'application/json', Origin: origin, 'Cache-Control': 'no-cache', 'User-Agent': 'S3S-Counter-Setup-Verification' },
              signal: AbortSignal.timeout(15000),
            });
            const cors = response.headers.get('access-control-allow-origin');
            report({ operation: suffix ? 'one-test-increment' : 'read-only', http_status: response.status, cors_allows_site: cors === '*' || cors === origin, authorization_sent: false });
            assert.ok(response.ok, 'Counter endpoint rejected anonymous request; do not enable collection');
            assert.ok(cors === '*' || cors === origin, 'Counter response does not allow the production browser origin');
            const payload = await response.json();
            assert.ok(validData(payload), 'Counter response is incompatible with the existing V2 parser');
            return payload.data;
          }
          const before = await request();
          // Exactly one deliberate increment for the owner's requested setup test.
          // No retries, decrement, reset, secrets, or printing actual traffic totals.
          report({ test_increment_attempts: 1, warning: 'This setup check adds one test view if accepted. Do not rerun the mutation.' });
          await request('/up');
          let reflected = false;
          for (const delay of [0, 5000, 15000, 30000, 60000]) {
            if (delay) await sleep(delay);
            const after = await request();
            if (after.up_count >= before.up_count + 1 && after.down_count === before.down_count) {
              reflected = true; break;
            }
          }
          report({ anonymous_read_verified: true, anonymous_increment_accepted: true, readback_increase_observed: reflected, authorized_test_increment_attempts: 1, browser_execution_verified: false });
          assert.ok(reflected, 'Increment accepted but not yet visible within the bounded readback window; do not issue another increment');
          NODE

name: Read-only registered CounterAPI V2 verification

on:
  push:
    branches: [verify/counterapi-v2-live-20260921]
    paths: [.github/workflows/counter-live-verification.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registered-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read persisted counter without further increments
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFileSync } from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';
          const base = 'https://api.counterapi.dev/v2/noonisawesome-singing-stream-savior-manual/noonisawesome-s3s-manual-pageviews';
          const origin = 'https://noonisawesome.github.io';
          const report = value => {
            const line = JSON.stringify({ checked_at: new Date().toISOString(), ...value });
            console.log(line);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + line + '\n```\n');
          };
          // The new counter was shown at zero in the owner's setup screenshot.
          // Run 35570042746 sent exactly one /up at 2026-09-21T06:48:23Z.
          // Do NOT repeat that mutation. A later positive value confirms stored
          // activity, but cannot by itself rule out another concurrent visitor.
          let observed = false;
          for (let attempt = 0; attempt < 8; attempt++) {
            if (attempt) await sleep(60000);
            const url = new URL(base);
            url.searchParams.set('verification', `${process.env.GITHUB_RUN_ID}-${attempt}`);
            const r = await fetch(url, {
              method: 'GET', redirect: 'error', cache: 'no-store', credentials: 'omit',
              headers: { Accept: 'application/json', Origin: origin, 'Cache-Control': 'no-cache' },
              signal: AbortSignal.timeout(15000),
            });
            const cors = r.headers.get('access-control-allow-origin');
            report({ operation: 'read-only', attempt: attempt + 1, http_status: r.status,
              cors_allows_site: cors === '*' || cors === origin, authorization_sent: false });
            assert.equal(r.status, 200, 'Anonymous read rejected');
            assert.ok(cors === '*' || cors === origin, 'CORS does not allow the site');
            const p = await r.json();
            assert.ok([200, '200'].includes(p?.code));
            assert.ok(Number.isSafeInteger(p?.data?.up_count) && p.data.up_count >= 0);
            assert.ok(Number.isSafeInteger(p?.data?.down_count) && p.data.down_count >= 0 && p.data.down_count <= p.data.up_count);
            observed = p.data.up_count > 0;
            report({ valid_v2_payload: true, persisted_activity_observed: observed,
              response_date: r.headers.get('date'), cache_status: r.headers.get('cf-cache-status'),
              counter_mutations: 0 });
            if (observed) break;
          }
          assert.ok(observed, 'Buffered activity still not reflected; collection not verified. No further mutations were sent.');
          report({ anonymous_read_verified: true, persisted_activity_observed: true,
            counter_mutations: 0, browser_execution_verified: false });
          NODE

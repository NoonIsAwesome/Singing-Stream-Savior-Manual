title: 歌回救星 2.1 使用說明
description: Singing Stream Savior 2.1 繁體中文使用說明
lang: zh-TW
timezone: Asia/Taipei
url: https://noonisawesome.github.io
baseurl: /Singing-Stream-Savior-Manual

# CounterAPI V2 has one shared configuration: _data/analytics.json.
# Enable only after the owner's public V2 workspace/counter has been verified.
# Setup and metric limitations: scripts/ANALYTICS.md.

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-relative-links
  - jekyll-readme-index
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

readme_index:
  enabled: true
  remove_originals: false
  with_frontmatter: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - AGENTS.md
  - assets/README.md
  - scripts
  - 查看網站統計.cmd

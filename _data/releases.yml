    items:
      zh-TW:
        - 改善 BGM 淡出與伴奏轉場協調。
        - 改善速度、音高、跳轉回應與播放穩定性。
        - 改善歌詞偏移控制、即時同步、捲動及點擊歌詞跳轉。
        - 擴充歌詞字型、間距、讀音與前後顯示行數控制。
        - 新增「平假名＋羅馬拼音」日文讀音模式。
        - 改善動態主題預覽與內建主題的顯示效果。
        - 統一數值輸入、按鈕尺寸與操作提示，並改善翻譯。
        - 改善底部狀態區，讓 BGM 與伴奏自動化狀態清楚可見。
        - 丟給 Codex 工作的時候，看了很多貓貓影片。
      zh-CN:
        - 改善 BGM 淡出与伴奏转场协调。
        - 改善速度、音高、跳转响应与播放稳定性。
        - 改善歌词偏移控制、实时同步、滚动及点击歌词跳转。
        - 扩充歌词字体、间距、读音与前后显示行数控制。
        - 新增“平假名＋罗马拼音”日文读音模式。
        - 改善动态主题预览与内置主题的显示效果。
        - 统一数值输入、按钮尺寸与操作提示，并改善翻译。
        - 改善底部状态区，让 BGM 与伴奏自动化状态清楚可见。
        - 丢给 Codex 工作的时候，看了很多猫猫视频。
      ja:
        - BGM のフェードアウトと伴奏開始時の切替連携を改善しました。
        - 再生速度、ピッチ、シークの反応と再生安定性を改善しました。
        - 歌詞オフセット、リアルタイム同期、スクロール、歌詞クリックによるシークを改善しました。
        - 歌詞のフォント、間隔、読み、前後の表示行数に関する設定を拡張しました。
        - 日本語の読み表示に「ひらがな＋ローマ字」を追加しました。
        - テーマの自動プレビューと内蔵テーマの表示を改善しました。
        - 数値入力、ボタンサイズ、操作時の案内を統一し、翻訳を改善しました。
        - 下部ステータスを改善し、BGM と伴奏の自動連携を見えるようにしました。
        - Codex に作業を任せている間、猫の動画をたくさん見ました。
      ko:
        - BGM 페이드아웃과 반주 전환의 연동을 개선했습니다.
        - 재생 속도, 음정, 탐색 반응과 재생 안정성을 개선했습니다.
        - 가사 오프셋, 실시간 동기화, 스크롤과 가사 줄 클릭 탐색을 개선했습니다.
        - 가사 글꼴, 간격, 읽기와 앞뒤 표시 줄 수 설정을 확장했습니다.
        - 일본어 읽기 표시에 “히라가나＋로마자” 모드를 추가했습니다.
        - 테마 자동 미리보기와 내장 테마의 표시를 개선했습니다.
        - 숫자 입력, 버튼 크기와 조작 안내를 일관되게 정리하고 번역을 개선했습니다.
        - 하단 상태 영역을 개선해 BGM과 반주의 자동 연동 상태를 확인할 수 있습니다.
        - Codex에게 작업을 맡겨 둔 동안 고양이 영상을 많이 봤습니다.
      en:
        - Improved BGM fade-out and karaoke transition coordination.
        - Improved speed, pitch, seeking response, and playback stability.
        - Improved lyrics offset controls, live synchronization, scrolling, and line seeking.
        - Expanded lyrics typography, spacing, reading, and surrounding-line controls.
        - Added Hiragana plus Romaji reading mode.
        - Improved animated theme previews and the appearance of built-in themes.
        - Standardized numeric inputs, button sizes, and interaction hints, and improved translations.
        - Improved the bottom status area to make BGM and karaoke automation visible.
        - Watched a lot of cat videos while Codex was working.


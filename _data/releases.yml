    date: "2026-07-31"
    type:
      zh-TW: 重大更新
      zh-CN: 重大更新
      ja: メジャーアップデート
      ko: 주요 업데이트
      en: Major update
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.2.0"
    summary:
      zh-TW: 新增八步驟初次使用導覽，並改善拖放操作、歌詞間奏顯示與舊版 OBS 主題相容性。
      zh-CN: 新增八步初次使用引导，并改善拖放操作、歌词间奏显示与旧版 OBS 主题兼容性。
      ja: 8 ステップの初回ガイドを追加し、ドラッグ＆ドロップ、間奏中の歌詞表示、旧 OBS との互換性を改善しました。
      ko: 8단계 첫 사용 가이드를 추가하고 드래그 앤 드롭, 간주 중 가사 표시와 구형 OBS 호환성을 개선했습니다.
      en: Adds an eight-step first-use guide and improves drag-and-drop, lyrics during instrumental gaps, and compatibility with older OBS versions.
    items:
      zh-TW:
        - 新增八步驟初次使用導覽，依序說明設定 BGM、加入伴奏、編輯顯示歌名、準備待播、選擇歌單主題、開始演唱、選擇同步歌詞，以及將歌詞拖入 OBS。
        - 導覽可隨時從「說明 → 初次使用導覽」重新開啟。
        - 本機音訊檔與 YouTube 連結可拖放到完整的 BGM 或伴奏目標區，不再需要精準放到按鈕上。
        - 改善導覽的高亮位置，讓每一步都能正確指向操作區域。
        - 歌詞在間奏期間不再跳回第一行歌曲資訊；後面仍有歌詞時，畫面會停靠在下一句，但不會誤將它標成目前句。
        - 改善舊版 OBS 的主題顯示相容性，透明背景與主題框線可正常呈現。
        - 丟給 Codex 工作的時候看了 Netflix《聰明鎮》，有點難看。
      zh-CN:
        - 新增八步初次使用引导，依次说明设置 BGM、添加伴奏、编辑显示歌名、准备待播、选择歌单主题、开始演唱、选择同步歌词，以及将歌词拖入 OBS。
        - 引导可随时从“帮助 → 初次使用引导”重新打开。
        - 本地音频文件与 YouTube 链接可拖放到完整的 BGM 或伴奏目标区域，不再需要精准放到按钮上。
        - 改善引导的高亮位置，让每一步都能正确指向操作区域。
        - 歌词在间奏期间不再跳回第一行歌曲信息；后面仍有歌词时，画面会停靠在下一句，但不会误将它标为当前句。
        - 改善旧版 OBS 的主题显示兼容性，透明背景与主题边框可正常呈现。
        - 丢给 Codex 工作的时候看了 Netflix《聪明镇》，有点难看。
      ja:
        - BGM 設定、伴奏の追加、表示曲名の編集、待機リスト、オーバーレイテーマ、歌唱開始、同期歌詞の選択、歌詞の OBS 追加までを案内する 8 ステップの初回ガイドを追加しました。
        - ガイドは「ヘルプ → 初回ガイド」からいつでも再表示できます。
        - ローカル音声ファイルと YouTube リンクを、ボタンだけでなく BGM／伴奏エリア全体へドロップできるようにしました。
        - ガイドの強調位置を改善し、各ステップが正しい操作箇所を示すようにしました。
        - 間奏中に歌詞が先頭の曲情報へ戻らなくなりました。後続の歌詞がある場合は次の行を基準に表示しますが、現在行として誤って強調しません。
        - 旧バージョンの OBS とのテーマ表示互換性を改善し、透明背景とテーマ枠線が正しく表示されるようにしました。
        - Codex に作業を任せている間に Netflix の『Bloody Smart（聰明鎮）』を見ました。ちょっと微妙でした。
      ko:
        - BGM 설정, 반주 추가, 표시 곡명 편집, 대기 목록, 오버레이 테마, 공연 시작, 동기화 가사 선택과 OBS 가사 추가를 안내하는 8단계 첫 사용 가이드를 추가했습니다.
        - 가이드는 “도움말 → 첫 사용 가이드”에서 언제든 다시 열 수 있습니다.
        - 로컬 오디오 파일과 YouTube 링크를 버튼뿐 아니라 BGM 또는 반주 영역 전체에 드롭할 수 있습니다.
        - 가이드 강조 위치를 개선해 각 단계가 올바른 조작 영역을 가리키도록 했습니다.
        - 간주 중 가사가 첫 번째 곡 정보 줄로 돌아가지 않습니다. 뒤에 가사가 있으면 다음 줄을 기준으로 표시하지만 현재 줄로 잘못 강조하지 않습니다.
        - 구형 OBS의 테마 표시 호환성을 개선해 투명 배경과 테마 테두리가 정상적으로 표시됩니다.
        - Codex에게 작업을 맡겨 둔 동안 Netflix의 《Bloody Smart (聰明鎮)》를 봤는데, 조금 별로였습니다.
      en:
        - Added an eight-step first-use guide covering BGM setup, karaoke tracks, display names, the queue, overlay themes, starting a performance, synchronized lyrics, and sending lyrics to OBS.
        - The guide can be reopened at any time from Help → First-use Guide.
        - Local audio files and YouTube links can be dropped across the full BGM or karaoke target area instead of requiring an exact drop on the button.
        - Improved guide highlights so every step points to the correct area of the interface.
        - Lyrics no longer jump to the first metadata line during instrumental gaps. When another lyric follows, the display anchors to it without falsely marking it active.
        - Improved theme compatibility with older OBS versions so transparent backgrounds and theme borders display correctly.
        - Watched Netflix's “Bloody Smart” while Codex was working. It was kind of bad.

  - version: "2.0.1.3"
    date: "2026-07-31"
    type:
      zh-TW: 穩定性更新
      zh-CN: 稳定性更新
      ja: 安定性アップデート
      ko: 안정성 업데이트
      en: Stability update
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.1.3"
    summary:
      zh-TW: 加強 YouTube 快速切歌、播放清單匯入及啟動器更新復原。
      zh-CN: 加强 YouTube 快速切歌、播放列表导入及启动器更新恢复。
      ja: YouTube の高速切替、プレイリストの読み込み、ランチャー更新の復旧処理を強化しました。
      ko: 빠른 YouTube 곡 전환, 재생목록 가져오기와 런처 업데이트 복구를 강화했습니다.
      en: Improves rapid YouTube switching, playlist imports, and launcher recovery.
    items:
      zh-TW:
        - 改善快速切換 YouTube 歌曲時的播放穩定性，避免切歌後播放錯誤的歌曲。
        - YouTube 播放失敗時會自動重新嘗試，減少必須重啟軟體的情況。
        - 快速切歌期間，播放狀態、Overlay 目前歌曲與已播紀錄會維持同步。
        - 在自訂歌單內拖入 YouTube 單曲時，歌曲會正確加入目前歌單。
        - 拖入 YouTube 播放清單時提供四種選擇：全部加入目前歌單、建立新歌單、只加入全部歌曲，或取消。
        - 改善線上歌詞搜尋的連線穩定性。
        - 改善啟動器更新失敗或下載不完整時的自動復原。
        - 現有使用者會由更新後的主程式在背景自動取得新版啟動器。
        - 丟給 Codex 工作的時候，滑了很多吉伊卡哇。
      zh-CN:
        - 改善快速切换 YouTube 歌曲时的播放稳定性，避免切歌后播放错误的歌曲。
        - YouTube 播放失败时会自动重新尝试，减少必须重启软件的情况。
        - 快速切歌期间，播放状态、Overlay 当前歌曲与已播记录会保持同步。
        - 在自定义歌单内拖入 YouTube 单曲时，歌曲会正确加入当前歌单。
        - 拖入 YouTube 播放列表时提供四种选择：全部加入当前歌单、建立新歌单、只加入全部歌曲，或取消。
        - 改善在线歌词搜索的连接稳定性。
        - 改善启动器更新失败或下载不完整时的自动恢复。
        - 现有用户会由更新后的主程序在后台自动取得新版启动器。
        - 丢给 Codex 工作的时候，刷了很多吉伊卡哇。
      ja:
        - YouTube 曲を素早く切り替えた際の再生安定性を改善し、切替後に別の曲が再生される問題を防ぎます。
        - YouTube の再生に失敗した場合は自動的に再試行し、アプリの再起動が必要になる状況を減らしました。
        - 高速切替中も再生状態、Overlay の現在曲、歌唱済み履歴が同期を保ちます。
        - カスタムプレイリストを表示中に YouTube 動画をドロップすると、そのプレイリストへ正しく追加されます。
        - YouTube プレイリストのドロップ時に「現在のプレイリストへ全曲追加」「新規プレイリスト作成」「すべての曲だけへ追加」「キャンセル」の 4 項目を選べます。
        - オンライン歌詞検索の接続安定性を改善しました。
        - ランチャー更新の失敗や不完全なダウンロードからの自動復旧を改善しました。
        - 既存ユーザーのランチャーは、更新後のメインアプリから自動的に更新されます。
        - Codex に作業を任せている間、ちいかわをたくさん眺めていました。
      ko:
        - YouTube 곡을 빠르게 전환할 때의 재생 안정성을 개선해 전환 후 잘못된 곡이 재생되는 문제를 방지합니다.
        - YouTube 재생에 실패하면 자동으로 다시 시도해 앱을 재시작해야 하는 경우를 줄였습니다.
        - 빠른 곡 전환 중에도 재생 상태, Overlay의 현재 곡과 재생 완료 기록이 동기화됩니다.
        - 사용자 재생목록을 보고 있을 때 YouTube 영상을 드롭하면 해당 재생목록에 정확히 추가됩니다.
        - YouTube 재생목록을 드롭하면 “현재 재생목록에 모두 추가”, “새 재생목록 만들기”, “전체 곡에만 추가”, “취소”의 네 가지 선택지를 제공합니다.
        - 온라인 가사 검색의 연결 안정성을 개선했습니다.
        - 런처 업데이트 실패나 불완전한 다운로드에서 자동 복구하는 기능을 개선했습니다.
        - 기존 사용자는 업데이트된 메인 앱을 통해 새 런처를 자동으로 받습니다.
        - Codex에게 작업을 맡겨 둔 동안 치이카와를 잔뜩 봤습니다.
      en:
        - Improved playback stability when switching rapidly between YouTube songs, preventing the wrong song from taking over.
        - YouTube playback now retries automatically after a failure, reducing cases that require restarting the application.
        - Playback state, the overlay's current song, and played-song history stay synchronized during rapid changes.
        - Dropping a YouTube video while viewing a custom playlist now adds it to that playlist.
        - Dropping a YouTube playlist offers four choices: add all videos to the current playlist, create a new playlist, add only to All Songs, or cancel.
        - Improved connection stability for online lyrics searches.
        - Improved automatic recovery when a launcher update fails or downloads incompletely.
        - Existing users receive the launcher update automatically through the updated main application.
        - Scrolled through a lot of Chiikawa while Codex was working.

  - version: "2.0.1.2"
    date: "2026-07-31"
    type:
      zh-TW: 穩定性更新
      zh-CN: 稳定性更新
      ja: 安定性アップデート
      ko: 안정성 업데이트
      en: Stability update
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.1.2"
    summary:
      zh-TW: 改善播放可靠性、歌詞操作與全軟體深色介面一致性。
      zh-CN: 改善播放可靠性、歌词操作与全软件深色界面一致性。
      ja: 再生の信頼性、歌詞操作、アプリ全体のダーク表示を改善しました。
      ko: 재생 안정성, 가사 사용성과 앱 전체의 다크 화면 일관성을 개선했습니다.
      en: Improves playback reliability, lyrics usability, and visual consistency.
    items:
      zh-TW:
        - 改善部分 YouTube 連結偶爾無法播放，且必須重啟軟體才能恢復的問題。
        - 改善部分 YouTube 連結無法正確辨識歌名的問題。
        - 改善部分 OBS 環境拖入歌單後出現黑底的問題，透明主題可維持透明背景。
        - 新增歌詞簡繁轉換，並依介面語言採用合適預設；日文假名不受影響。
        - 歌詞時間調整、可見行數與獨立歌詞視窗更加清楚且穩定。
        - 對話框與次要視窗統一使用軟體的深色外觀。
        - 丟給Codex工作的時候，練了一下吉他。
      zh-CN:
        - 改善部分 YouTube 链接偶尔无法播放，且必须重启软件才能恢复的问题。
        - 改善部分 YouTube 链接无法正确识别歌名的问题。
        - 改善部分 OBS 环境拖入歌单后出现黑底的问题，透明主题可保持透明背景。
        - 新增歌词简繁转换，并依界面语言采用合适默认值；日文假名不受影响。
        - 歌词时间调整、可见行数与独立歌词窗口更加清楚且稳定。
        - 对话框与次要窗口统一使用软件的深色外观。
        - 丢给Codex工作的时候，练了一下吉他。
      ja:
        - 一部の YouTube リンクが再生できず、復旧にアプリの再起動が必要になる問題を改善しました。
        - 一部の YouTube リンクで曲名を正しく取得できない問題を改善しました。
        - 一部の OBS 環境で歌リストを追加した際に黒い背景が表示される問題を改善し、透明テーマの背景を維持します。
        - 歌詞の簡体字／繁体字変換と、UI 言語に応じた既定値を追加しました。日本語のかなには影響しません。
        - 歌詞タイミング、表示行数、独立歌詞ウィンドウの操作を分かりやすく安定させました。
        - ダイアログとサブウィンドウをアプリ共通のダーク表示に統一しました。
        - Codex に作業を任せている間、少しギターを練習しました。
      ko:
        - 일부 YouTube 링크가 재생되지 않고 복구하려면 앱을 재시작해야 하는 문제를 개선했습니다.
        - 일부 YouTube 링크에서 곡명을 올바르게 가져오지 못하는 문제를 개선했습니다.
        - 일부 OBS 환경에서 노래 목록을 추가한 뒤 검은 배경이 나타나는 문제를 개선해 투명 테마의 배경을 유지합니다.
        - 중국어 간체／번체 가사 변환과 UI 언어에 맞는 기본값을 추가했습니다. 일본어 가나는 변경하지 않습니다.
        - 가사 시간, 표시 줄 수와 분리된 가사 창의 조작을 더 명확하고 안정적으로 개선했습니다.
        - 대화상자와 보조 창을 앱의 다크 화면으로 일관되게 표시합니다.
        - Codex에게 작업을 맡겨 둔 동안 기타를 조금 연습했습니다.
      en:
        - Improved an issue where some YouTube links could stop playing until the application was restarted.
        - Improved song-title detection for some YouTube links.
        - Improved an issue where song-list overlays could show a black background in some OBS environments, preserving transparent themes.
        - Added Simplified and Traditional Chinese lyrics conversion with language-aware defaults; Japanese kana remain unchanged.
        - Lyrics timing controls, visible-line controls, and the detached lyrics window are clearer and more stable.
        - Dialogs and secondary windows consistently use the application's dark appearance.
        - Practiced guitar for a while while Codex was working.

  - version: "2.0.1.1"
    date: "2026-07-31"
    type:
      zh-TW: 啟動器修補
      zh-CN: 启动器修补
      ja: ランチャー修正
      ko: 런처 수정
      en: Launcher hotfix
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.1.1"
    summary:
      zh-TW: 主程式可在背景自動更新啟動器，並改善更新失敗時的復原。
      zh-CN: 主程序可在后台自动更新启动器，并改善更新失败时的恢复。
      ja: メインアプリからランチャーを自動更新し、失敗時の復旧を改善しました。
      ko: 메인 앱에서 런처를 자동 업데이트하고 실패 시 복구를 개선했습니다.
      en: Adds automatic launcher updates through the main application and improves recovery after failures.
    items:
      zh-TW:
        - 主程式可在背景自動更新啟動器。
        - 啟動器更新進度使用既有的深色底部狀態區，不再顯示第二個確認視窗。
        - 啟動器替換或設定更新失敗時會安全回復，並在下次啟動再次嘗試。
        - 丟給Codex工作的時候，吃了一個布丁，爽的。
      zh-CN:
        - 主程序可在后台自动更新启动器。
        - 启动器更新进度使用现有的深色底部状态区，不再显示第二个确认窗口。
        - 启动器替换或设置更新失败时会安全恢复，并在下次启动再次尝试。
        - 丢给Codex工作的时候，吃了一个布丁，爽的。
      ja:
        - メインアプリからランチャーをバックグラウンドで自動更新できます。
        - ランチャー更新の進捗を既存のダークな下部ステータスに表示し、二重の確認ダイアログをなくしました。
        - ランチャーの置換や設定更新に失敗した場合は安全に元へ戻し、次回起動時に再試行します。
        - Codex に作業を任せている間、プリンを一つ食べました。最高でした。
      ko:
        - 메인 앱에서 런처를 백그라운드로 자동 업데이트합니다.
        - 런처 업데이트 진행 상황을 기존의 다크 하단 상태 영역에 표시하고 두 번째 확인 대화상자를 없앴습니다.
        - 런처 교체나 설정 업데이트가 실패하면 안전하게 되돌리고 다음 실행에서 다시 시도합니다.
        - Codex에게 작업을 맡겨 둔 동안 푸딩을 하나 먹었습니다. 기분 최고였습니다.
      en:
        - The main application can update the launcher automatically in the background.
        - Launcher-update progress uses the existing dark bottom status area without a second confirmation dialog.
        - Failed launcher replacement or configuration updates roll back safely and retry on a later launch.
        - Ate a pudding while Codex was working. It was great.

  - version: "2.0.1.0"
    date: "2026-07-30"
    type:
      zh-TW: 功能與操作更新
      zh-CN: 功能与操作更新
      ja: 機能・操作アップデート

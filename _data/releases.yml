releases:
  - version: "2.0.5.4"
    date: "2026-08-19"
    latest: true
    type:
      zh-TW: YouTube 播放相容性修正
      zh-CN: YouTube 播放兼容性修正
      ja: YouTube 再生互換性修正
      ko: YouTube 재생 호환성 수정
      en: YouTube playback compatibility hotfix
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.5.4"
    summary:
      zh-TW: 緊急修正近期 YouTube 播放問題，並加入分階段備援重試機制。
      zh-CN: 紧急修复近期 YouTube 播放问题，并加入分阶段备用重试机制。
      ja: 最近の YouTube 再生問題を緊急修正し、段階的な再試行と代替再生を追加しました。
      ko: 최근 YouTube 재생 문제를 긴급 수정하고 단계별 재시도와 대체 재생을 추가했습니다.
      en: Urgently fixes recent YouTube playback issues with staged retries and fallback playback.
    items:
      zh-TW:
        - 緊急修正近期 YouTube 播放相容性問題，新增分階段重試與備援播放機制。
        - 備援播放仍可使用調速、升降 Key、Seek、Loop，以及伴奏播放時的 BGM 自動切換。
        - 下一個主要版本正在準備多項大型功能，因調整範圍較廣，還需要一些時間完成，感謝大家耐心等候。
      zh-CN:
        - 紧急修复近期 YouTube 播放兼容性问题，新增分阶段重试与备用播放机制。
        - 备用播放仍可使用调速、升降 Key、Seek、Loop，以及伴奏播放时的 BGM 自动切换。
        - 下一个主要版本正在准备多项大型功能，由于调整范围较广，还需要一些时间完成，感谢大家耐心等待。
      ja:
        - 最近の YouTube 再生互換性の問題を緊急修正し、段階的な再試行と代替再生を追加しました。
        - 代替再生でも速度調整、キー変更、Seek、Loop、伴奏再生時の BGM 自動切り替えを利用できます。
        - 次のメジャーバージョンでは複数の大型機能を準備しています。変更範囲が広いため、完成まで今しばらくお待ちください。
      ko:
        - 최근 YouTube 재생 호환성 문제를 긴급 수정하고 단계별 재시도와 대체 재생 기능을 추가했습니다.
        - 대체 재생에서도 속도 조절, Key 변경, Seek, Loop와 반주 재생 중 BGM 자동 전환을 사용할 수 있습니다.
        - 다음 주요 버전에서 여러 대형 기능을 준비하고 있습니다. 변경 범위가 넓어 완료까지 시간이 조금 더 필요하니 기다려 주셔서 감사합니다.
      en:
        - Urgently fixes recent YouTube playback compatibility issues and adds staged retries with fallback playback.
        - Fallback playback still supports tempo, key changes, seek, loop, and automatic BGM switching during karaoke playback.
        - Several major features are being prepared for the next major release. The scope is broad, so completion will take more time; thank you for your patience.
  - version: "2.0.5.3"
    date: "2026-08-09"
    latest: false
    type:
      zh-TW: 播放與 Overlay 修正
      zh-CN: 播放与 Overlay 修正
      ja: 再生・Overlay 修正
      ko: 재생 및 Overlay 수정
      en: Playback and Overlay hotfix
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.5.3"
    summary:
      zh-TW: 改善起播順暢度與大量歌曲操作，並統一 Card、Default、Transparent 清單的固定速度循環捲動。
      zh-CN: 改善开始播放与大量歌曲操作，并统一 Card、Default、Transparent 列表的固定速度循环滚动。
      ja: 再生開始時の安定性と大量の曲を扱う操作を改善し、Card／Default／Transparent のリストを一定速度のループスクロールに統一しました。
      ko: 재생 시작과 많은 곡을 다루는 작업을 개선하고 Card, Default, Transparent 목록을 일정 속도 순환 스크롤로 통일했습니다.
      en: Improves playback startup and large-list operations, with fixed-speed loop scrolling for Card, Default, and Transparent lists.
    items:
      zh-TW:
        - Card、Default 與 Transparent 系列的 Set List／Reserve 改為固定速度單向捲動；到底閃爍後回頂重新開始，不再因歌曲變多而加速。
        - 清單捲動速度可調整為 8–60 px/s，預設 17 px/s；主題也能透過 manifest 共用捲動或翻頁規則。
        - 本機／遠端播放來源會先在背景完成 100／200 ms 安全預載，降低剛起播時短暫音訊中斷的機率。
        - 播放圖示改為局部更新，並修正自然播放結束後播放圖示或歌詞可能殘留。
        - 待播支援多選刪除，已唱新增清空功能；自動狀態列也改成燈號與文字的精簡樣式。
        - 把工作交給Codex之後，吃了一份臭豆腐，很好吃OuOb
      zh-CN:
        - Card、Default 与 Transparent 系列的 Set List／Reserve 改为固定速度单向滚动；到底闪烁后回到顶部重新开始，不再因歌曲增多而加速。
        - 列表滚动速度可在 8–60 px/s 之间调整，默认 17 px/s；主题也可通过 manifest 共用滚动或翻页规则。
        - 本地／远程播放源会先在后台完成 100／200 ms 安全预缓冲，降低刚开始播放时短暂无声或中断的概率。
        - 播放图标改为局部更新，并修复自然播放结束后播放图标或歌词可能残留的问题。
        - 待播支持多选删除，已唱新增清空功能；自动状态栏也改为指示灯与文字的简洁样式。
        - 把工作交给 Codex 后，吃了一份臭豆腐，很好吃 OuOb
      ja:
        - Card／Default／Transparent 系列の Set List と Reserve を一定速度の一方向スクロールに変更し、末尾で点滅した後に先頭へ戻るようにしました。
        - スクロール速度は 8～60 px/s の範囲で調整でき、既定値は 17 px/s です。テーマも manifest で共通のスクロール／ページ動作を宣言できます。
        - ローカル／リモート音源をバックグラウンドで 100／200 ms 事前バッファし、再生開始直後の短い音切れを抑えました。
        - 再生マーカーを必要な行だけ更新し、自然終了後に再生マーカーや歌詞が残る問題を修正しました。
        - Reserve の複数削除と歌唱履歴の全消去を追加し、自動状態表示をランプと文字だけの簡潔なデザインにしました。
        - Codex に作業を任せた後、臭豆腐を一皿食べました。とてもおいしかったです OuOb
      ko:
        - Card, Default 및 Transparent 계열의 Set List／Reserve를 일정 속도의 단방향 스크롤로 변경하고 마지막에서 깜박인 뒤 맨 위로 돌아가도록 했습니다.
        - 스크롤 속도는 8–60 px/s 범위에서 조절할 수 있고 기본값은 17 px/s입니다. 테마도 manifest로 공통 스크롤／페이지 규칙을 선언할 수 있습니다.
        - 로컬／원격 재생 소스를 백그라운드에서 100／200 ms 미리 버퍼링해 재생 직후의 짧은 끊김 가능성을 줄였습니다.
        - 재생 표시를 필요한 행만 갱신하고 자연 종료 뒤 재생 표시나 가사가 남는 문제를 수정했습니다.
        - Reserve 다중 삭제와 노래 기록 전체 지우기를 추가하고 자동 상태 표시를 램프와 텍스트만 남긴 간결한 형태로 바꿨습니다.
        - Codex에게 작업을 맡긴 뒤 취두부 한 접시를 먹었습니다. 아주 맛있었어요 OuOb
      en:
        - Card, Default, and Transparent Set List/Reserve panels now scroll at a constant speed, flash at the end, and restart from the top.
        - List speed is adjustable from 8–60 px/s with a 17 px/s default, and themes can declare shared scrolling or paging rules in their manifest.
        - Local and remote sources are prebuffered by 100/200 ms in the background to reduce brief startup dropouts.
        - Playback markers update only affected rows, and stale markers or lyrics after natural completion are cleared.
        - Added multi-row Reserve removal and Clear Sung History, and simplified the automation status to a lamp and text.
        - After handing the work to Codex, I ate a plate of stinky tofu. It was delicious OuOb
  - version: "2.0.5.2"
    date: "2026-08-06"
    latest: false
    type:
      zh-TW: 穩定性修正
      zh-CN: 稳定性修正
      ja: 安定性の修正
      ko: 안정성 수정
      en: Stability hotfix
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.5.2"
    summary:
      zh-TW: 修正 OBS 自動時間戳延遲，並改善播放、停止與快速切歌時的介面反應。
      zh-CN: 修正 OBS 自动时间戳延迟，并改善播放、停止与快速切歌时的界面响应。
      ja: OBS の自動タイムスタンプの遅延を修正し、再生・停止・素早い曲切り替え時の画面応答を改善しました。
      ko: OBS 자동 타임스탬프 지연을 수정하고 재생·정지·빠른 곡 전환 시 화면 반응을 개선했습니다.
      en: Fixes delayed OBS timestamps and improves interface responsiveness around play, stop, and rapid song switching.
    items:
      zh-TW:
        - 修正 OBS WebSocket 回應較慢時，自動時間戳可能比歌曲實際開始時間晚數秒的問題。
        - 歌詞文字轉換改在背景執行，減少播放、停止與快速切換歌曲時的短暫卡頓。
        - 啟動器 1.0.1.3 會跟隨 Windows 顯示語言，並再次清理更新留下的舊備份與暫存檔。
        - 修一些問題不小心太晚睡了，希望明天不要睡過頭
      zh-CN:
        - 修正 OBS WebSocket 响应较慢时，自动时间戳可能比歌曲实际开始时间晚数秒的问题。
        - 歌词文字转换改为在后台执行，减少播放、停止与快速切换歌曲时的短暂卡顿。
        - 启动器 1.0.1.3 会跟随 Windows 显示语言，并再次清理更新留下的旧备份与临时文件。
        - 修一些问题不小心太晚睡了，希望明天不要睡过头。
      ja:
        - OBS WebSocket の応答が遅い場合、自動タイムスタンプが実際の曲開始時刻より数秒遅れる問題を修正しました。
        - 歌詞の文字変換をバックグラウンドで行い、再生・停止・素早い曲切り替え時の一時的な引っかかりを軽減しました。
        - ランチャー 1.0.1.3 は Windows の表示言語に対応し、更新後に残った古いバックアップと一時ファイルの整理も再試行します。
        - いくつか直していたら、うっかり夜更かし。明日は寝坊しませんように。
      ko:
        - OBS WebSocket 응답이 느릴 때 자동 타임스탬프가 실제 곡 시작보다 몇 초 늦게 기록되는 문제를 수정했습니다.
        - 가사 문자 변환을 백그라운드에서 처리해 재생·정지·빠른 곡 전환 시 잠깐 멈추는 현상을 줄였습니다.
        - 런처 1.0.1.3은 Windows 표시 언어를 따르며, 업데이트 뒤 남은 오래된 백업과 임시 파일 정리도 다시 시도합니다.
        - 이것저것 고치다 보니 너무 늦게 자게 됐어요. 내일은 늦잠 자지 않기를!
      en:
        - Fixed automatic timestamps being recorded several seconds late when the OBS WebSocket response was delayed.
        - Moved lyric text conversion to the background to reduce brief stalls during play, stop, and rapid song switching.
        - Launcher 1.0.1.3 follows the Windows display language and retries cleanup of stale update backups and temporary files.
        - I stayed up too late fixing a few things. Hopefully I will not oversleep tomorrow.
  - version: "2.0.5.1"
    date: "2026-08-05"
    latest: false
    type:
      zh-TW: 使用體驗修正
      zh-CN: 使用体验修正
      ja: ユーザー体験の修正
      ko: 사용자 경험 수정
      en: User experience hotfix
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.5.1"
    summary:
      zh-TW: 改善播放、停止與快速切歌反應，並讓直播中的提示視窗不再發出系統音效。
      zh-CN: 改善播放、停止与快速切歌响应，并让直播中的提示窗口不再发出系统音效。
      ja: 再生・停止・素早い曲切り替えの応答性を改善し、配信中のダイアログを無音化しました。
      ko: 재생·정지·빠른 곡 전환 반응을 개선하고 방송 중 안내 창의 시스템 효과음을 제거했습니다.
      en: Improves play, stop, and rapid song switching responsiveness, and silences dialogs during streams.
    items:
      zh-TW:
        - 修正快速切歌後，上一首歌曲狀態可能殘留在時間、歌詞或選取 Highlight 的問題。
        - 統一手動停止、自然播放結束與程式停止的清理流程。
        - 主程式與啟動器的資訊、確認、警告及錯誤視窗改為無聲。
        - 讓Codex工作的時候，出門去買了飲料，快樂！
      zh-CN:
        - 修正快速切歌后上一首歌曲状态可能残留的问题。
        - 统一停止与播放结束的清理流程，并将提示窗口改为无声。
      ja:
        - 素早い曲切り替え後に前の曲の状態が残る可能性を修正しました。
        - 停止処理を統一し、アプリとランチャーのダイアログを無音化しました。
      ko:
        - 빠른 곡 전환 뒤 이전 곡 상태가 남을 수 있는 문제를 수정했습니다.
        - 정지 처리를 통합하고 앱과 런처 안내 창을 무음으로 변경했습니다.
      en:
        - Fixed stale playback, lyric, time, and highlight state after rapid song switches.
        - Unified stop cleanup and silenced application and launcher dialogs.
  - version: "2.0.5.0"
    date: "2026-08-04"
    latest: false
    type:
      zh-TW: 功能與播放清單更新
      zh-CN: 功能与播放列表更新
      ja: 機能・プレイリストアップデート
      ko: 기능 및 재생목록 업데이트
      en: Feature and playlist update
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.5.0"
    summary:
      zh-TW: 新增 BGM 播放清單與卡片式歌曲列表，並讓播放狀態、YouTube 來源與跨版本更新更清楚可靠。
      zh-CN: 新增 BGM 播放列表与卡片式歌曲列表，并让播放状态、YouTube 来源与跨版本更新更清楚可靠。
      ja: BGM プレイリストとカード表示を追加し、再生状態、YouTube 音源、バージョンをまたぐ更新をより分かりやすく安定させました。
      ko: BGM 재생목록과 카드형 곡 목록을 추가하고 재생 상태, YouTube 음원과 버전을 건너뛴 업데이트를 더 명확하고 안정적으로 개선했습니다.
      en: Adds BGM playlists and a card-style song view, with clearer playback state, YouTube sources, and more reliable cross-version updates.
    items:
      zh-TW:
        - 新增可收合的 BGM 播放清單，可保存多首本機或 YouTube 音源、加入備註、拖曳排序，並支援單曲循環、全部循環與全部隨機循環。
        - 新增卡片式歌曲列表，優先顯示觀眾會看到的歌名，同時保留來源、封面與歌詞狀態；可在設定中切換，傳統列表仍為預設。
        - BGM、歌曲列表、待播與已唱會清楚標示目前播放的項目，切換歌曲時更容易掌握狀態。
        - YouTube 音源會顯示解析後的影片標題；將播放清單加入 BGM 時，可選擇目前影片或整份清單。
        - 改善拖曳音檔到歌曲列表、歌單與 BGM 清單時的提示，以及播放器按鈕與循環圖示的一致性。
        - Launcher 1.0.1.0 會集中完成主程式與必要資源更新；即使從較早版本直接升級，也能補齊目前版本需要的檔案。
        - 把工作丟給 Codex 的時候，去健身房練了一小時，覺得今天的自己很棒！
      zh-CN:
        - 新增可收起的 BGM 播放列表，可保存多首本地或 YouTube 音源、添加备注、拖动排序，并支持单曲循环、全部循环与全部随机循环。
        - 新增卡片式歌曲列表，优先显示观众会看到的歌名，同时保留来源、封面与歌词状态；可在设置中切换，传统列表仍为默认值。
        - BGM、歌曲列表、待播与已唱会清楚标示当前播放项目，切换歌曲时更容易掌握状态。
        - YouTube 音源会显示解析后的影片标题；将播放列表加入 BGM 时，可选择当前影片或整份列表。
        - 改善将音频拖到歌曲列表、歌单与 BGM 列表时的提示，以及播放器按钮与循环图标的一致性。
        - Launcher 1.0.1.0 会集中完成主程序与必要资源更新；即使从较早版本直接升级，也能补齐当前版本需要的文件。
        - 把工作丢给 Codex 的时候，去健身房练了一小时，觉得今天的自己很棒！
      ja:
        - 折りたたみ式 BGM プレイリストを追加しました。複数のローカル／YouTube 音源、メモ、ドラッグ並べ替え、1曲リピート、全曲リピート、シャッフルリピートを利用できます。
        - 視聴者に見せる曲名を優先しながら、音源、ジャケット、歌詞の状態も確認できるカード表示を追加しました。設定から切り替えられ、初期設定は従来の表形式です。
        - BGM、曲リスト、待機リスト、歌唱済み履歴で再生中の項目を分かりやすく表示し、曲を切り替えた際の状態を確認しやすくしました。
        - YouTube 音源は取得した動画タイトルを表示します。YouTube プレイリストを BGM に追加する際は、現在の動画だけ、または全項目を選べます。
        - 曲リスト、プレイリスト、BGM リストへのドラッグ表示と、プレーヤーボタン／リピートアイコンの一貫性を改善しました。
        - Launcher 1.0.1.0 がアプリ本体と必要なリソースの更新をまとめて行います。古いバージョンから直接更新しても、現在のバージョンに必要なファイルを補完できます。
        - Codex に仕事を任せている間に、ジムで1時間トレーニングしました。今日の自分、えらい！
      ko:
        - 접을 수 있는 BGM 재생목록을 추가했습니다. 여러 로컬／YouTube 음원, 메모, 드래그 순서 변경, 한 곡 반복, 전체 반복과 무작위 반복을 사용할 수 있습니다.
        - 시청자에게 보이는 곡명을 강조하면서 음원, 커버와 가사 상태도 유지하는 카드형 곡 목록을 추가했습니다. 설정에서 전환할 수 있으며 기본값은 기존 표 형식입니다.
        - BGM, 곡 목록, 대기 목록과 완료 기록에서 현재 재생 항목을 명확하게 표시해 곡을 바꿀 때 상태를 쉽게 확인할 수 있습니다.
        - YouTube 음원은 분석한 영상 제목을 표시합니다. YouTube 재생목록을 BGM에 추가할 때 현재 영상만 또는 전체 항목을 선택할 수 있습니다.
        - 곡 목록, 재생목록과 BGM 목록에 음원을 끌어 놓을 때의 안내와 플레이어 버튼／반복 아이콘의 일관성을 개선했습니다.
        - Launcher 1.0.1.0이 앱과 필수 리소스 업데이트를 한 번에 완료합니다. 이전 버전에서 바로 업데이트해도 현재 버전에 필요한 파일을 모두 보완합니다.
        - Codex에게 일을 맡겨 둔 동안 헬스장에서 한 시간 운동했습니다. 오늘의 나, 정말 잘했어요!
      en:
        - Added a collapsible BGM playlist with multiple local or YouTube sources, notes, drag reordering, Repeat One, Repeat All, and Shuffle All.
        - Added a card-style song list that emphasizes the audience-facing title while retaining source, cover, and lyrics status. It is optional; the traditional table remains the default.
        - The playing BGM or song is now clearly highlighted across the library, queue, and History, making rapid switches easier to follow.
        - YouTube sources now show their resolved video titles. When adding a YouTube playlist to BGM, choose the current video or the entire playlist.
        - Improved drag-and-drop feedback across the song library, playlists, and BGM list, plus consistency between player buttons and repeat icons.
        - Launcher 1.0.1.0 now completes app and required-resource updates in one place, including when upgrading directly from an older version.
        - While Codex was working, I trained at the gym for an hour. I am proud of myself today!

  - version: "2.0.4.0"
    date: "2026-08-02"
    type:
      zh-TW: 資源更新
      zh-CN: 资源更新
      ja: リソース更新
      ko: 리소스 업데이트
      en: Resource update
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.4.0"
    summary:
      zh-TW: 更完善的資源更新機制，讓跨版本升級也能自動補齊與修復必要資源。
      zh-CN: 更完善的资源更新机制，让跨版本升级也能自动补齐和修复必要资源。
      ja: リソース更新機構を強化し、バージョンをまたぐ更新でも必要なリソースを自動補完・修復できるようにしました。
      ko: 리소스 업데이트 체계를 강화해 여러 버전을 건너뛰어 업데이트해도 필요한 리소스를 자동으로 보완하고 복구합니다.
      en: Adds a more complete resource update system that can restore every required resource even across skipped versions.
    items:
      zh-TW:
        - 簡繁轉換字典、日文與韓文讀音、主題共用資源及 YouTube 輔助程式，改由獨立的版本化資源包統一管理。
        - 啟動時會檢查資源版本與完整性；檔案缺少、損壞或過舊時，可自動下載或使用本機快取修復。
        - 即使從較早版本直接跳版更新，也會補齊目前版本需要的全部資源，不必逐版升級。
        - 資源套用前會核對檔案清單、大小與雜湊值，避免不完整的內容被當成更新成功。
        - 丟給 Codex 工作的時候，洗了衣服還煮了晚餐吃，非常充實。
      zh-CN:
        - 简繁转换词典、日文与韩文读音、主题共用资源及 YouTube 辅助程序，改由独立的版本化资源包统一管理。
        - 启动时会检查资源版本与完整性；文件缺少、损坏或过旧时，可自动下载或使用本地缓存修复。
        - 即使从较早版本直接跨版本更新，也会补齐当前版本需要的全部资源，不必逐版升级。
        - 资源应用前会核对文件清单、大小与哈希值，避免不完整的内容被当成更新成功。
        - 丢给 Codex 工作的时候，洗了衣服还煮了晚餐吃，非常充实。
      ja:
        - 簡体字／繁体字変換辞書、日本語・韓国語の読み、テーマ共通素材、YouTube 補助プログラムを、独立したバージョン付きリソースパックで一元管理するようにしました。
        - 起動時にリソースのバージョンと整合性を確認し、不足・破損・古いファイルは自動ダウンロードまたはローカルキャッシュから修復します。
        - 以前のバージョンから直接更新した場合でも、現在のバージョンに必要なリソースをすべて補完するため、順番に更新する必要はありません。
        - 適用前にファイル一覧、サイズ、ハッシュ値を確認し、不完全な内容を更新成功として扱わないようにしました。
        - Codex に仕事を任せている間に、洗濯をして夕食も作りました。とても充実した一日でした。
      ko:
        - 중국어 간체／번체 변환 사전, 일본어·한국어 읽기, 테마 공용 리소스와 YouTube 보조 프로그램을 독립된 버전형 리소스 팩으로 통합 관리합니다.
        - 실행할 때 리소스 버전과 무결성을 확인하며, 파일이 누락·손상되었거나 오래된 경우 자동 다운로드 또는 로컬 캐시로 복구합니다.
        - 이전 버전에서 바로 건너뛰어 업데이트해도 현재 버전에 필요한 모든 리소스를 보완하므로 버전별로 차례대로 업데이트할 필요가 없습니다.
        - 적용 전에 파일 목록, 크기와 해시 값을 확인해 불완전한 내용을 업데이트 성공으로 처리하지 않습니다.
        - Codex에게 일을 맡겨 둔 동안 빨래도 하고 저녁도 해 먹었습니다. 아주 알찬 하루였어요.
      en:
        - Simplified／Traditional Chinese dictionaries, Japanese and Korean readings, shared theme resources, and the YouTube helper are now managed in one independently versioned resource pack.
        - Startup checks the resource version and integrity, then downloads or restores missing, damaged, or outdated files from the local cache.
        - Updating directly from an older version now restores everything required by the current release, without installing each intermediate version.
        - File lists, sizes, and hashes are verified before resources are applied, so incomplete content is never treated as a successful update.
        - While Codex was working, I did the laundry and cooked dinner. It was a very productive day.

  - version: "2.0.3.1"
    date: "2026-08-02"
    type:
      zh-TW: 緊急修正
      zh-CN: 紧急修复
      ja: 緊急修正
      ko: 긴급 수정
      en: Hotfix
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.3.1"
    summary:
      zh-TW: 修正主畫面與 OBS 未顯示韓文羅馬拼音的問題，並更新啟動器的檢查機制。
      zh-CN: 修复主界面与 OBS 不显示韩文罗马拼音的问题，并更新启动器的检查机制。
      ja: メイン画面と OBS で韓国語ローマ字が表示されない問題を修正し、ランチャーの更新確認を改善しました。
      ko: 메인 화면과 OBS에서 한국어 로마자 표기가 보이지 않던 문제를 수정하고 런처의 업데이트 확인 방식을 개선했습니다.
      en: Fixes missing Korean romanization in the main preview and OBS, and improves launcher update checks.
    items:
      zh-TW:
        - 修正切換「讀音顯示（預覽 + OBS）」為韓文羅馬拼音後，只有獨立歌詞視窗顯示、主畫面與 OBS 沒有顯示的問題。
        - 啟動器改為每 15 分鐘重新檢查更新；檢查失敗時會在下次啟動重試，並會自動補齊從 2.0.2.0 升級時遺漏的韓文羅馬拼音檔案。
        - 丟給 Codex 工作的時候，思考了一下人生，真想發財。
      zh-CN:
        - 修复将“读音显示（预览 + OBS）”切换为韩文罗马拼音后，只有独立歌词窗口显示、主界面与 OBS 不显示的问题。
        - 启动器改为每 15 分钟重新检查更新；检查失败时会在下次启动重试，并会自动补齐从 2.0.2.0 升级时遗漏的韩文罗马拼音文件。
        - 丢给 Codex 工作的时候，思考了一下人生，真想发财。
      ja:
        - 「読み表示（プレビュー + OBS）」を韓国語ローマ字へ切り替えた際、独立した歌詞ウィンドウだけに表示され、メイン画面と OBS に表示されない問題を修正しました。
        - ランチャーは 15 分ごとに更新を再確認し、失敗時は次回起動で再試行します。2.0.2.0 からの更新時に不足していた韓国語ローマ字用ファイルも自動修復します。
        - Codex に作業を任せている間に人生について少し考えました。ああ、お金持ちになりたい。
      ko:
        - “읽기 표시(미리보기 + OBS)”를 한국어 로마자로 바꿨을 때 별도 가사 창에만 표시되고 메인 화면과 OBS에는 표시되지 않던 문제를 수정했습니다.
        - 런처는 15분마다 업데이트를 다시 확인하고 실패 시 다음 실행에서 재시도합니다. 2.0.2.0에서 업그레이드할 때 누락된 한국어 로마자 파일도 자동으로 복구합니다.
        - Codex에게 작업을 맡겨 둔 동안 인생을 잠깐 생각해 봤습니다. 정말 부자가 되고 싶네요.
      en:
        - Fixed Korean romanization appearing in the separate Lyrics window but not in the main preview or OBS after changing Reading Display (Preview + OBS).
        - The launcher now checks again every 15 minutes, retries after a failed check, and automatically restores Korean romanization files omitted when upgrading from 2.0.2.0.
        - Thought about life for a moment while Codex was working. I really want to get rich.

  - version: "2.0.3.0"
    date: "2026-08-02"
    type:
      zh-TW: 功能與歌詞更新
      zh-CN: 功能与歌词更新
      ja: 機能・歌詞アップデート
      ko: 기능 및 가사 업데이트
      en: Feature and lyrics update
    release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.0.3.0"
    summary:
      zh-TW: 新增無伴奏演出，並改善歌詞搜尋、日韓讀音輔助與 OBS 加入方式。
      zh-CN: 新增无伴奏演出，并改善歌词搜索、日韩读音辅助与 OBS 添加方式。
      ja: 無伴奏演奏を追加し、歌詞検索、日本語・韓国語の読み補助、OBS への追加方法を改善しました。
      ko: 무반주 공연을 추가하고 가사 검색, 일본어·한국어 읽기 보조와 OBS 추가 방법을 개선했습니다.
      en: Adds unaccompanied performances and improves lyrics discovery, Japanese and Korean reading aids, and OBS setup.
    items:
      zh-TW:
        - 新增「無伴奏演出」，可建立清唱、自彈自唱等沒有媒體檔的演出項目，選擇手動結束或設定預計時間，並正常加入待播、Now Singing、已唱與專案儲存。
        - 自動歌詞搜尋會同時整合 LRCLIB 與 YouTube 字幕，不再因先找到字幕而看不到其他同步歌詞。
        - 改善韓文字幕辨識與搜尋排序，並新增保留詞間空格的韓文羅馬拼音。
        - 改善日文漢字的上下文讀音，以及主畫面、歌詞視窗與 OBS 的日韓讀音一致性與載入穩定性。
        - 「拖曳至 OBS」現在可按住拖入 OBS，也可單擊複製瀏覽器來源路徑，再貼到 OBS 的網址欄。
        - 左側歌單名稱顯示不完整時，可將游標移上去查看完整名稱。
        - 改善歌曲開頭、間奏與切換歌曲時的歌詞顯示穩定性。
        - 讓 Codex 工作的時候，打了一下英雄聯盟大混戰，輸得很慘。
      zh-CN:
        - 新增“无伴奏演出”，可建立清唱、自弹自唱等没有媒体文件的演出项目，选择手动结束或设置预计时间，并正常加入待播、Now Singing、已唱与项目保存。
        - 自动歌词搜索会同时整合 LRCLIB 与 YouTube 字幕，不再因先找到字幕而看不到其他同步歌词。
        - 改善韩文字幕识别与搜索排序，并新增保留词间空格的韩文罗马拼音。
        - 改善日文汉字的上下文读音，以及主界面、歌词窗口与 OBS 的日韩读音一致性与加载稳定性。
        - “拖放至 OBS”现在可按住拖入 OBS，也可单击复制浏览器来源路径，再粘贴到 OBS 的网址栏。
        - 左侧歌单名称显示不完整时，可将鼠标移上去查看完整名称。
        - 改善歌曲开头、间奏与切换歌曲时的歌词显示稳定性。
        - 让 Codex 工作的时候，打了一下《英雄联盟》极地大乱斗，输得很惨。
      ja:
        - メディアファイルを使わないアカペラや弾き語り向けの「無伴奏演奏」を追加しました。手動終了または予定時間を選び、待機リスト、Now Singing、歌唱済み履歴、プロジェクト保存を利用できます。
        - 自動歌詞検索で LRCLIB と YouTube 字幕を同時に表示し、先に字幕が見つかった場合でも他の同期歌詞を選べるようにしました。
        - 韓国語字幕の識別と検索順を改善し、単語間の空白を保った韓国語ローマ字表示を追加しました。
        - 日本語漢字の文脈に応じた読みと、メイン画面・歌詞ウィンドウ・OBS における日本語／韓国語の読み表示の一貫性と読み込み安定性を改善しました。
        - 「OBSへドラッグ」は従来どおりドラッグでき、クリックすると Browser Source のパスをコピーして OBS の URL 欄へ貼り付けられます。
        - 左側のプレイリスト名が収まらない場合、カーソルを合わせると完全な名前を確認できます。
        - 曲の先頭、間奏、曲切替時の歌詞表示を安定させました。
        - Codex に作業を任せている間に『リーグ・オブ・レジェンド』のランダムミッドを少し遊んで、ひどく負けました。
      ko:
        - 미디어 파일 없이 아카펠라나 직접 연주하는 공연을 위한 “무반주 공연”을 추가했습니다. 수동 종료 또는 예상 시간을 선택하고 대기 목록, Now Singing, 완료 기록과 프로젝트 저장을 그대로 사용할 수 있습니다.
        - 자동 가사 검색에서 LRCLIB와 YouTube 자막을 함께 표시해 자막이 먼저 발견되어도 다른 동기화 가사를 선택할 수 있습니다.
        - 한국어 자막 식별과 검색 순서를 개선하고 단어 사이 공백을 유지하는 한국어 로마자 표기를 추가했습니다.
        - 일본어 한자의 문맥별 읽기와 메인 화면·가사 창·OBS에서 사용하는 일본어／한국어 읽기 표시의 일관성과 로딩 안정성을 개선했습니다.
        - “OBS로 드래그”는 그대로 끌어 놓을 수 있으며, 클릭하면 Browser Source 경로를 복사해 OBS URL 칸에 붙여 넣을 수 있습니다.
        - 왼쪽 재생목록 이름이 잘릴 때 마우스를 올리면 전체 이름을 확인할 수 있습니다.
        - 곡 시작, 간주와 곡 전환 시 가사 표시를 안정화했습니다.
        - Codex에게 작업을 맡겨 둔 동안 《리그 오브 레전드》 무작위 총력전을 잠깐 했는데 처참하게 졌습니다.
      en:
        - Added Unaccompanied Performance items for a cappella, self-accompanied, and other performances without a media file. They can end manually or after an optional planned duration and work with the queue, Now Singing, History, and project saving.
        - Automatic lyrics lookup now shows LRCLIB results and YouTube captions together, so synchronized lyrics remain available even when captions are found first.
        - Improved Korean caption identification and search ordering, and added Korean romanization with readable word spacing.
        - Improved context-sensitive Japanese readings and the consistency and loading reliability of Japanese and Korean readings across the main view, Lyrics window, and OBS.
        - Drag to OBS still supports direct dragging; clicking it now copies the Browser Source path for pasting into the OBS URL field.
        - Hovering a truncated playlist name in the sidebar now shows its full name.
        - Improved lyric display stability at song starts, instrumental gaps, and song changes.
        - Played some League of Legends ARAM while Codex was working and lost terribly.


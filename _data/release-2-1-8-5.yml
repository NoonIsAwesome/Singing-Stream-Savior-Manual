    ko:
      - "Windows의 ‘움직임 줄이기’ 설정이 가사 애니메이션 효과에 영향을 주는 문제를 수정했습니다."
      - "가사의 중국어 간체·번체 자동 변환으로 일부 표현이 잘못 바뀌는 문제를 수정했습니다."

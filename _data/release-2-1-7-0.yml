release:
  version: "2.1.7.0"
  date: "2026-09-26"
  latest: true
  type:
    en: "Feature update"
    zh-TW: "功能更新"
    zh-CN: "功能更新"
    ja: "機能アップデート"
    ko: "기능 업데이트"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.7.0"
  summary:
    en: "Profile sharing, application backup and restore, and improvements to YouTube audio and playback."
    zh-TW: "新增 Profile 匯入與匯出、應用資料備份與還原，並改善 YouTube 音訊與播放操作。"
    zh-CN: "新增 Profile 导入与导出、应用数据备份与还原，并改善 YouTube 音频与播放操作。"
    ja: "Profile のインポート／エクスポート、アプリデータのバックアップ／復元を追加し、YouTube 音声と再生操作を改善しました。"
    ko: "Profile 가져오기·내보내기와 앱 데이터 백업·복원을 추가하고 YouTube 오디오 및 재생 동작을 개선했습니다."
  items:
    en:
      - "Import and export vocal Profiles to share or move your effects settings."
      - "Import OBS audio effects, with support for Gain, Noise Gate, Compressor, and Limiter."
      - "Back up and restore application settings, Profiles, the song library, selected projects, and related audio, lyrics, and artwork. Identical audio files are stored only once."
      - "Improve the responsiveness of Profile loading and saving."
      - "Improve YouTube batch downloads: a failed song no longer affects the others. Successful songs link to local audio files, and failed songs are listed when the batch finishes."
      - "Improve MP3/WAV conversion and playback afterward. The progress window now shows which song is being processed."
      - "Improve YouTube playback-range editing for some videos that can play but cannot be downloaded. Fix cases where playback had to start before a range could be adjusted."
      - "Add a missing-audio indicator to the song list. Click it or use the right-click menu to locate the file while keeping the song's settings."
      - "Improve playback stability when switching songs, pausing, and stopping."
      - "Long song titles now scroll in one direction and restart from the beginning. Refine several interface details."
      - "Stop automatically installing or repairing the OBS connector at startup, reducing unnecessary permission prompts."
      - "Happy Mid-Autumn Festival, everyone! ٩(˃̶͈̀௰˂̶͈́)و"
    zh-TW:
      - "新增人聲 Profile 匯入與匯出，方便分享或搬移效果器設定。"
      - "新增 OBS 音訊效果匯入，支援增益、噪音閘、壓縮器與限制器。"
      - "新增應用資料備份與還原，可備份設定、Profiles、歌庫、選取的專案及相關音檔、歌詞與封面；相同音檔不重複收錄。"
      - "改善 Profile 載入與儲存的流暢度。"
      - "改善 YouTube 批次下載，單首失敗不再影響其他歌曲；成功項目會連結到本機音檔，並在完成後列出失敗歌曲。"
      - "改善 MP3／WAV 轉檔及轉檔後的播放，進度視窗會顯示目前正在處理的歌曲。"
      - "改善 YouTube 播放範圍設定，讓部分無法下載但可播放的影片也能調整區段，並修正部分影片必須先播放才能調整的問題。"
      - "歌曲列表新增音檔遺失標記，可點擊標記或透過右鍵選單重新指定檔案，保留原有歌曲設定。"
      - "改善切歌、暫停與停止的播放穩定性。"
      - "長歌名跑馬燈改為單向移動後從頭重新開始，並調整部分介面細節。"
      - "啟動時不再自動執行 OBS 連接元件安裝或修復，減少不必要的權限提示。"
      - "大家中秋節快樂٩(˃̶͈̀௰˂̶͈́)و"
    zh-CN:
      - "新增人声 Profile 导入与导出，方便分享或迁移效果器设置。"
      - "新增 OBS 音频效果导入，支持增益、噪声门、压缩器与限制器。"
      - "新增应用数据备份与还原，可备份设置、Profiles、曲库、选定的项目及相关音频、歌词与封面；相同音频不重复收录。"
      - "改善 Profile 加载与保存的流畅度。"
      - "改善 YouTube 批量下载，单首失败不再影响其他歌曲；成功项目会关联到本地音频，并在完成后列出失败歌曲。"
      - "改善 MP3／WAV 转码及转码后的播放，进度窗口会显示目前正在处理的歌曲。"
      - "改善 YouTube 播放范围设置，让部分无法下载但可播放的视频也能调整片段，并修正部分视频必须先播放才能调整的问题。"
      - "歌曲列表新增音频文件丢失标记，可点击标记或通过右键菜单重新指定文件，保留原有歌曲设置。"
      - "改善切歌、暂停与停止的播放稳定性。"
      - "长歌名滚动改为单向移动后从头重新开始，并调整部分界面细节。"
      - "启动时不再自动执行 OBS 连接组件安装或修复，减少不必要的权限提示。"
      - "大家中秋节快乐٩(˃̶͈̀௰˂̶͈́)و"
    ja:
      - "ボーカル Profile のインポート／エクスポートを追加し、エフェクト設定を共有・移行しやすくしました。"
      - "OBS 音声フィルターの取り込みを追加しました。ゲイン、ノイズゲート、コンプレッサー、リミッターに対応します。"
      - "アプリデータのバックアップ／復元を追加しました。設定、Profiles、曲ライブラリ、選択したプロジェクトと関連音声・歌詞・カバー画像を保存でき、同じ音声データは重複して収録しません。"
      - "Profile の読み込みと保存をよりスムーズにしました。"
      - "YouTube の一括ダウンロードで一部の曲が失敗しても、ほかの曲の処理を続けます。成功した曲はローカル音声ファイルに切り替え、完了後に失敗した曲を表示します。"
      - "MP3／WAV 変換と変換後の再生を改善しました。進捗ウィンドウに処理中の曲を表示します。"
      - "ダウンロードできなくても再生できる一部の YouTube 動画で、再生範囲を調整できるようにしました。範囲調整の前に再生が必要になる問題も修正しました。"
      - "曲リストに音声ファイルが見つからないことを示すマークを追加しました。クリックまたは右クリックメニューからファイルを再指定でき、曲の設定は保持されます。"
      - "曲の切り替え、一時停止、停止時の再生安定性を改善しました。"
      - "長い曲名は一方向へスクロールしてから先頭に戻るようにし、画面の細部も調整しました。"
      - "起動時に OBS 接続コンポーネントのインストールや修復を自動実行しないようにし、不要な権限確認を減らしました。"
      - "皆さん、素敵な中秋節を！٩(˃̶͈̀௰˂̶͈́)و"
    ko:
      - "보컬 Profile 가져오기·내보내기를 추가하여 효과 설정을 공유하거나 옮기기 쉽게 했습니다."
      - "OBS 오디오 효과 가져오기를 추가했습니다. 게인, 노이즈 게이트, 컴프레서, 리미터를 지원합니다."
      - "앱 데이터 백업·복원을 추가했습니다. 설정, Profiles, 곡 라이브러리, 선택한 프로젝트와 관련 오디오·가사·표지를 백업하며, 동일한 오디오는 중복 저장하지 않습니다."
      - "Profile을 더 원활하게 불러오고 저장할 수 있도록 개선했습니다."
      - "YouTube 일괄 다운로드에서 한 곡이 실패해도 다른 곡은 계속 처리합니다. 성공한 곡은 로컬 오디오 파일에 연결하고, 완료 후 실패한 곡을 표시합니다."
      - "MP3／WAV 변환과 변환 후 재생을 개선했습니다. 진행 창에 현재 처리 중인 곡을 표시합니다."
      - "다운로드할 수 없어도 재생 가능한 일부 YouTube 영상의 재생 구간을 조절할 수 있도록 개선했습니다. 먼저 재생해야 구간을 조절할 수 있던 문제도 수정했습니다."
      - "곡 목록에 오디오 파일 누락 표시를 추가했습니다. 표시를 클릭하거나 오른쪽 클릭 메뉴에서 파일을 다시 지정할 수 있으며, 기존 곡 설정은 유지됩니다."
      - "곡 전환, 일시 정지, 정지 시의 재생 안정성을 개선했습니다."
      - "긴 곡명은 한 방향으로 스크롤한 뒤 처음부터 다시 시작하도록 변경하고, 일부 화면 세부 사항을 조정했습니다."
      - "시작 시 OBS 연결 구성 요소를 자동으로 설치하거나 복구하지 않도록 하여 불필요한 권한 확인을 줄였습니다."
      - "여러분, 행복한 중추절 보내세요! ٩(˃̶͈̀௰˂̶͈́)و"

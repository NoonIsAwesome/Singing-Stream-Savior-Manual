release:
  version: "2.1.6.0"
  date: "2026-09-22"
  latest: false
  type:
    en: "Feature update"
    zh-TW: "功能更新"
    zh-CN: "功能更新"
    ja: "機能アップデート"
    ko: "기능 업데이트"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.6.0"
  summary:
    en: "Local diagnostic export and theme customization"
    zh-TW: "新增本機診斷匯出與主題自訂"
    zh-CN: "新增本地诊断导出与主题自定义"
    ja: "ローカル診断データの出力とテーマのカスタマイズ"
    ko: "로컬 진단 데이터 내보내기 및 테마 사용자 지정"
  items:
    en:
      - "Adds Export diagnostic data for reporting software problems. Records stay on your computer and are manually exported as a ZIP, with no automatic upload or email."
      - "Adds theme color and background opacity options to Transparent Black and Transparent White."
      - "Fixes an issue where some custom font names could not be applied correctly to lyrics, improving handling of parentheses and other special characters."
      - "Improves VST3 plug-in compatibility, audio configuration checks and audio bus handling."
      - "Fixes hand cursors incorrectly appearing over some non-clickable areas."
      - "Improves the display priority of status messages."
      - "Improves lyric display in Classic Karaoke."
      - "I didn't manage to get any Hans Zimmer merch 🥲"
    zh-TW:
      - "新增「匯出診斷資料」功能，供軟體異常回報使用。紀錄僅保存在本機，由使用者手動匯出 ZIP，不會自動上傳或寄信。"
      - "Transparent Black／Transparent White 新增主題顏色及背景透明度選項。"
      - "修正部分自訂字型名稱無法正確套用到歌詞的問題，改善含括號等特殊符號的字型名稱處理。"
      - "改善 VST3 外掛相容性、音訊配置檢查與音訊 Bus 處理。"
      - "修正部分不可點擊區域誤顯示手形游標。"
      - "改善狀態提示的顯示優先順序。"
      - "改善 Classic Karaoke 的歌詞顯示。"
      - "沒有買到 Hans Zimmer 的周邊🥲"
    zh-CN:
      - "新增“导出诊断数据”功能，用于反馈软件异常。记录仅保存在本机，由用户手动导出 ZIP，不会自动上传或发送邮件。"
      - "Transparent Black／Transparent White 新增主题颜色及背景不透明度选项。"
      - "修复部分自定义字体名称无法正确应用到歌词的问题，改善含括号等特殊符号的字体名称处理。"
      - "改善 VST3 插件兼容性、音频配置检查与音频总线处理。"
      - "修复部分不可点击区域误显示手形光标的问题。"
      - "改善状态提示的显示优先级。"
      - "改善 Classic Karaoke 的歌词显示。"
      - "没有买到 Hans Zimmer 的周边🥲"
    ja:
      - "不具合報告用に診断データのエクスポート機能を追加しました。記録はローカルにのみ保存され、ZIP は手動で出力します。自動アップロードやメール送信は行いません。"
      - "Transparent Black と Transparent White に、テーマ色と背景の不透明度を調整する設定を追加しました。"
      - "一部のカスタムフォント名を歌詞に正しく適用できない問題を修正し、括弧などの特殊記号を含む名前の処理を改善しました。"
      - "VST3 プラグインの互換性、音声設定の検証、音声バスの処理を改善しました。"
      - "クリックできない一部の領域で、誤って手形カーソルが表示される問題を修正しました。"
      - "ステータスメッセージの表示優先順位を改善しました。"
      - "Classic Karaoke の歌詞表示を改善しました。"
      - "Hans Zimmer のグッズを買えませんでした🥲"
    ko:
      - "소프트웨어 문제 제보를 위한 진단 데이터 내보내기 기능을 추가했습니다. 기록은 컴퓨터에만 저장되며 사용자가 직접 ZIP으로 내보냅니다. 자동 업로드나 이메일 전송은 하지 않습니다."
      - "Transparent Black과 Transparent White에 테마 색상 및 배경 불투명도 옵션을 추가했습니다."
      - "일부 사용자 글꼴 이름을 가사에 올바르게 적용하지 못하는 문제를 수정하고, 괄호 등 특수 문자가 포함된 이름의 처리를 개선했습니다."
      - "VST3 플러그인 호환성, 오디오 구성 검사 및 오디오 버스 처리를 개선했습니다."
      - "클릭할 수 없는 일부 영역에 손 모양 커서가 잘못 표시되는 문제를 수정했습니다."
      - "상태 메시지의 표시 우선순위를 개선했습니다."
      - "Classic Karaoke의 가사 표시를 개선했습니다."
      - "Hans Zimmer 굿즈를 못 샀어요🥲"

release:
  version: "2.2.1.1"
  date: "2026-10-30"
  publishedAt: "2026-10-30T03:29:02Z"
  latest: true
  type:
    en: "Frequency Orbit fixes and theme preview improvements"
    zh-TW: "Frequency Orbit 修正與主題預覽改善"
    zh-CN: "Frequency Orbit 修正与主题预览改善"
    ja: "Frequency Orbit の修正とテーマプレビューの改善"
    ko: "Frequency Orbit 수정 및 테마 미리보기 개선"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.2.1.1"
  summary:
    en: "Frequency Orbit fixes, improved previews and launcher recovery."
    zh-TW: "修正 Frequency Orbit、更新主題預覽與啟動器復原機制。"
    zh-CN: "修复 Frequency Orbit、更新主题预览与启动器恢复机制。"
    ja: "Frequency Orbit、プレビューとランチャーの復旧を改善。"
    ko: "Frequency Orbit, 미리보기 및 실행기 복구를 개선했습니다."
  items:
    en:
      - "White Orbit is now Frequency Orbit. Fix long-title fitting and unwanted cover images. Add an optional circular cover, a selectable base color, opacity and cover blur controls, and rotation speed adjustments in 0.1 steps."
      - "Add an optional Set List inside Frequency Orbit, with numbered styles including #01. Avoid briefly showing history while switching accompaniments. The Set List option is off by default."
      - "Let Signal Veil and Signal Tide switch between the original time-domain waveform and a frequency spectrum. Improve headroom in dense frequency passages while preserving quiet detail."
      - "Refresh theme and animated-lyrics previews with suitable scenery and playback/list scenarios. Improve thumbnail readability and simplify card tooltips. Default keeps its plain preview."
      - "Improve Simple Player so existing sung history appears when entering or returning to the theme, without requiring another song to play and stop."
      - "Fix launcher recovery when no beta release is available, restore switching back to the stable channel, and improve the error-screen layout. Keep automatic Stable startup working offline without showing recovery actions that cannot be handled during launch."
      - "Ensure upgrades from older versions also install Repair Singing Stream Savior.cmd."
      - "Show a pause icon in the song list when playback is paused."
    zh-TW:
      - "White Orbit 更名為 Frequency Orbit。修正長歌名排列與誤顯示封面，加入圓形封面開關、可選底色、透明度、封面模糊與旋轉速度控制；旋轉速度每次調整 0.1。"
      - "Frequency Orbit 加入可開關的 Set List，支援包含 #01 的編號樣式，並避免切換伴奏時短暫冒出已唱清單；Set List 預設關閉。"
      - "Signal Veil 與 Signal Tide 可切換原有時域波形或頻譜；改善高能量段落的頻譜過於飽滿，同時保留低音量段落的細節。"
      - "更新主題與動態歌詞預覽的背景及播放／歌單情境，改善縮圖辨識度並簡化卡片提示；Default 維持無背景預覽。"
      - "改善 Simple Player：已有已唱紀錄時，首次進入或切回主題即可顯示清單，不必再播放並停止另一首歌。"
      - "修正沒有 Beta 版本時啟動器檢查失敗及無法切回正式通道的問題，並改善錯誤畫面的排版。 並確保正式通道離線時仍能自動啟動已安裝版本，避免顯示無法處理的復原操作。"
      - "確保從舊版更新後也會包含 Repair Singing Stream Savior.cmd 修復入口。"
      - "歌曲暫停時，列表改顯示暫停圖示。"
    zh-CN:
      - "White Orbit 更名为 Frequency Orbit。修复长歌名排列与误显示封面，加入圆形封面开关、可选底色、透明度、封面模糊与旋转速度控制；旋转速度每次调整 0.1。"
      - "Frequency Orbit 加入可开关的 Set List，支持包含 #01 的编号样式，并避免切换伴奏时短暂弹出已唱列表；Set List 默认关闭。"
      - "Signal Veil 与 Signal Tide 可切换原有时域波形或频谱；改善高能量段落的频谱过于饱满，同时保留低音量段落的细节。"
      - "更新主题与动态歌词预览的背景及播放／歌单情境，改善缩略图辨识度并简化卡片提示；Default 保持无背景预览。"
      - "改善 Simple Player：已有已唱记录时，首次进入或切回主题即可显示列表，不必再播放并停止另一首歌。"
      - "修复没有 Beta 版本时启动器检查失败及无法切回正式通道的问题，并改善错误画面的布局。 并确保正式通道离线时仍能自动启动已安装版本，避免显示无法处理的恢复操作。"
      - "确保从旧版更新后也会包含 Repair Singing Stream Savior.cmd 修复入口。"
      - "歌曲暂停时，列表改为显示暂停图标。"
    ja:
      - "White Orbit を Frequency Orbit に改称しました。長い曲名の配置と意図しないジャケット表示を修正。円形ジャケットの表示切替、背景色、不透明度、ジャケットのぼかし、回転速度を追加しました。速度は 0.1 刻みで調整できます。"
      - "Frequency Orbit 内に表示できる Set List を追加。#01 などの番号に対応し、伴奏切替中に履歴が一瞬表示される問題を防ぎます。Set List は初期状態でオフです。"
      - "Signal Veil と Signal Tide で従来の時間領域波形と周波数スペクトルを切り替えられます。静かな部分の細部を保ちながら、密度の高い部分でスペクトルが埋まりすぎる表示を改善しました。"
      - "テーマと動的歌詞のプレビュー背景・再生・曲リストのデモを更新。サムネイルを見やすくし、カードのヒントを簡略化しました。Default のプレビューには背景を付けません。"
      - "Simple Player は、歌唱履歴があれば初回選択時や別テーマから戻った時にも一覧を表示します。もう一度曲を再生して停止する必要がなくなりました。"
      - "Beta 版が公開されていない場合のランチャーの更新確認と、正式チャンネルへ戻れない問題を修正。エラー画面の配置も改善しました。 正式版チャンネルではオフラインでもインストール済みの版を自動起動し、起動時に処理できない復旧操作を表示しないよう修正。"
      - "旧版からの更新でも修復用の Repair Singing Stream Savior.cmd を追加します。"
      - "一時停止中の楽曲は、リスト上でも一時停止アイコンで表示します。"
    ko:
      - "White Orbit의 이름을 Frequency Orbit으로 변경했습니다. 긴 곡명 배치와 의도하지 않은 표지 표시를 수정했습니다. 원형 표지 켜기/끄기, 바탕색, 불투명도, 표지 흐림 및 회전 속도 설정을 추가했으며 속도는 0.1 단위로 조절할 수 있습니다."
      - "Frequency Orbit 안에 선택적으로 표시하는 Set List를 추가했습니다. #01 등의 번호를 지원하며 반주를 바꿀 때 완료 목록이 잠깐 나타나는 문제를 방지합니다. Set List는 기본으로 꺼져 있습니다."
      - "Signal Veil과 Signal Tide에서 기존 시간 영역 파형과 주파수 스펙트럼을 전환할 수 있습니다. 조용한 구간의 세부 표현을 유지하면서 에너지가 높은 구간의 스펙트럼이 지나치게 꽉 차는 표시를 개선했습니다."
      - "테마 및 동적 가사 미리보기의 배경과 재생/곡 목록 시나리오를 새로 구성했습니다. 썸네일을 보기 쉽게 하고 카드 도움말을 간결하게 바꿨습니다. Default 미리보기에는 배경을 추가하지 않습니다."
      - "Simple Player는 이미 부른 기록이 있으면 처음 선택하거나 다른 테마에서 돌아왔을 때도 목록을 표시합니다. 다른 곡을 다시 재생하고 멈출 필요가 없습니다."
      - "공개된 Beta 버전이 없을 때 실행기의 업데이트 확인이 실패하고 정식 채널로 돌아가지 못하는 문제를 수정했습니다. 오류 화면 배치도 개선했습니다. 정식 채널은 오프라인에서도 설치된 버전을 자동 실행하며, 실행 도중 처리할 수 없는 복구 동작을 표시하지 않도록 수정했습니다."
      - "이전 버전에서 업데이트할 때도 복구용 Repair Singing Stream Savior.cmd가 포함됩니다."
      - "재생을 일시 정지하면 곡 목록에도 일시 정지 아이콘을 표시합니다."

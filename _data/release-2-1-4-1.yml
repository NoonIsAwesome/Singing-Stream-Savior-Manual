release:
  version: "2.1.4.1"
  date: "2026-09-12"
  latest: true
  type:
    en: "Hotfix update"
    zh-TW: "Hotfix 修正"
    zh-CN: "Hotfix 修复"
    ja: "Hotfix 修正"
    ko: "Hotfix 수정"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.4.1"
  summary:
    en: "Fixes missing new themes after updating from 2.1.3.2 to 2.1.4.0. Fixes enlarged playlist blocks getting stuck when dragged."
    zh-TW: "修復從 2.1.3.2 更新至 2.1.4.0 後看不到新主題的問題。 修復歌單區塊放大後拖曳卡住的問題。"
    zh-CN: "修复从 2.1.3.2 更新至 2.1.4.0 后看不到新主题的问题。 修复歌单区块放大后拖动卡住的问题。"
    ja: "2.1.3.2 から 2.1.4.0 への更新後に新しいテーマが表示されない問題を修正します。 拡大した曲リストのブロックをドラッグすると動かなくなる問題を修正します。"
    ko: "2.1.3.2에서 2.1.4.0으로 업데이트한 후 새 테마가 표시되지 않는 문제를 수정합니다. 재생목록 블록을 확대한 후 드래그할 때 멈추는 문제를 수정합니다."
  items:
    en:
      - The spicy Weili fried sauce noodles are seriously delicious—the night owls working late are in for a treat!
      - "Fixes missing new themes after updating from 2.1.3.2 to 2.1.4.0."
      - "Fixes enlarged playlist blocks getting stuck when dragged."
      - "Defaults YouTube downloads to MP3 320 kbps and keeps only MP3 and WAV. Downloaded audio can be converted locally while preserving originals and avoiding same-name overwrites."
      - "Adds a Download all YouTube files entry beside song statistics; right-click to choose format, open download settings, or open the download folder. Library update messages now appear in the main status bar."
      - "When returning to BGM or chat, Now Singing / Now Playing becomes Now. Chat themes are enabled by default while existing disabled preferences are preserved."
      - "Clicking elsewhere clears the Meter knob highlight and commits and ends percentage editing."
      - "Waits for audio output readiness before playing local BGM to avoid occasional autoplay failures."
      - "Lyrics style cards now consistently show a clear style description below the name."
      - "The new launcher supports normal, recommended, and emergency hotfix updates; recommended and emergency updates can prompt at next launch."
    zh-TW:
      - 辣味維利炸醬麵滿好吃的，熬夜工作的夜貓子快樂！
      - "修復從 2.1.3.2 更新至 2.1.4.0 後看不到新主題的問題。"
      - "修復歌單區塊放大後拖曳卡住的問題。"
      - "YouTube 下載預設改為 MP3 320 kbps，格式只保留 MP3、WAV。已下載的音訊可在本機轉換格式，保留原始檔案並避免覆寫同名檔案。"
      - "歌曲統計列右側新增「下載所有 YouTube 檔案」入口；右鍵可選擇格式、開啟下載設定與下載資料夾。歌曲庫更新訊息改顯示於主畫面狀態列。"
      - "切回 BGM／聊天時，既有 Now Singing／Now Playing 標題改為 Now。聊天主題預設開啟，保留使用者已設定的關閉偏好。"
      - "Meter 點擊其他位置後會清除旋鈕的 highlight，並提交、結束百分比數值編輯。"
      - "本機 BGM 等待音訊輸出就緒後再播放，避免偶發性自動播放失敗。"
      - "歌詞樣式卡片統一在名稱下方顯示清楚的樣式說明。"
      - "新版啟動器支援一般、建議與緊急修正更新，建議與緊急更新可在下次啟動時提示。"
    zh-CN:
      - 辣味维利炸酱面真的很好吃，熬夜工作的夜猫子快乐！
      - "修复从 2.1.3.2 更新至 2.1.4.0 后看不到新主题的问题。"
      - "修复歌单区块放大后拖动卡住的问题。"
      - "YouTube 下载默认改为 MP3 320 kbps，格式只保留 MP3、WAV。已下载的音频可在本地转换格式，保留原始文件并避免覆盖同名文件。"
      - "歌曲统计行右侧新增“下载所有 YouTube 文件”入口；右键可选择格式、打开下载设置与下载文件夹。歌曲库更新消息改在主界面状态栏显示。"
      - "切回 BGM／聊天时，现有 Now Singing／Now Playing 标题改为 Now。聊天主题默认启用，保留用户已设置的关闭偏好。"
      - "Meter 点击其他位置后会清除旋钮高亮，并提交、结束百分比数值编辑。"
      - "本地 BGM 等待音频输出就绪后再播放，避免偶发的自动播放失败。"
      - "歌词样式卡片统一在名称下方显示清晰的样式说明。"
      - "新版启动器支持常规、建议与紧急修复更新，建议与紧急更新可在下次启动时提示。"
    ja:
      - 辛口維力炸醤麺はとてもおいしく、夜更かしで働く夜型さんも幸せです！
      - "2.1.3.2 から 2.1.4.0 への更新後に新しいテーマが表示されない問題を修正します。"
      - "拡大した曲リストのブロックをドラッグすると動かなくなる問題を修正します。"
      - "YouTube ダウンロードの既定形式を MP3 320 kbps に変更し、MP3 と WAV のみに整理します。ダウンロード済み音声はローカルで変換でき、元のファイルを保持して同名ファイルの上書きを防ぎます。"
      - "曲数表示の右側に「すべての YouTube ファイルをダウンロード」を追加します。右クリックで形式、ダウンロード設定、保存先フォルダーを選べます。ライブラリ更新はメイン画面のステータスバーに表示します。"
      - "BGM／雑談に戻ると Now Singing／Now Playing の見出しを Now に変更します。雑談テーマは既定で有効にし、無効に設定済みの場合は保持します。"
      - "別の場所をクリックすると Meter ノブの強調表示を解除し、パーセント値を確定して編集を終了します。"
      - "ローカル BGM は音声出力の準備完了を待ってから再生し、まれな自動再生失敗を防ぎます。"
      - "歌詞スタイルカードでは、名前の下に分かりやすいスタイル説明を統一して表示します。"
      - "新しいランチャーは通常・推奨・緊急修正の更新に対応し、推奨更新と緊急修正は次回起動時に通知できます。"
    ko:
      - 매운 웨이리 짜장라면은 정말 맛있어요. 늦게까지 일하는 올빼미들에게 작은 행복입니다!
      - "2.1.3.2에서 2.1.4.0으로 업데이트한 후 새 테마가 표시되지 않는 문제를 수정합니다."
      - "재생목록 블록을 확대한 후 드래그할 때 멈추는 문제를 수정합니다."
      - "YouTube 다운로드 기본 형식을 MP3 320 kbps로 변경하고 MP3와 WAV만 제공합니다. 다운로드한 오디오는 로컬에서 변환할 수 있으며 원본을 보존하고 같은 이름의 파일을 덮어쓰지 않습니다."
      - "곡 통계 오른쪽에 모든 YouTube 파일 다운로드 기능을 추가합니다. 오른쪽 클릭으로 형식, 다운로드 설정, 저장 폴더를 선택할 수 있으며 라이브러리 업데이트 메시지는 메인 화면 상태 표시줄에 표시합니다."
      - "BGM／대화로 돌아가면 Now Singing／Now Playing 제목을 Now로 바꿉니다. 대화 테마는 기본 활성화하며 기존의 끄기 설정은 유지합니다."
      - "다른 곳을 클릭하면 Meter 노브 강조를 지우고 백분율 값을 적용한 뒤 편집을 종료합니다."
      - "로컬 BGM은 오디오 출력 준비 후 재생하여 간헐적인 자동 재생 실패를 방지합니다."
      - "가사 스타일 카드에 이름 아래 명확한 스타일 설명을 일관되게 표시합니다."
      - "새 런처는 일반·권장·긴급 수정 업데이트를 지원하며 권장 및 긴급 업데이트는 다음 실행 시 알릴 수 있습니다."


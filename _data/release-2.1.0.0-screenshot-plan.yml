capture_rules:
  - 使用最終 Release build 與乾淨測試專案，不得使用概念圖代替實際畫面。
  - 每張圖先完成對應功能的實機測試，再拍攝一致尺寸、100% Windows 顯示縮放的畫面。
  - 不顯示私人檔案路徑、串流金鑰、裝置序號或其他敏感資料。
  - 五個語言頁面使用對應介面語言的同名資產；不得把繁體中文 UI 當成其他語言的完成截圖。
  - 圖片加入頁面後檢查 alt、figcaption、行動版裁切與放大連結。

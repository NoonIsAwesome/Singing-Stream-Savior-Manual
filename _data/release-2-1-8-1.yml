release:
  version: "2.1.8.1"
  date: "2026-10-06"
  latest: true
  type:
    zh-TW: "更新復原、啟動提示與 YouTube 搜尋"
    en: "Update recovery, startup feedback and YouTube search"
    zh-CN: "更新恢复、启动提示与 YouTube 搜索"
    ja: "更新の復元、起動表示と YouTube 検索"
    ko: "업데이트 복구, 시작 안내와 YouTube 검색"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.8.1"
  summary:
    zh-TW: "修正更新復原問題，改善啟動提示、UI 與 YouTube 搜尋。"
    en: "Fix update recovery and improve startup feedback, UI, and YouTube search."
    zh-CN: "修复更新恢复问题，改善启动提示、UI 与 YouTube 搜索。"
    ja: "更新の復元を修正し、起動表示、UI、YouTube 検索を改善。"
    ko: "업데이트 복구를 수정하고 시작 안내, UI, YouTube 검색을 개선합니다."
  items:
    zh-TW:
      - "啟動器更新為 1.2.1.2：改善中斷更新復原，處理短暫檔案占用及唯讀備份；無法啟動時直接顯示可複製的錯誤資訊，並保留備份。"
      - "軟體準備與專案載入使用三點提示；準備畫面統一背景，移除取消按鈕。將首次字型快取準備與資源監測初始化移至背景，減少介面阻塞。"
      - "修正淺色模式播放歌曲的文字、播放符號與 YouTube 下載圖示對比。"
      - "附加歌詞或封面成功後關閉歌曲設定視窗；取消或失敗保留視窗，其他分頁未儲存的變更仍會提示。"
      - "修正歌詞、歌曲資訊與 YouTube 預覽等按鈕滑鼠點擊後殘留的焦點外框，保留鍵盤操作。"
      - "伴奏搜尋加入多語關鍵字，依輸入文字調整優先順序；保留明確輸入的關鍵字，結果不足時再擴充搜尋。"
      - "原曲優先搜尋 YouTube Music 的歌曲，結果不足或服務失敗時使用一般 YouTube 搜尋。"
      - "移除 YouTube 搜尋篩選按鈕右側的擴展說明，改用 tooltip。"
      - "外觀切換按鈕移除邊框，涵蓋專案選擇與主畫面。"
      - "預設曲風新增「金屬」「藍調」。"
      - "歌曲搜尋建議增加文字大小與每列高度，方便點選。"
    en:
      - "Launcher 1.2.1.2 improves interrupted update recovery for transient file locks and read-only backups. Launch failures show copyable error details and preserve backups."
      - "Use three-dot startup and project-loading feedback with a uniform preparation background and no Cancel button. Prepare initial font caches and initialize resource monitoring in the background to reduce UI blocking."
      - "Improve light-mode playing-song text, playback markers, and the YouTube download icon contrast."
      - "Close Song Settings after lyrics or cover art is successfully attached. Keep it open on cancellation or failure, and preserve prompts for unsaved changes in other tabs."
      - "Prevent mouse clicks from leaving focus borders on lyrics, song information, and YouTube preview buttons while retaining keyboard operation."
      - "Instrumental search prioritizes multilingual keywords from the query, keeps explicit qualifiers, and expands when results are insufficient."
      - "Original searches prefer YouTube Music songs, falling back to YouTube when more results are needed or the service fails."
      - "Replace the expansion explanation beside YouTube filters with tooltips."
      - "Remove the appearance button border in the project chooser and main window."
      - "Add Metal and Blues to preset genres."
      - "Enlarge song search suggestion text and row height for easier selection."
    zh-CN:
      - "启动器更新为 1.2.1.2：改善中断更新恢复，处理短暂文件占用及只读备份；无法启动时直接显示可复制的错误信息，并保留备份。"
      - "软件准备与项目加载使用三点提示；准备画面统一背景，移除取消按钮。将首次字体缓存准备与资源监测初始化移至后台，减少界面阻塞。"
      - "修复浅色模式播放歌曲的文字、播放符号与 YouTube 下载图标对比。"
      - "附加歌词或封面成功后关闭歌曲设置窗口；取消或失败保留窗口，其他标签页未保存的更改仍会提示。"
      - "修复歌词、歌曲信息与 YouTube 预览等按钮鼠标点击后残留的焦点边框，保留键盘操作。"
      - "伴奏搜索加入多语言关键词，依输入文字调整优先顺序；保留明确输入的关键词，结果不足时再扩展搜索。"
      - "原曲优先搜索 YouTube Music 的歌曲，结果不足或服务失败时使用普通 YouTube 搜索。"
      - "移除 YouTube 搜索筛选按钮右侧的扩展说明，改用 tooltip。"
      - "外观切换按钮移除边框，涵盖项目选择与主界面。"
      - "默认曲风新增「金属」「蓝调」。"
      - "歌曲搜索建议增加文字大小与每行高度，方便点选。"
    ja:
      - "ランチャー 1.2.1.2 では一時的なファイルロックと読み取り専用バックアップからの更新復元を改善。起動できない場合はコピー可能なエラー情報を表示し、バックアップを保持します。"
      - "起動準備とプロジェクト読み込みに三点表示を使用。準備画面の背景を統一し、キャンセルボタンを削除。初回フォントキャッシュ準備とリソース監視の初期化をバックグラウンドに移し、UI の停止時間を減らします。"
      - "ライトモードの再生中楽曲の文字、再生マーク、YouTube ダウンロードアイコンのコントラストを改善。"
      - "歌詞やカバーの添付成功後に楽曲設定を閉じます。キャンセルや失敗時は開いたままにし、他のタブの未保存変更は確認します。"
      - "歌詞、楽曲情報、YouTube プレビューのボタンをマウスで押した後のフォーカス枠を修正。キーボード操作は維持します。"
      - "伴奏検索で入力に応じた多言語キーワードを優先し、指定キーワードを保持します。結果が不足した場合は追加検索します。"
      - "原曲検索では YouTube Music の楽曲を優先し、結果不足やサービスのエラー時は YouTube でも検索します。"
      - "YouTube 検索フィルター横の説明をツールチップに移動。"
      - "プロジェクト選択とメイン画面の外観切替ボタンの枠線を削除。"
      - "ジャンルの初期候補にメタルとブルースを追加。"
      - "楽曲検索候補の文字と行の高さを大きくして選択しやすく。"
    ko:
      - "런처 1.2.1.2에서 일시적인 파일 잠금과 읽기 전용 백업의 중단된 업데이트 복구를 개선합니다. 시작 실패 시 복사 가능한 오류 정보를 표시하고 백업을 보존합니다."
      - "시작 준비와 프로젝트 로딩에 세 점 표시를 사용합니다. 준비 화면 배경을 통일하고 취소 버튼을 제거합니다. 초기 글꼴 캐시 준비와 리소스 모니터 초기화를 백그라운드로 이동해 UI 멈춤을 줄입니다."
      - "밝은 모드에서 재생 중인 곡의 글자, 재생 표시와 YouTube 다운로드 아이콘 대비를 개선합니다."
      - "가사나 커버를 성공적으로 첨부하면 곡 설정을 닫습니다. 취소나 실패 시 창을 유지하며 다른 탭의 저장하지 않은 변경은 확인합니다."
      - "가사, 곡 정보와 YouTube 미리보기 버튼을 마우스로 클릭한 후 남는 포커스 테두리를 수정하고 키보드 조작은 유지합니다."
      - "반주 검색에서 입력에 맞는 다국어 키워드를 우선하며 직접 지정한 키워드를 유지합니다. 결과가 부족하면 검색을 확장합니다."
      - "원곡은 YouTube Music의 곡을 먼저 검색하며 결과가 부족하거나 서비스가 실패하면 YouTube로 전환합니다."
      - "YouTube 검색 필터 옆 설명을 툴팁으로 이동합니다."
      - "프로젝트 선택과 메인 화면의 외관 전환 버튼 테두리를 제거합니다."
      - "기본 장르에 메탈과 블루스를 추가합니다."
      - "곡 검색 추천의 글자와 행 높이를 늘려 선택하기 쉽게 합니다."

release:
  version: "2.1.8.1"
  date: "2026-10-06"
  latest: true
  type:
    zh-TW: "更新復原、啟動提示與 YouTube 搜尋"
    en: "Update recovery, startup feedback and YouTube search"
    zh-CN: "更新恢复、启动提示与 YouTube 搜索"
    ja: "更新の復元、起動表示と YouTube 検索"
    ko: "업데이트 복구, 시작 안내와 YouTube 검색"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.8.1"
  summary:
    zh-TW: "修正更新復原問題，改善啟動提示、介面與 YouTube 搜尋。"
    en: "Fix update recovery and improve startup feedback, the interface, and YouTube search."
    zh-CN: "修复更新恢复问题，改善启动提示、界面与 YouTube 搜索。"
    ja: "更新の復元を修正し、起動表示、画面、YouTube 検索を改善。"
    ko: "업데이트 복구를 수정하고 시작 안내, 인터페이스, YouTube 검색을 개선합니다."
  items:
    zh-TW:
      - "他很讚！嘟嘟嘟！這版改善了一些使用體驗和意外發現的問題👍🏻"
      - "啟動器更新為 1.2.1.2：改善中斷更新的復原機制，處理短暫檔案占用及唯讀備份；無法啟動時直接顯示可複製的錯誤資訊，並保留備份。"
      - "改善軟體啟動準備與專案載入。"
      - "修正淺色模式下，播放中歌曲的文字、播放符號與 YouTube 下載圖示不清楚的問題。"
      - "改善一些介面的hover、操作體驗。"
      - "改善YouTube搜尋機制。"
      - "放大歌曲搜尋建議的文字與每列高度，方便點選。"
    en:
      - "It's awesome! Toot, toot, toot! This update improves the user experience and fixes a few unexpectedly discovered issues 👍🏻"
      - "Launcher 1.2.1.2 improves interrupted update recovery for transient file locks and read-only backups. Launch failures show copyable error details and preserve backups."
      - "Improve application startup preparation and project loading."
      - "Fix hard-to-see playing-song text, playback markers, and the YouTube download icon in Light mode."
      - "Improve hover feedback and interaction across parts of the interface."
      - "Improve the YouTube search mechanism."
      - "Enlarge song search suggestion text and row height for easier selection."
    zh-CN:
      - "他很赞！嘟嘟嘟！这版改善了一些使用体验和意外发现的问题👍🏻"
      - "启动器更新为 1.2.1.2：改善中断更新的恢复机制，处理短暂文件占用及只读备份；无法启动时直接显示可复制的错误信息，并保留备份。"
      - "改善软件启动准备与项目加载。"
      - "修复浅色模式下，播放中歌曲的文字、播放符号与 YouTube 下载图标不清楚的问题。"
      - "改善部分界面的悬停反馈和操作体验。"
      - "改善YouTube搜索机制。"
      - "放大歌曲搜索建议的文字与每行高度，方便点选。"
    ja:
      - "とってもいい感じ！トゥートゥートゥー！今回は使い勝手と、思いがけず見つかった問題を改善しました👍🏻"
      - "ランチャー 1.2.1.2 では、一時的なファイルロックや読み取り専用バックアップからの中断更新の復元を改善。起動できない場合はコピー可能なエラー情報を表示し、バックアップを保持します。"
      - "アプリの起動準備とプロジェクトの読み込みを改善。"
      - "ライトモードで再生中の曲の文字、再生マーク、YouTube ダウンロードアイコンが見えにくい問題を修正。"
      - "画面の一部でホバー表示や操作性を改善。"
      - "YouTube の検索方法を改善。"
      - "曲の検索候補の文字と行の高さを大きくして、選択しやすくしました。"
    ko:
      - "아주 좋아요! 뚜뚜뚜! 이번 버전에서는 사용 경험과 예상치 못하게 발견한 문제들을 개선했어요👍🏻"
      - "런처 1.2.1.2에서 일시적인 파일 잠금과 읽기 전용 백업의 중단된 업데이트 복구를 개선합니다. 시작 실패 시 복사 가능한 오류 정보를 표시하고 백업을 보존합니다."
      - "앱 시작 준비와 프로젝트 로딩을 개선합니다."
      - "밝은 모드에서 재생 중인 곡의 글자, 재생 표시와 YouTube 다운로드 아이콘이 잘 보이지 않는 문제를 수정합니다."
      - "일부 화면의 마우스 오버 표시와 조작 경험을 개선합니다."
      - "YouTube 검색 방식을 개선합니다."
      - "곡 검색 추천의 글자와 행 높이를 늘려 선택하기 쉽게 합니다."
  emphasizedItems:
    zh-TW:

release:
  version: "2.2.1.0"
  date: "2026-10-28"
  publishedAt: "2026-10-28T10:10:33Z"
  latest: true
  type:
    en: "Video playback, song volume balance and White Orbit"
    zh-TW: "影片播放、歌曲音量平衡與 White Orbit"
    zh-CN: "视频播放、歌曲音量平衡与 White Orbit"
    ja: "動画再生・曲の音量調整・White Orbit"
    ko: "동영상 재생·곡별 음량 조절·White Orbit"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.2.1.0"
  summary:
    en: "Per-song volume control, video playback and easier lyric searching."
    zh-TW: "新增歌曲音量平衡與影片播放，讓歌回準備更方便。"
    zh-CN: "新增歌曲音量平衡与视频播放，让歌回准备更方便。"
    ja: "曲ごとの音量調整、動画再生、歌詞検索の改善。"
    ko: "곡별 음량 조절, 동영상 재생 및 가사 검색 개선."
  items:
    en:
      - "Join the S3S user Discord for questions, issue reports, feature wishes, discussion and update news: [Discord](https://discord.gg/3ST7NyCSrT)"
      - "Balance volume between songs with automatic compensation, or adjust each song’s gain manually and save it with your project."
      - "Play MP4 and MOV duet videos. Save chroma key settings per video and capture supported transparent video in OBS; press Esc to leave clean capture. [Setup guide](https://noonisawesome.dev/en/video-and-volume.html)"
      - "Improve lyric searches with cleaner song titles, clearer source labels and accompaniment duration hints."
      - "**New White Orbit animated ring theme.** Customize text and signal colors, fonts, and the glass panel’s opacity and blur. The circular panel shows the current song and performer, surrounded by a rotating waveform that responds to the audio signal."
      - "Improve latency compensation for WASAPI audio."
      - "Improve song request and lyric download stability, keeping queue status and completed-song records consistent when Reserve changes."
    zh-TW:
      - "**S3S 使用者 Discord 群組開放囉！** 歡迎加入發問、回報問題、許願功能與討論，也能收到更新通知。 [加入 Discord 群組](https://discord.gg/3ST7NyCSrT)"
      - "**歌曲音量更容易平衡。** 新增自動音量平衡，減少每首歌忽大忽小的差異；也能逐曲手動微調增益，並隨專案保存。"
      - "**支援 MP4／MOV 合唱影片播放！** 可播放合唱夥伴預錄的影片，分別保存每支影片的色度鍵去背參數，也支援帶有透明背景的 MOV。影片畫面與主播放器同步，並提供 OBS 透明視窗擷取教學；乾淨擷取可按 Esc 返回。 [OBS 透明視窗擷取教學](https://noonisawesome.dev/video-and-volume.html)"
      - "**歌詞搜尋更方便。** 自動整理歌曲搜尋關鍵字，清楚顯示找到的歌詞來源與伴奏長度，方便挑選相符版本。"
      - "**新增 White Orbit 動態圓環主題。** 可自訂文字與訊號顏色、字型，以及玻璃底板的透明度與模糊程度；主題設計為圓形面板，顯示當下演唱歌曲及演出者，外圍會有隨訊號跳動的旋轉波型。"
      - "改善 WASAPI 音訊的延遲補償機制。"
      - "改善點歌與歌詞下載的穩定性，讓調整待播清單時的點歌狀態與已唱紀錄更一致。"
    zh-CN:
      - "S3S 用户 Discord 群组开放啦！欢迎加入提问、反馈问题、许愿功能与讨论，也能收到更新通知：[Discord](https://discord.gg/3ST7NyCSrT)"
      - "新增自动音量平衡，减少歌曲之间忽大忽小的差异；也能逐曲手动微调增益，并随项目保存。"
      - "支持 MP4／MOV 合唱视频播放，可分别保存色度键参数，并在 OBS 采集支持的透明视频；干净采集可按 Esc 返回。 [详细教程](https://noonisawesome.dev/zh-CN/video-and-volume.html)"
      - "改善歌词搜索，自动整理歌曲关键词，并清楚显示来源与伴奏长度，方便挑选匹配版本。"
      - "**新增 White Orbit 动态圆环主题。** 可自定义文字与信号颜色、字体，以及玻璃底板的透明度与模糊程度；圆形面板显示当前演唱的歌曲及演出者，外圈旋转波形随声音信号跳动。"
      - "改善 WASAPI 音频的延迟补偿机制。"
      - "改善点歌与歌词下载的稳定性，让调整待播列表时的点歌状态与已唱记录更一致。"
    ja:
      - "S3S ユーザー Discord に参加しませんか？質問、不具合報告、機能リクエストや交流に利用でき、更新情報も届きます：[Discord](https://discord.gg/3ST7NyCSrT)"
      - "自動音量補正で曲ごとの音量差を抑えられます。曲別のゲインを手動で微調整し、プロジェクトに保存することもできます。"
      - "MP4／MOV のデュエット動画を再生し、動画ごとにクロマキー設定を保存できます。対応する透過動画を OBS でキャプチャでき、クリーンキャプチャは Esc で解除できます。 [設定ガイド](https://noonisawesome.dev/ja/video-and-volume.html)"
      - "歌詞検索の曲名を整理し、提供元と伴奏の長さをわかりやすく表示して、合うバージョンを選びやすくしました。"
      - "**White Orbit の動く円環テーマを追加。** 文字と信号の色、フォント、ガラスパネルの不透明度とぼかしを調整できます。円形パネルに現在の曲とアーティストを表示し、周囲の回転する波形が音声信号に反応します。"
      - "WASAPI 音声の遅延補正を改善しました。"
      - "リクエストと歌詞ダウンロードの安定性を改善し、待機リスト変更時の状態と歌唱済み履歴の整合性を高めました。"
    ko:
      - "S3S 사용자 Discord에 참여하세요! 질문, 오류 제보, 기능 제안과 토론을 나누고 업데이트 소식도 받을 수 있습니다: [Discord](https://discord.gg/3ST7NyCSrT)"
      - "자동 음량 보정으로 곡 사이의 음량 차이를 줄입니다. 곡별 게인을 직접 조절하고 프로젝트에 저장할 수도 있습니다."
      - "MP4／MOV 듀엣 영상을 재생하고 영상마다 크로마키 설정을 저장할 수 있습니다. 지원되는 투명 영상을 OBS에서 캡처하고 Esc로 클린 캡처를 종료할 수 있습니다. [설정 안내](https://noonisawesome.dev/ko/video-and-volume.html)"
      - "가사 검색어를 정리하고 출처와 반주 길이를 명확하게 표시하여 알맞은 버전을 선택하기 쉽게 했습니다."
      - "**White Orbit 동적 원형 테마를 추가했습니다.** 글자와 신호 색상, 글꼴, 유리 패널의 불투명도와 흐림을 조절할 수 있습니다. 원형 패널에는 현재 곡과 아티스트가 표시되고, 바깥쪽의 회전 파형은 오디오 신호에 반응합니다."
      - "WASAPI 오디오의 지연 보정 기능을 개선했습니다."
      - "신청곡과 가사 다운로드의 안정성을 개선하고, 대기 목록 변경 시 신청 상태와 완료 기록이 일치하도록 했습니다."

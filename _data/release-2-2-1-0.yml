release:
  version: "2.2.1.0"
  date: "2026-10-29"
  publishedAt: "2026-10-29T04:52:10Z"
  latest: true
  type:
    en: "Video playback, song volume balance and White Orbit"
    zh-TW: "影片播放、歌曲音量平衡與 White Orbit"
    zh-CN: "视频播放、歌曲音量平衡与 White Orbit"
    ja: "動画再生・曲の音量調整・White Orbit"
    ko: "동영상 재생·곡별 음량 조절·White Orbit"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.2.1.0"
  summary:
    en: "Per-song volume control, video playback and easier lyric searching."
    zh-TW: "新增歌曲音量平衡與影片播放，讓歌回準備更方便。"
    zh-CN: "新增歌曲音量平衡与视频播放，让歌回准备更方便。"
    ja: "曲ごとの音量調整、動画再生、歌詞検索の改善。"
    ko: "곡별 음량 조절, 동영상 재생 및 가사 검색 개선."
  items:
    en:
      - "**The S3S user Discord is open.** Ask questions, report issues, request features, chat with other users and receive update news. [Join the Discord](https://discord.gg/3ST7NyCSrT)"
      - "Improve OBS theme animations and song lists. Prevent Windows Reduce motion from interrupting stream animations, and keep the full song list accessible with reduced animations."
      - "**Add song volume balancing and per-song gain.** Automatically reduce volume differences between songs, or fine-tune each song’s gain manually and save it with your project."
      - "**Support MP4 and MOV duet videos.** Videos stay in sync with the main player. Save chroma key settings separately for each video, play transparent MOV files and follow the OBS transparent-window capture guide; press Esc to leave clean capture. [OBS transparent-window capture guide](https://noonisawesome.dev/en/video-and-volume.html)"
      - "**Unify lyric and cover searches.** Improved keyword cleanup makes automatic searches smarter."
      - "**Add the White Orbit animated ring theme.** Customize colors, fonts, and the glass panel’s opacity and blur. The theme displays the song and performer, with an outer waveform that responds to the audio signal."
      - "Improve WASAPI audio latency compensation."
      - "Improve song request and lyric download stability. Prevent incorrect request status and completed-song records when the upcoming queue is changed."
      - "Improve vocal removal for YouTube songs. Automatically reacquire audio when the source cannot be read."
    zh-TW:
      - "**開放 S3S 使用者 Discord 群組。** 提供發問、問題回報、功能許願、交流與更新通知。[加入群組](https://discord.gg/3ST7NyCSrT)"
      - "改善 OBS 主題動畫與歌單顯示。 避免 Windows「減少動態」設定中斷直播動畫，並讓減少動畫模式仍能完整瀏覽歌單。"
      - "**新增歌曲音量平衡與逐曲增益。** 自動減少歌曲間忽大忽小的差異，也能手動微調每首歌的增益，隨專案保存。"
      - "**支援 MP4／MOV 合唱影片。** 影片與主播放器同步，可分別保存色度鍵參數，支援透明背景 MOV，並提供 OBS 透明視窗擷取教學；乾淨擷取可按 Esc 返回。 [OBS 透明視窗擷取教學](https://noonisawesome.dev/video-and-volume.html)"
      - "**統一歌詞與封面搜尋入口。** 改善關鍵字整理機制，讓自動搜尋功能更聰明。"
      - "**新增 White Orbit 動態圓環主題。** 可自訂顏色、字型、玻璃底板透明度與模糊程度，顯示歌曲及演出者，外圍波形隨音訊訊號律動。"
      - "改善 WASAPI 音訊延遲補償。"
      - "改善點歌與歌詞下載穩定性。 避免調整待播清單時，點歌狀態與已唱紀錄出錯。"
      - "改善 YouTube 歌曲去人聲。 音訊來源無法讀取時可自動重新取得。"
    zh-CN:
      - "**开放 S3S 用户 Discord 群组。** 提供提问、问题反馈、功能许愿、交流与更新通知。[加入群组](https://discord.gg/3ST7NyCSrT)"
      - "改善 OBS 主题动画与歌单显示。 避免 Windows“减少动态”设置中断直播动画，并让减少动画模式仍能完整浏览歌单。"
      - "**新增歌曲音量平衡与逐曲增益。** 自动减少歌曲间忽大忽小的差异，也能手动微调每首歌的增益，随项目保存。"
      - "**支持 MP4／MOV 合唱视频。** 视频与主播放器同步，可分别保存色度键参数，支持透明背景 MOV，并提供 OBS 透明窗口采集教程；干净采集可按 Esc 返回。 [OBS 透明窗口采集教程](https://noonisawesome.dev/zh-CN/video-and-volume.html)"
      - "**统一歌词与封面搜索入口。** 改善关键词整理机制，让自动搜索功能更聪明。"
      - "**新增 White Orbit 动态圆环主题。** 可自定义颜色、字体、玻璃底板透明度与模糊程度，显示歌曲及演出者，外围波形随音频信号律动。"
      - "改善 WASAPI 音频延迟补偿。"
      - "改善点歌与歌词下载稳定性。 避免调整待播列表时，点歌状态与已唱记录出错。"
      - "改善 YouTube 歌曲去人声。 音频来源无法读取时可自动重新获取。"
    ja:
      - "**S3S ユーザー Discord を開設。** 質問、不具合報告、機能リクエスト、交流、更新情報の確認に利用できます。[Discord に参加](https://discord.gg/3ST7NyCSrT)"
      - "OBS テーマのアニメーションと曲一覧を改善。 Windows の「アニメーション効果を減らす」設定で配信アニメーションが止まることを防ぎ、動きを減らす場合も曲一覧をすべて確認できます。"
      - "**曲の音量バランス調整と曲別ゲインを追加。** 曲ごとの音量差を自動で抑えられます。各曲のゲインを手動で微調整し、プロジェクトに保存することもできます。"
      - "**MP4／MOV のデュエット動画に対応。** 動画はメインプレーヤーと同期します。動画ごとにクロマキー設定を保存でき、透過 MOV にも対応。OBS の透過ウィンドウキャプチャの手順を用意しました。クリーンキャプチャは Esc で解除できます。 [OBS の透過ウィンドウキャプチャの手順](https://noonisawesome.dev/ja/video-and-volume.html)"
      - "**歌詞・カバー画像の検索窓口を統一。** キーワードの整理を改善し、自動検索をより賢くしました。"
      - "**White Orbit の動く円環テーマを追加。** 色、フォント、ガラスパネルの不透明度とぼかしを調整できます。曲名とアーティストを表示し、外側の波形が音声信号に反応します。"
      - "WASAPI 音声の遅延補正を改善。"
      - "曲のリクエストと歌詞ダウンロードの安定性を改善。 待機中の曲一覧を変更した際に、リクエストの状態や歌唱済みの記録が誤ることを防ぎます。"
      - "YouTube の曲のボーカル除去を改善。 音声ソースを読み取れない場合は、自動で音声を再取得します。"
    ko:
      - "**S3S 사용자 Discord를 개설했습니다.** 질문, 문제 제보, 기능 요청, 사용자 교류와 업데이트 소식을 확인할 수 있습니다. [Discord 참여](https://discord.gg/3ST7NyCSrT)"
      - "OBS 테마 애니메이션과 곡 목록 표시를 개선했습니다. Windows의 동작 줄이기 설정으로 방송 애니메이션이 멈추는 문제를 방지하고, 애니메이션을 줄여도 전체 곡 목록을 볼 수 있습니다."
      - "**곡 음량 균형과 곡별 게인을 추가했습니다.** 곡 사이의 음량 차이를 자동으로 줄이거나 각 곡의 게인을 직접 미세 조정해 프로젝트에 저장할 수 있습니다."
      - "**MP4／MOV 듀엣 동영상을 지원합니다.** 동영상은 메인 플레이어와 동기화됩니다. 동영상별 크로마키 설정과 투명 배경 MOV를 지원하며 OBS 투명 창 캡처 안내도 제공합니다. 클린 캡처는 Esc로 해제할 수 있습니다. [OBS 투명 창 캡처 안내](https://noonisawesome.dev/ko/video-and-volume.html)"
      - "**가사와 커버 이미지 검색 창을 통합했습니다.** 키워드 정리 방식을 개선해 자동 검색이 더 똑똑해졌습니다."
      - "**White Orbit 동적 원형 테마를 추가했습니다.** 색상, 글꼴, 유리 패널의 불투명도와 흐림을 조절할 수 있습니다. 곡과 아티스트를 표시하고 바깥쪽 파형이 오디오 신호에 반응합니다."
      - "WASAPI 오디오 지연 보정을 개선했습니다."
      - "신청곡과 가사 다운로드의 안정성을 개선했습니다. 재생 대기 목록을 조정할 때 신청곡 상태와 부른 곡 기록에 오류가 생기지 않도록 개선했습니다."
      - "YouTube 곡의 보컬 제거를 개선했습니다. 오디오 소스를 읽을 수 없으면 자동으로 다시 가져옵니다."

ui:
  zh-TW:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "第三方元件與授權聲明"
    lead: "歌回救星使用了許多開源專案，才能完成音訊播放、裝置整合、歌詞轉換與 UVR 人聲消除。謝謝每一位開發者與貢獻者。"
    package_title: "授權文件在哪裡"
    package_text: "解壓縮後，開啟內層 Singing Stream Savior/Licenses，即可查看授權文字、第三方聲明與隨附來源。UVR 各元件也保留自己的 licenses。完整條款以套件文件與官方原文為準。"
    uvr_title: "UVR 元件的授權與來源"
    uvr_text: "套件包含 UVR 相關程式、模型與執行元件的來源、開發者署名及授權文件；完整條款與 NOTICE 均隨附於套件。"
    uvr_content_rights: "本節說明程式、模型及執行元件的授權，不涵蓋使用者輸入的歌曲或分離結果所涉及的音樂、錄音等內容權利。開源元件的使用許可，不等於歌曲的使用授權。"
    project: "專案"
    license: "授權／聲明"
    source: "官方來源"
    source_label: "專案網站"
    closing: "本頁列出第三方元件與授權摘要，不取代各專案的完整授權文字。列出的開源專案不代表其作者或貢獻者為歌回救星背書。"
    previous: "上一頁：作者與聯絡"
  zh-CN:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "第三方组件与许可声明"
    lead: "Singing Stream Savior 使用了许多开源项目，才得以完成音频播放、设备集成、歌词转换与 UVR 人声消除。感谢每一位开发者和贡献者。"
    package_title: "在哪里查看许可文件"
    package_text: "解压后，打开内层 Singing Stream Savior/Licenses，即可查看许可文本、第三方声明与随附源代码。UVR 各组件也保留自己的 licenses。完整条款以软件包文档与官方原文为准。"
    uvr_title: "UVR 组件的许可与来源"
    uvr_text: "软件包包含 UVR 相关代码、模型与运行组件的来源、开发者署名及许可文档；完整条款与 NOTICE 均随附于软件包。"
    uvr_content_rights: "本节说明程序、模型及运行组件的许可，不涵盖用户输入的歌曲或分离结果所涉及的音乐、录音等内容权利。开源组件的使用许可，不等于歌曲的使用授权。"
    project: "项目"
    license: "许可／声明"
    source: "官方来源"
    source_label: "项目网站"
    closing: "本页列出第三方组件与许可摘要，不替代各项目的完整许可文本。列出的开源项目不代表其作者或贡献者为 Singing Stream Savior 背书。"
    previous: "上一页：作者与联系"
  en:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "Third-party components and license notices"
    lead: "Singing Stream Savior builds on open-source projects for audio playback, device integration, lyric conversion, and UVR vocal removal. Thank you to every developer and contributor."
    package_title: "Where to find the license files"
    package_text: "After extracting, open the inner Singing Stream Savior/Licenses folder for license texts, third-party notices, and supplied source. UVR components also retain their own licenses folders. The packaged documents and official upstream terms are authoritative."
    uvr_title: "Licenses and provenance for UVR components"
    uvr_text: "The package includes provenance, attribution, and license documents for the UVR-related code, models, and runtime components, including the accompanying NOTICE files."
    uvr_content_rights: "This section covers licenses for code, models, and runtime components. It does not cover rights in music, sound recordings, or other content present in user inputs or separated tracks. An open-source component license is not a license to use a song."
    project: "Project"
    license: "License / notice"
    source: "Official source"
    source_label: "Project site"
    closing: "This page lists third-party components and license summaries; it does not replace their complete license texts. No listed project or contributor endorses Singing Stream Savior."
    previous: "Previous: Creator and support"
  ja:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "第三者コンポーネントとライセンス通知"
    lead: "Singing Stream Savior は、音声再生、デバイス連携、歌詞変換、UVR ボーカル除去のために多くのオープンソースプロジェクトを利用しています。すべての開発者と貢献者に感謝します。"
    package_title: "ライセンス文書の確認場所"
    package_text: "展開後、内側の Singing Stream Savior/Licenses でライセンス、第三者通知、同梱ソースを確認できます。UVR 各コンポーネントにも専用の licenses があります。正式な条件は同梱文書と公式原文を参照してください。"
    uvr_title: "UVR コンポーネントのライセンスと出所"
    uvr_text: "UVR 関連コード、モデル、実行コンポーネントの出所、開発者クレジット、ライセンス文書、および NOTICE を同梱しています。"
    uvr_content_rights: "この節は、コード、モデル、実行コンポーネントのライセンスについて説明しています。入力した楽曲や分離した音源に含まれる音楽・録音物などの権利は対象外です。オープンソースコンポーネントのライセンスは、楽曲の利用許諾ではありません。"
    project: "プロジェクト"
    license: "ライセンス／通知"
    source: "公式ソース"
    source_label: "公式サイト"
    closing: "このページは第三者コンポーネントとライセンス概要を掲載しており、完全なライセンス文に代わるものではありません。掲載プロジェクトや貢献者が Singing Stream Savior を推奨していることを示すものではありません。"
    previous: "前のページ：制作者・お問い合わせ"
  ko:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "서드파티 구성 요소 및 라이선스 고지"
    lead: "Singing Stream Savior는 오디오 재생, 장치 연동, 가사 변환과 UVR 보컬 제거를 위해 여러 오픈 소스 프로젝트를 사용합니다. 모든 개발자와 기여자에게 감사드립니다."
    package_title: "라이선스 문서 확인 위치"
    package_text: "압축을 푼 뒤 안쪽 Singing Stream Savior/Licenses 폴더에서 라이선스, 제3자 고지 및 제공되는 소스를 확인하세요. UVR 구성 요소에도 별도의 licenses 폴더가 있습니다. 정식 조건은 동봉 문서와 공식 원문을 따릅니다."
    uvr_title: "UVR 구성 요소의 라이선스와 출처"
    uvr_text: "UVR 관련 코드, 모델 및 실행 구성 요소의 출처, 개발자 표시, 라이선스 문서와 NOTICE가 포함됩니다."
    uvr_content_rights: "이 절은 코드, 모델 및 실행 구성 요소의 라이선스를 설명합니다. 사용자가 입력한 곡이나 분리 결과에 포함된 음악·음원 등 콘텐츠의 권리는 다루지 않습니다. 오픈 소스 구성 요소의 라이선스는 곡의 이용 허락을 의미하지 않습니다."
    project: "프로젝트"
    license: "라이선스 / 고지"
    source: "공식 출처"
    source_label: "프로젝트 사이트"
    closing: "이 페이지는 서드파티 구성 요소와 라이선스 요약을 제공하며 각 프로젝트의 전체 라이선스 문서를 대신하지 않습니다. 나열된 프로젝트나 기여자가 Singing Stream Savior를 보증한다는 뜻이 아닙니다."
    previous: "이전: 제작자 및 문의"


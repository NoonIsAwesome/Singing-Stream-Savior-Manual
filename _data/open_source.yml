ui:
  zh-TW:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "開源專案與授權"
    lead: "歌回救星使用了許多開源專案，才能完成音訊播放、裝置整合、歌詞轉換與 UVR 人聲消除。謝謝每一位開發者與貢獻者。"
    package_title: "授權文件在哪裡"
    package_text: "解壓縮後，開啟內層 Singing Stream Savior/Licenses，即可查看授權文字、第三方聲明與隨附來源。UVR 各元件也保留自己的 licenses。完整條款以套件文件與官方原文為準。"
    uvr_title: "UVR、MDX 與 HP 的授權與來源"
    uvr_text: "套件包含 UVR MIT，以及 MDX、HP 模型的來源與開發者署名；HP 執行元件及其相依套件的授權文件也一併附上。"
    project: "專案"
    purpose: "在歌回救星中的用途"
    license: "授權／聲明"
    source: "官方來源"
    source_label: "專案網站"
    closing: "本頁只提供辨識元件用途的摘要，不取代各專案的完整授權文字。列出的開源專案不代表其作者或貢獻者為歌回救星背書。"
    previous: "上一頁：作者與聯絡"
  zh-CN:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "开源项目与许可"
    lead: "Singing Stream Savior 使用了许多开源项目，才得以完成音频播放、设备集成、歌词转换与 UVR 人声消除。感谢每一位开发者和贡献者。"
    package_title: "在哪里查看许可文件"
    package_text: "解压后，打开内层 Singing Stream Savior/Licenses，即可查看许可文本、第三方声明与随附源代码。UVR 各组件也保留自己的 licenses。完整条款以软件包文档与官方原文为准。"
    uvr_title: "UVR、MDX 与 HP 的许可与来源"
    uvr_text: "软件包包含 UVR MIT，以及 MDX、HP 模型的来源与开发者署名；HP 运行组件及依赖项的许可文档也一并附上。"
    project: "项目"
    purpose: "在 Singing Stream Savior 中的用途"
    license: "许可／声明"
    source: "官方来源"
    source_label: "项目网站"
    closing: "本页仅提供用于识别组件用途的摘要，不替代各项目的完整许可文本。列出的开源项目不代表其作者或贡献者为 Singing Stream Savior 背书。"
    previous: "上一页：作者与联系"
  en:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "Open-source projects and licenses"
    lead: "Singing Stream Savior builds on open-source projects for audio playback, device integration, lyric conversion, and UVR vocal removal. Thank you to every developer and contributor."
    package_title: "Where to find the license files"
    package_text: "After extracting, open the inner Singing Stream Savior/Licenses folder for license texts, third-party notices, and supplied source. UVR components also retain their own licenses folders. The packaged documents and official upstream terms are authoritative."
    uvr_title: "Licenses and provenance for UVR, MDX, and HP"
    uvr_text: "The package includes the UVR MIT license, MDX and HP model provenance and developer credits, and the license documents for the HP worker and its dependencies."
    project: "Project"
    purpose: "How Singing Stream Savior uses it"
    license: "License / notice"
    source: "Official source"
    source_label: "Project site"
    closing: "This page identifies components and their roles; it does not replace their complete license texts. No listed project or contributor endorses Singing Stream Savior."
    previous: "Previous: Creator and support"
  ja:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "オープンソースプロジェクトとライセンス"
    lead: "Singing Stream Savior は、音声再生、デバイス連携、歌詞変換、UVR ボーカル除去のために多くのオープンソースプロジェクトを利用しています。すべての開発者と貢献者に感謝します。"
    package_title: "ライセンス文書の確認場所"
    package_text: "展開後、内側の Singing Stream Savior/Licenses でライセンス、第三者通知、同梱ソースを確認できます。UVR 各コンポーネントにも専用の licenses があります。正式な条件は同梱文書と公式原文を参照してください。"
    uvr_title: "UVR・MDX・HP のライセンスと出所"
    uvr_text: "UVR の MIT ライセンス、MDX・HP モデルの出所と開発者クレジット、HP 実行コンポーネントと依存ライブラリのライセンス文書を同梱しています。"
    project: "プロジェクト"
    purpose: "Singing Stream Savior での用途"
    license: "ライセンス／通知"
    source: "公式ソース"
    source_label: "公式サイト"
    closing: "このページはコンポーネントと用途を確認するための概要であり、完全なライセンス文に代わるものではありません。掲載プロジェクトや貢献者が Singing Stream Savior を推奨していることを示すものではありません。"
    previous: "前のページ：制作者・お問い合わせ"
  ko:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "오픈 소스 프로젝트 및 라이선스"
    lead: "Singing Stream Savior는 오디오 재생, 장치 연동, 가사 변환과 UVR 보컬 제거를 위해 여러 오픈 소스 프로젝트를 사용합니다. 모든 개발자와 기여자에게 감사드립니다."
    package_title: "라이선스 문서 확인 위치"
    package_text: "압축을 푼 뒤 안쪽 Singing Stream Savior/Licenses 폴더에서 라이선스, 제3자 고지 및 제공되는 소스를 확인하세요. UVR 구성 요소에도 별도의 licenses 폴더가 있습니다. 정식 조건은 동봉 문서와 공식 원문을 따릅니다."
    uvr_title: "UVR, MDX 및 HP의 라이선스와 출처"
    uvr_text: "UVR MIT 라이선스, MDX/HP 모델의 출처와 개발자 표시, HP 실행 구성 요소 및 의존 라이브러리의 라이선스 문서가 포함됩니다."
    project: "프로젝트"
    purpose: "Singing Stream Savior에서의 용도"
    license: "라이선스 / 고지"
    source: "공식 출처"
    source_label: "프로젝트 사이트"
    closing: "이 페이지는 구성 요소와 용도를 확인하기 위한 요약이며 각 프로젝트의 전체 라이선스 문서를 대신하지 않습니다. 나열된 프로젝트나 기여자가 Singing Stream Savior를 보증한다는 뜻이 아닙니다."
    previous: "이전: 제작자 및 문의"


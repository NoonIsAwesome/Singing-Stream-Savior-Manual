ui:
  zh-TW:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "開源專案與授權"
    lead: "歌回救星使用了許多開源專案，才能完成音訊播放、裝置整合、歌詞轉換與 UVR 人聲消除。謝謝每一位開發者與貢獻者。"
    package_title: "授權文件在哪裡"
    package_text: "本頁是方便閱讀的摘要。解壓縮後，可在程式資料夾的 Licenses 查看隨附的授權文字、第三方聲明與原始碼；選用的 UVR runtime 也會保留自己的 licenses 資料夾。各專案條款仍以套件內文件與官方原文為準。"
    uvr_title: "2.1.1.1 已包含 UVR MIT 與模型來源聲明"
    uvr_text: "正式發布包包含 Ultimate-Vocal-Remover-MIT.txt 與 UVR-MDX-Models-NOTICE.txt；後者記錄兩個 MDX 模型的來源、開發者署名與適用的上游說明。"
    project: "專案"
    purpose: "在歌回救星中的用途"
    license: "授權／聲明"
    source: "官方來源"
    source_label: "專案網站"
    closing: "本頁只提供辨識元件用途的摘要，不取代各專案的完整授權文字。列出的開源專案不代表其作者或貢獻者為歌回救星背書。"
    previous: "上一頁：作者與聯絡"
  zh-CN:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "开源项目与许可"
    lead: "Singing Stream Savior 使用了许多开源项目，才得以完成音频播放、设备集成、歌词转换与 UVR 人声消除。感谢每一位开发者和贡献者。"
    package_title: "在哪里查看许可文件"
    package_text: "本页是便于阅读的摘要。解压后，可在程序文件夹的 Licenses 中查看随附的许可文本、第三方声明与源代码；可选的 UVR runtime 也会保留自己的 licenses 文件夹。各项目条款仍以软件包内文件与官方原文为准。"
    uvr_title: "2.1.1.1 已包含 UVR MIT 与模型来源声明"
    uvr_text: "正式发布包包含 Ultimate-Vocal-Remover-MIT.txt 与 UVR-MDX-Models-NOTICE.txt；后者记录两个 MDX 模型的来源、开发者署名与适用的上游说明。"
    project: "项目"
    purpose: "在 Singing Stream Savior 中的用途"
    license: "许可／声明"
    source: "官方来源"
    source_label: "项目网站"
    closing: "本页仅提供用于识别组件用途的摘要，不替代各项目的完整许可文本。列出的开源项目不代表其作者或贡献者为 Singing Stream Savior 背书。"
    previous: "上一页：作者与联系"
  en:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "Open-source projects and licenses"
    lead: "Singing Stream Savior builds on open-source projects for audio playback, device integration, lyric conversion, and UVR vocal removal. Thank you to every developer and contributor."
    package_title: "Where to find the license files"
    package_text: "This page is a readable summary. After extracting the package, open its Licenses folder for the license texts, third-party notices, and source code supplied with the app. The optional UVR runtime also keeps its own licenses folder. The packaged files and official upstream terms remain authoritative."
    uvr_title: "Version 2.1.1.1 includes the UVR MIT license and model provenance notice"
    uvr_text: "The public package contains Ultimate-Vocal-Remover-MIT.txt and UVR-MDX-Models-NOTICE.txt. The latter records the origin, developer credit, and applicable upstream statement for both MDX models."
    project: "Project"
    purpose: "How Singing Stream Savior uses it"
    license: "License / notice"
    source: "Official source"
    source_label: "Project site"
    closing: "This page identifies components and their roles; it does not replace their complete license texts. No listed project or contributor endorses Singing Stream Savior."
    previous: "Previous: Creator and support"
  ja:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "オープンソースプロジェクトとライセンス"
    lead: "Singing Stream Savior は、音声再生、デバイス連携、歌詞変換、UVR ボーカル除去のために多くのオープンソースプロジェクトを利用しています。すべての開発者と貢献者に感謝します。"
    package_title: "ライセンス文書の確認場所"
    package_text: "このページは読みやすい概要です。展開したアプリの Licenses フォルダーで、同梱されたライセンス文、第三者通知、ソースコードを確認できます。任意の UVR runtime にも専用の licenses フォルダーがあります。正式な条件は同梱ファイルと各公式原文を確認してください。"
    uvr_title: "2.1.1.1 には UVR の MIT ライセンスとモデル出所通知が含まれます"
    uvr_text: "公開パッケージには Ultimate-Vocal-Remover-MIT.txt と UVR-MDX-Models-NOTICE.txt が含まれます。後者には、2つの MDX モデルの入手元、開発者クレジット、適用される上流の説明を記録しています。"
    project: "プロジェクト"
    purpose: "Singing Stream Savior での用途"
    license: "ライセンス／通知"
    source: "公式ソース"
    source_label: "公式サイト"
    closing: "このページはコンポーネントと用途を確認するための概要であり、完全なライセンス文に代わるものではありません。掲載プロジェクトや貢献者が Singing Stream Savior を推奨していることを示すものではありません。"
    previous: "前のページ：制作者・お問い合わせ"
  ko:
    eyebrow: "OPEN SOURCE · LICENSES"
    title: "오픈 소스 프로젝트 및 라이선스"
    lead: "Singing Stream Savior는 오디오 재생, 장치 연동, 가사 변환과 UVR 보컬 제거를 위해 여러 오픈 소스 프로젝트를 사용합니다. 모든 개발자와 기여자에게 감사드립니다."
    package_title: "라이선스 문서 확인 위치"
    package_text: "이 페이지는 읽기 쉬운 요약입니다. 압축을 푼 앱의 Licenses 폴더에서 함께 제공된 라이선스 문서, 제3자 고지와 소스 코드를 확인할 수 있습니다. 선택형 UVR runtime에도 별도의 licenses 폴더가 있습니다. 정식 조건은 패키지 문서와 각 공식 원문을 따릅니다."
    uvr_title: "2.1.1.1에는 UVR MIT 라이선스와 모델 출처 고지가 포함됩니다"
    uvr_text: "공개 패키지에는 Ultimate-Vocal-Remover-MIT.txt와 UVR-MDX-Models-NOTICE.txt가 포함됩니다. 후자는 두 MDX 모델의 출처, 개발자 표시와 적용되는 업스트림 설명을 기록합니다."
    project: "프로젝트"
    purpose: "Singing Stream Savior에서의 용도"
    license: "라이선스 / 고지"
    source: "공식 출처"
    source_label: "프로젝트 사이트"
    closing: "이 페이지는 구성 요소와 용도를 확인하기 위한 요약이며 각 프로젝트의 전체 라이선스 문서를 대신하지 않습니다. 나열된 프로젝트나 기여자가 Singing Stream Savior를 보증한다는 뜻이 아닙니다."
    previous: "이전: 제작자 및 문의"


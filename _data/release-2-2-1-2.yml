release:
  version: "2.2.1.2"
  date: "2026-11-01"
  publishedAt: "2026-11-01T11:16:05Z"
  latest: false
  type:
    en: "Bubble Drift, multilingual fonts and playback controls"
    zh-TW: "新增 Bubble Drift、多語字型與播放控制"
    zh-CN: "新增 Bubble Drift、多语言字体与播放控制"
    ja: "Bubble Drift、多言語フォント、再生操作を更新"
    ko: "Bubble Drift, 다국어 글꼴 및 재생 조작 업데이트"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.2.1.2"
  summary:
    en: "Bubble Drift, multilingual fonts and playback controls."
    zh-TW: "新增 Bubble Drift、多語字型與播放控制。"
    zh-CN: "新增 Bubble Drift、多语言字体与播放控制。"
    ja: "Bubble Drift、多言語フォント、再生操作を更新。"
    ko: "Bubble Drift, 다국어 글꼴 및 재생 조작 업데이트."
  items:
    en:
      - "**The S3S user Discord is open.** Ask questions, report issues, request features, chat with other users and receive update news. [Join the Discord](https://discord.gg/3ST7NyCSrT)"
      - "Add Bubble Drift: a bubble for each title character, six emission positions, optional persistent display with nearby small bubbles, BGM Set List cycling and #01 numbering, plus fade, scatter and pop exits. Long titles use multiple pages."
      - "Choose Chinese, Latin, Japanese and Korean fonts for each supported theme and animated lyrics. Keep theme-specific/project settings and optionally let Set List follow Now Singing fonts. Theme settings use collapsible sections and show controls supported by the selected theme."
      - "Themes that support performer information can show the requester instead. Names appear in the Now Singing, queue or Set List regions supported by each theme, with requester and performer shown one at a time."
      - "Add a manual song-gain slider and sliders for pitch and speed in song playback settings. Player and song settings continue to share the same per-song values."
      - "Fix chat topics briefly appearing in Frequency Orbit while switching songs, and let Card keep showing Set List during BGM without chat-topic interference. Slightly inset the Orbit cover and glass background."
      - "Hide guide-vocal controls and track meters in general-player routing mode. Improve theme previews and update the Bubble Drift card with an aquarium backdrop."
      - "Improve VST3 plug-in stability around repeated song changes or reloading."
    zh-TW:
      - "**開放 S3S 使用者 Discord 群組。** 提供發問、問題回報、功能許願、交流與更新通知。[加入群組](https://discord.gg/3ST7NyCSrT)"
      - "新增 Bubble Drift 泡泡主題：每顆泡泡放一個字，提供六個噴出位置、持續顯示與附近的小泡泡、BGM 時輪播 Set List 和 #01 編號，以及淡出、彈散與破裂離場效果。長歌名可分頁顯示。"
      - "支援的主題與動態歌詞可分別設定中文、拉丁字母、日文及韓文字型。保留各主題與專案的設定，也可讓 Set List 字型跟隨 Now Singing。主題設定改為可收合區塊，依主題顯示適用的控制項。"
      - "原本支援顯示演出者的主題，可改為顯示點播者；依各主題支援的區域，顯示於演唱中、待播或已唱清單，並與演出者擇一顯示。"
      - "新增歌曲手動增益滑桿；歌曲播放設定中的音高與速度也可用滑桿調整，與播放器共用逐曲設定。"
      - "修正 Frequency Orbit 切歌時短暫顯示聊天話題，以及 Card 在 BGM 期間受到聊天話題干擾而隱藏 Set List 的問題。圓環的封面與玻璃底稍微內縮。"
      - "一般播放器路由模式隱藏導唱控制與各音軌 Meter。改善主題預覽，並以水族館背景更新 Bubble Drift 卡片。"
      - "改善部分 VST3 插件在反覆切歌或重新載入時的穩定性。"
    zh-CN:
      - "**开放 S3S 用户 Discord 群组。** 提供提问、问题反馈、功能许愿、交流与更新通知。[加入群组](https://discord.gg/3ST7NyCSrT)"
      - "新增 Bubble Drift 气泡主题：每颗气泡放一个字，提供六个喷出位置、持续显示与附近的小气泡、BGM 时轮播 Set List 和 #01 编号，以及淡出、弹散与破裂退场效果。长歌名可分页显示。"
      - "支持的主题与动态歌词可分别设置中文、拉丁字母、日文及韩文字体。保留各主题与项目的设置，也可让 Set List 字体跟随 Now Singing。主题设置改为可折叠区块，根据主题显示适用的控件。"
      - "原本支持显示演出者的主题，可改为显示点播者；根据各主题支持的区域，显示于演唱中、待播或已唱列表，并与演出者二选一显示。"
      - "新增歌曲手动增益滑块；歌曲播放设置中的音高与速度也可用滑块调整，与播放器共用逐曲设置。"
      - "修复 Frequency Orbit 切歌时短暂显示聊天话题，以及 Card 在 BGM 期间受到聊天话题干扰而隐藏 Set List 的问题。圆环的封面与玻璃底略微内缩。"
      - "普通播放器路由模式隐藏导唱控件与各音轨 Meter。改善主题预览，并以水族馆背景更新 Bubble Drift 卡片。"
      - "改善部分 VST3 插件在反复切歌或重新加载时的稳定性。"
    ja:
      - "**S3S ユーザー Discord を開設。** 質問、不具合報告、機能リクエスト、交流、更新情報の確認に利用できます。[Discord に参加](https://discord.gg/3ST7NyCSrT)"
      - "Bubble Drift を追加。タイトルを1文字ずつ泡に表示し、6方向の出現位置、周囲の小さな泡を伴う常時表示、BGM 中の Set List 切り替えと #01 番号、フェード・散開・破裂の退場効果を選べます。長いタイトルは複数ページで表示します。"
      - "対応テーマと動的歌詞で、中国語・ラテン文字・日本語・韓国語のフォントを個別設定できます。テーマ別・プロジェクト別の設定を保ち、Set List のフォントを Now Singing に連動できます。テーマ設定を折りたたみ式にし、対応する項目だけを表示します。"
      - "演者情報に対応したテーマでは、代わりにリクエストした視聴者名を表示できます。各テーマが対応する再生中・待機・歌唱済みの領域に、演者名かリクエスト者名のどちらかを表示します。"
      - "曲ごとの手動ゲインにスライダーを追加。曲の再生設定でもピッチと速度をスライダーで調整でき、プレイヤーと同じ曲別設定を使います。"
      - "Frequency Orbit の曲切り替え時にチャット話題が一瞬表示される問題と、Card の BGM 中に話題表示が Set List を隠す問題を修正。円形カバーとガラス背景を少し内側に配置します。"
      - "通常プレイヤーのルーティングではガイドボーカル操作とトラックメーターを非表示にします。テーマプレビューを改善し、Bubble Drift カードに水族館の背景を使います。"
      - "繰り返しの曲切り替えや再読み込み時の一部 VST3 プラグインの安定性を改善します。"
    ko:
      - "**S3S 사용자 Discord를 개설했습니다.** 질문, 문제 제보, 기능 요청, 사용자 교류와 업데이트 소식을 확인할 수 있습니다. [Discord 참여](https://discord.gg/3ST7NyCSrT)"
      - "Bubble Drift를 추가합니다. 제목의 각 글자를 거품에 표시하며, 여섯 시작 위치, 작은 거품을 동반한 계속 표시, BGM 중 Set List 순환과 #01 번호, 사라짐·흩어짐·터짐 효과를 선택할 수 있습니다. 긴 제목은 여러 페이지로 표시합니다."
      - "지원하는 테마와 동적 가사에 중국어·라틴 문자·일본어·한국어 글꼴을 각각 설정할 수 있습니다. 테마별·프로젝트별 설정을 유지하고 Set List가 Now Singing 글꼴을 따르게 할 수 있습니다. 테마 설정을 접을 수 있는 영역으로 바꾸고 지원하는 항목만 표시합니다."
      - "아티스트 정보를 지원하는 테마는 대신 신청자를 표시할 수 있습니다. 각 테마가 지원하는 현재 노래, 대기 또는 완료 목록 영역에 신청자와 아티스트 중 하나를 표시합니다."
      - "곡별 수동 게인 슬라이더를 추가합니다. 곡 재생 설정의 음정과 속도도 슬라이더로 조절하며 플레이어와 같은 곡별 설정을 공유합니다."
      - "Frequency Orbit의 곡 전환 중 대화 주제가 잠깐 나타나는 문제와 Card의 BGM 중 대화 주제가 Set List를 가리는 문제를 수정합니다. 원형 커버와 유리 배경을 조금 안쪽에 배치합니다."
      - "일반 플레이어 라우팅 모드에서는 가이드 보컬 조작과 트랙 미터를 숨깁니다. 테마 미리보기를 개선하고 Bubble Drift 카드에 수족관 배경을 적용합니다."
      - "반복적인 곡 전환이나 다시 불러오기 시 일부 VST3 플러그인의 안정성을 개선합니다."

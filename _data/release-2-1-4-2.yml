release:
  version: "2.1.4.2"
  date: "2026-09-13"
  latest: true
  type:
    en: "Theme, lyrics, and display improvements"
    zh-TW: "主題、歌詞與顯示改善"
    zh-CN: "主题、歌词与显示改善"
    ja: "テーマ、歌詞、表示の改善"
    ko: "테마, 가사 및 표시 개선"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.4.2"
  summary:
    en: "Fixes a persistent audio timing warning and adds a new theme, two lyric styles, and clearer one-way text motion."
    zh-TW: "修復持續顯示音訊時序警示的問題，並新增主題、兩款動態歌詞樣式與更清楚的單向文字捲動。"
    zh-CN: "修复持续显示音频时序警告的问题，并新增主题、两款动态歌词样式与更清晰的单向文字滚动。"
    ja: "オーディオタイミング警告が表示され続ける問題を修正し、新しいテーマ、2 種類の歌詞スタイル、読みやすい一方向スクロールを追加します。"
    ko: "오디오 타이밍 경고가 계속 표시되는 문제를 수정하고 새 테마, 두 가지 가사 스타일, 읽기 쉬운 단방향 스크롤을 추가합니다."
  items:
    en:
      - "Fixes an issue where audio routing could keep showing “Check audio timing”."
      - "Adds the new “Oblique Stream” theme with a minimal transparent design. Place it on the left or right, show Now Playing above or below, and enable timestamps and curved scrolling."
      - "Adds two animated lyrics styles: “Letter Spread” and “Stagger Signal”."
      - "Long song titles now scroll to the end, pause briefly, then restart from the beginning. Set list scrolling follows the same one-way reading flow."
      - "The former numbering button now cycles through “Off, 1., 01, ．” in themes that support numbering."
      - "Fixes update progress jumping when the launcher switches between downloading, verification, and installation."
      - "Had drinks with friends today! Happy!"
    zh-TW:
      - "修復音訊路由可能持續顯示「檢查音訊時序」的問題。"
      - "新增「Oblique Stream」主題，採用極簡透明設計。可選擇靠左或靠右、Now Playing 顯示於上方或下方，支援時間戳與弧線捲動。"
      - "新增「Letter Spread」與「Stagger Signal」兩款動態歌詞樣式。"
      - "長歌名跑馬燈統一改為捲動至尾端、稍作停頓後，再從開頭播放。歌單捲動同樣採單向閱讀。"
      - "原有編號按鈕改為循環切換「關閉、1.、01、．」，適用於原本支援編號的主題。"
      - "修復啟動器在下載、驗證與安裝階段切換時，更新進度顯示反覆跳動的問題。"
      - "今天和朋友去喝酒了！快樂！"
    zh-CN:
      - "修复音频路由可能持续显示“检查音频时序”的问题。"
      - "新增“Oblique Stream”主题，采用极简透明设计。可选择靠左或靠右、Now Playing 显示在上方或下方，并支持时间戳与弧线滚动。"
      - "新增“Letter Spread”和“Stagger Signal”两款动态歌词样式。"
      - "长歌名跑马灯统一改为滚动至末尾、稍作停顿后，再从开头播放。歌单滚动同样采用单向阅读。"
      - "原有编号按钮改为循环切换“关闭、1.、01、．”，适用于原本支持编号的主题。"
      - "修复启动器在下载、验证与安装阶段切换时，更新进度显示反复跳动的问题。"
      - "今天和朋友去喝酒了！开心！"
    ja:
      - "オーディオルーティングで「オーディオタイミングを確認」が表示され続けることがある問題を修正します。"
      - "ミニマルで透明感のある新しい「Oblique Stream」テーマを追加します。左右配置、Now Playing の上下配置、タイムスタンプ、曲線に沿ったスクロールに対応します。"
      - "動く歌詞スタイル「Letter Spread」と「Stagger Signal」を追加します。"
      - "長い曲名のマーキーは末尾までスクロールして少し停止した後、先頭から再生する動きに統一します。曲リストも同じ一方向の読み進め方になります。"
      - "既存の番号ボタンは「オフ、1.、01、．」を順に切り替える方式になり、番号表示に対応するテーマで利用できます。"
      - "ランチャーがダウンロード、検証、インストールの各段階へ移る際に、更新の進捗表示が前後する問題を修正します。"
      - "今日は友達と飲みに行きました！楽しかった！"
    ko:
      - "오디오 라우팅에서 “오디오 타이밍 확인”이 계속 표시될 수 있는 문제를 수정합니다."
      - "미니멀한 투명 디자인의 새 “Oblique Stream” 테마를 추가합니다. 왼쪽 또는 오른쪽에 배치하고 Now Playing을 위나 아래에 표시할 수 있으며 타임스탬프와 곡선 스크롤을 지원합니다."
      - "“Letter Spread”와 “Stagger Signal” 동적 가사 스타일을 추가합니다."
      - "긴 곡 제목은 끝까지 스크롤한 뒤 잠시 멈추고 처음부터 다시 재생하도록 통일합니다. 곡 목록도 같은 단방향 읽기 흐름을 사용합니다."
      - "기존 번호 버튼은 “끄기, 1., 01, ．” 순서로 전환되며 원래 번호 표시를 지원하는 테마에 적용됩니다."
      - "런처가 다운로드, 검증, 설치 단계로 전환할 때 업데이트 진행률 표시가 불규칙하게 바뀌는 문제를 수정합니다."
      - "오늘 친구들과 술 마시러 갔어요! 즐거웠어요!"

  emphasizedItems:
    en:
      - "Fixes an issue where audio routing could keep showing “Check audio timing”."
    zh-TW:
      - "修復音訊路由可能持續顯示「檢查音訊時序」的問題。"
    zh-CN:
      - "修复音频路由可能持续显示“检查音频时序”的问题。"
    ja:
      - "オーディオルーティングで「オーディオタイミングを確認」が表示され続けることがある問題を修正します。"
    ko:
      - "오디오 라우팅에서 “오디오 타이밍 확인”이 계속 표시될 수 있는 문제를 수정합니다."

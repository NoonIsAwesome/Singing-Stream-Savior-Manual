release:
  version: "2.2.0.1"
  date: "2026-10-25"
  publishedAt: "2026-10-25T00:49:49Z"
  latest: true
  type:
    en: "Playback and project-opening fixes"
    zh-TW: "播放與專案開啟修正"
    zh-CN: "播放与项目打开修复"
    ja: "再生・プロジェクト読み込みの修正"
    ko: "재생 및 프로젝트 열기 수정"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.2.0.1"
  summary:
    en: "Reserve playback fixes and clearer connection and keyboard-focus states."
    zh-TW: "修正待播播放完成機制，改善連線狀態與分頁焦點顯示。"
    zh-CN: "修复待播播放完成机制，改善连接状态与分页焦点显示。"
    ja: "再生待ちリストの再生完了処理と、接続・フォーカス表示を修正しました。"
    ko: "대기열 재생 완료 처리와 연결 및 탭 포커스 표시를 수정했습니다."
  items:
    en:
      - "Join the S3S Discord community for questions, bug reports, feature requests, discussion and software update announcements: [Join the S3S Discord community](https://discord.gg/3ST7NyCSrT)"
      - "Fix a missed natural-playback completion notification and prevent accepted audience requests from being duplicated when Reserve is reordered, removed or cleared."
      - "Approved streamer accounts now show a connecting screen while reconnecting, instead of an application-pending screen."
      - "Prevent pointer-opened tabs from retaining an unintended focus frame while keeping keyboard navigation and focus indicators."
      - "Reduce repeated work when reordering or removing Reserve songs and stopping playback."
      - "Center the song-search clear icon and add a clear button to YouTube search."
      - "Preserve the paused position when cancelling Resume, reject stale or not-ready seek gestures, and guard shutdown status callbacks."
      - "Improve responsiveness when opening projects with many songs or Reserve entries, while preserving song metadata and project summaries."
    zh-TW:
      - "新增 S3S 使用者 Discord 群組，提供問答、問題回報、功能許願與交流討論，也會發布軟體更新通知：[加入 S3S 使用者 Discord 群組](https://discord.gg/3ST7NyCSrT)"
      - "修正歌曲自然播畢通知可能遺失的情況，並避免觀眾點歌在待播重排、移除或清空時重複補回。"
      - "已開通的主播帳號重新連線時，改為顯示連線中畫面，避免短暫顯示申請等待畫面。"
      - "修正滑鼠開啟分頁後可能殘留的焦點外框，保留鍵盤切換與焦點提示。"
      - "減少待播排序、刪除與停止播放時的重複更新，改善操作延遲。"
      - "調整歌曲搜尋清除圖示的置中位置，並為 YouTube 搜尋加入清除按鈕。"
      - "修正取消續播時可能失去暫停位置的問題，避免切歌或載入時誤用 Seek，並補強關閉程式時的訊息回呼防線。"
      - "改善歌曲較多或待播項目較多時的專案開啟效能，保留歌曲資料與專案摘要。"
    zh-CN:
      - "新增 S3S 用户 Discord 群组，提供问答、问题反馈、功能许愿与交流讨论，也会发布软件更新通知：[加入 S3S 用户 Discord 群组](https://discord.gg/3ST7NyCSrT)"
      - "修复歌曲自然播放结束通知可能丢失的情况，并避免观众点歌在待播重排、移除或清空时重复补回。"
      - "已开通的主播账号重新连接时，改为显示连接中画面，避免短暂显示申请等待画面。"
      - "修复鼠标打开分页后可能残留的焦点外框，保留键盘切换与焦点提示。"
      - "减少待播排序、删除与停止播放时的重复更新，改善操作延迟。"
      - "调整歌曲搜索清除图标的居中位置，并为 YouTube 搜索加入清除按钮。"
      - "修复取消续播时可能丢失暂停位置的问题，避免切歌或加载时误用 Seek，并加强关闭程序时的消息回调防护。"
      - "改善歌曲较多或待播项目较多时的项目打开性能，保留歌曲资料与项目摘要。"
    ja:
      - "質問、不具合報告、機能リクエスト、交流、ソフトウェア更新のお知らせを共有する S3S Discord コミュニティを開設しました：[S3S Discord コミュニティに参加](https://discord.gg/3ST7NyCSrT)"
      - "曲の自然終了通知が失われる場合を修正し、再生待ちリストの並べ替え・削除・全削除で視聴者リクエストが重複して復元される問題を防ぎました。"
      - "承認済みの配信者アカウントは、再接続中に申請待ち画面ではなく接続中の画面を表示します。"
      - "マウスでタブを開いた後に不要なフォーカス枠が残る問題を修正しました。キーボード操作とフォーカス表示は維持します。"
      - "待機リストの並べ替え・削除と再生停止時の重複処理を減らし、操作の応答性を改善しました。"
      - "楽曲検索のクリアアイコンを中央に揃え、YouTube 検索にもクリアボタンを追加しました。"
      - "再開のキャンセル時に一時停止位置を保持し、曲の切り替え・読み込み中の不正なシークと終了時の状態通知を防ぐ処理を追加しました。"
      - "曲数や再生待ちの項目が多いプロジェクトを開く際の応答性を改善し、楽曲情報とプロジェクトの概要を保持します。"
    ko:
      - "질문, 오류 제보, 기능 요청, 토론 및 소프트웨어 업데이트 소식을 위한 S3S Discord 커뮤니티를 개설했습니다: [S3S Discord 커뮤니티 참여](https://discord.gg/3ST7NyCSrT)"
      - "곡의 자연 종료 알림이 누락되는 경우를 수정하고, 대기열 순서 변경·삭제·전체 삭제 시 승인된 시청자 신청곡이 중복 복구되는 문제를 방지했습니다."
      - "승인된 방송자 계정은 재연결 중에 신청 대기 화면 대신 연결 중 화면을 표시합니다."
      - "마우스로 탭을 연 뒤 불필요한 포커스 테두리가 남는 문제를 수정하고 키보드 탐색 및 포커스 표시는 유지했습니다."
      - "대기열 순서 변경·삭제 및 재생 중지 시 중복 처리를 줄여 조작 지연을 개선했습니다."
      - "곡 검색 지우기 아이콘을 가운데 정렬하고 YouTube 검색에도 지우기 버튼을 추가했습니다."
      - "재개 취소 시 일시 정지 위치를 유지하고, 곡 전환·로딩 중 잘못된 탐색 및 종료 중 상태 콜백을 방지했습니다."
      - "곡이나 대기 항목이 많은 프로젝트를 열 때 응답성을 개선하고 곡 정보와 프로젝트 요약을 유지합니다."

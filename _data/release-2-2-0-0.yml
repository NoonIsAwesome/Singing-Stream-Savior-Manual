release:
  version: "2.2.0.0"
  date: "2026-10-24"
  publishedAt: "2026-10-24T04:30:48Z"
  latest: false
  type:
    en: "Audience song requests"
    zh-TW: "觀眾點歌"
    zh-CN: "观众点歌"
    ja: "視聴者リクエスト"
    ko: "시청자 신청곡"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.2.0.0"
  summary:
    en: "Free audience song requests, available after streamer approval."
    zh-TW: "新增免費觀眾點歌：主播申請開通後，即可公開歌單並審核點歌。"
    zh-CN: "新增免费观众点歌：主播申请开通后，即可公开歌单并审核点歌。"
    ja: "無料の視聴者リクエストを追加。配信者は承認後に曲リストを公開し、リクエストを確認できます。"
    ko: "무료 시청자 신청곡을 추가했습니다. 방송자 승인 후 곡 목록 공개와 신청곡 검토를 이용할 수 있습니다."
  items:
    en:
      - "Open your private Studio to view Session history. Keep the same streamer identity across projects and save an encrypted identity backup."
      - "Automatically renew the sign-in session during long streams and reconnect after an outage, with clear maintenance and account-status messages."
      - "Lyrics editing adds Alt+Q to mark timing, Alt+R to overwrite timing, Undo/Redo, and a step-by-step guide."
      - "Rename a song in Reserve with the pencil button, context menu, or F2; the name is saved with the project."
      - "Downloaded lyrics use the artist and song title in their filenames so they are easier to find."
      - "Notifications appear at the lower left, support manual dismissal, and fade out automatically. Native scrollbars use a consistent rounded style."
      - "The Launcher keeps Stable selected by default and offers an optional Beta channel, with clearer summaries and a more compact version history."
    zh-TW:
      - "可開啟專屬主播後台查看場次紀錄；主播身分可跨專案沿用，並支援加密備份。"
      - "長時間開播時自動更新登入狀態，斷線後自動重新連線；伺服器維護與帳號狀態有對應提示。"
      - "歌詞編輯新增 Alt+Q 時間標記、Alt+R 覆寫重標、還原／重作，以及逐步操作導覽。"
      - "待播清單可透過鉛筆按鈕、右鍵選單或 F2 修改歌名，並隨專案保存。"
      - "自動下載的歌詞檔以歌手及歌名命名，方便查找。"
      - "操作通知改為左下角顯示，可手動關閉並自動淡出；介面統一採用圓角捲軸。"
      - "啟動器預設維持正式版通道，可自行選擇 Beta 測試版；改善跨版本更新摘要與項目排列。"
    zh-CN:
      - "可打开专属主播后台查看场次记录；主播身份可跨项目沿用，并支持加密备份。"
      - "长时间直播时自动更新登录状态，断线后自动重新连接；服务器维护与账号状态有对应提示。"
      - "歌词编辑新增 Alt+Q 时间标记、Alt+R 覆写重标、撤销／重做，以及逐步操作引导。"
      - "待播列表可通过铅笔按钮、右键菜单或 F2 修改歌名，并随项目保存。"
      - "自动下载的歌词文件以歌手及歌名命名，方便查找。"
      - "操作通知改为左下角显示，可手动关闭并自动淡出；界面统一采用圆角滚动条。"
      - "启动器默认保持正式版通道，可自行选择 Beta 测试版；改善跨版本更新摘要与项目排列。"
    ja:
      - "専用Studioで配信履歴を確認できます。配信者IDはプロジェクト間で引き継がれ、暗号化バックアップに対応します。"
      - "長時間の配信中はログイン状態を自動更新し、切断後は再接続します。メンテナンスやアカウントの状態も画面で案内します。"
      - "歌詞編集にAlt+Qのタイミング記録、Alt+Rの上書き記録、元に戻す／やり直し、手順に沿ったガイドを追加しました。"
      - "再生待ちの曲名を鉛筆ボタン、右クリックメニュー、F2で変更でき、プロジェクトに保存されます。"
      - "ダウンロードした歌詞のファイル名にアーティスト名と曲名を含め、探しやすくしました。"
      - "通知を左下に表示し、手動で閉じるか自動でフェードアウトします。標準スクロールバーを角丸のデザインに統一しました。"
      - "ランチャーの既定は正式版のまま、任意でBetaを選択できます。複数バージョンの更新概要と履歴の配置も改善しました。"
    ko:
      - "전용 Studio에서 방송 기록을 확인할 수 있습니다. 방송자 ID는 프로젝트 간에 유지되며 암호화 백업을 지원합니다."
      - "장시간 방송 중 로그인 상태를 자동 갱신하고 연결이 끊긴 뒤 다시 연결합니다. 서버 점검과 계정 상태도 화면에 안내합니다."
      - "가사 편집에 Alt+Q 시간 표시, Alt+R 덮어쓰기 재표시, 실행 취소／다시 실행, 단계별 안내를 추가했습니다."
      - "대기열의 곡 이름을 연필 버튼, 우클릭 메뉴 또는 F2로 변경하고 프로젝트에 저장할 수 있습니다."
      - "다운로드한 가사 파일 이름에 가수와 곡 제목을 포함하여 쉽게 찾을 수 있습니다."
      - "알림을 왼쪽 아래에 표시하며 직접 닫거나 자동으로 사라집니다. 기본 스크롤바를 둥근 모양으로 통일했습니다."
      - "런처는 기본으로 정식 채널을 유지하며 원하는 경우 Beta를 선택할 수 있습니다. 여러 버전의 업데이트 요약과 기록 배치도 개선했습니다."

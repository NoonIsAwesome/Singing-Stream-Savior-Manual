release:
  version: "2.1.5.4"
  date: "2026-09-20"
  latest: true
  type:
    en: "Stability update"
    zh-TW: "穩定性更新"
    zh-CN: "稳定性更新"
    ja: "安定性アップデート"
    ko: "안정성 업데이트"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.5.4"
  summary:
    en: "Stability update"
    zh-TW: "穩定性更新"
    zh-CN: "稳定性更新"
    ja: "安定性アップデート"
    ko: "안정성 업데이트"
  items:
    en:
      - "Improves brief BGM dropouts."
      - "Improves occasional delayed response when stopping accompaniment."
      - "Fixes how Vocal Profiles are applied in player modes."
      - "Improves VST3 stability."
      - "Fixes an issue where preview could stop unexpectedly or Profile switching could fail after latency adjustments to some VST3 plug-ins."
      - "Improves effect preloading performance and fixes an issue where a Profile containing disabled effects could open the wrong effect editor."
      - "Fixes an issue where a failed VST3 replacement, removal, or enable operation could still save the wrong selection or checkbox state."
      - "Improves project media collection."
      - "Improves UVR vocal separation."
      - "Improves recording save and finalization."
      - "Improves YouTube feature stability."
      - "I'm going to see Hans Zimmer in concert today! Can't wait to soak up Guthrie Govan's solos!"
    zh-TW:
      - "改善 BGM 短暫斷音問題。"
      - "改善偶發性伴奏停止反應問題。"
      - "修正播放器模式與人聲 Profile 套用機制。"
      - "改善 VST3 穩定性。"
      - "修正部分 VST3 調整延遲後，預聽意外停止或 Profile 切換失敗的問題。"
      - "改善效果器預載入的效能，修正 Profile 停用效果器時，可能開啟錯誤效果器介面的問題。"
      - "修正 VST3 更換、移除或啟用操作未成功時，仍儲存錯誤選擇或勾選狀態的問題。"
      - "改善專案媒體收集機制。"
      - "改善 UVR 人聲分離機制。"
      - "改善錄音保存與收尾機制。"
      - "改善 YouTube 功能穩定性。"
      - "我今天要去看Hans Zimmer音樂會！還要看爆Guthrie Govan的solo！"
    zh-CN:
      - "改善 BGM 短暂断音问题。"
      - "改善偶发的伴奏停止响应问题。"
      - "修复播放器模式与人声 Profile 的应用机制。"
      - "改善 VST3 稳定性。"
      - "修复部分 VST3 调整延迟后，预听意外停止或 Profile 切换失败的问题。"
      - "改善效果器预加载性能，修复 Profile 停用效果器时可能打开错误效果器界面的问题。"
      - "修复 VST3 更换、移除或启用操作未成功时，仍保存错误选择或勾选状态的问题。"
      - "改善项目媒体收集机制。"
      - "改善 UVR 人声分离机制。"
      - "改善录音保存与收尾机制。"
      - "改善 YouTube 功能稳定性。"
      - "我今天要去看 Hans Zimmer 音乐会！还要看爆 Guthrie Govan 的 solo！"
    ja:
      - "BGM の一時的な音切れを改善しました。"
      - "伴奏を停止したときに、まれに反応が遅れる問題を改善しました。"
      - "プレーヤーモードとボーカル Profile の適用処理を修正しました。"
      - "VST3 の安定性を改善しました。"
      - "一部の VST3 でレイテンシーを調整した後、プレビューが予期せず停止したり、Profile の切り替えに失敗したりする問題を修正しました。"
      - "エフェクトのプリロード性能を改善し、Profile でエフェクトを無効にした際に誤ったエフェクト画面が開くことがある問題を修正しました。"
      - "VST3 の交換、削除、または有効化に失敗しても、誤った選択やチェック状態が保存される問題を修正しました。"
      - "プロジェクトメディアの収集処理を改善しました。"
      - "UVR のボーカル分離処理を改善しました。"
      - "録音の保存と終了処理を改善しました。"
      - "YouTube 機能の安定性を改善しました。"
      - "今日は Hans Zimmer のコンサートに行きます！Guthrie Govan のソロも堪能します！"
    ko:
      - "BGM의 일시적인 끊김 문제를 개선했습니다."
      - "간헐적으로 반주 정지에 대한 반응이 늦는 문제를 개선했습니다."
      - "플레이어 모드와 보컬 Profile 적용 방식을 수정했습니다."
      - "VST3 안정성을 개선했습니다."
      - "일부 VST3의 지연 시간을 조정한 후 미리듣기가 갑자기 중지되거나 Profile 전환에 실패하는 문제를 수정했습니다."
      - "이펙터 프리로딩 성능을 개선하고, Profile에서 이펙터를 비활성화할 때 잘못된 이펙터 편집기 화면이 열릴 수 있는 문제를 수정했습니다."
      - "VST3 교체, 제거 또는 활성화 작업이 실패해도 잘못된 선택이나 체크 상태가 저장되는 문제를 수정했습니다."
      - "프로젝트 미디어 수집 기능을 개선했습니다."
      - "UVR 보컬 분리 기능을 개선했습니다."
      - "녹음 저장 및 마무리 기능을 개선했습니다."
      - "YouTube 기능 안정성을 개선했습니다."
      - "오늘 Hans Zimmer 콘서트에 갑니다! Guthrie Govan의 솔로도 제대로 즐길 거예요!"

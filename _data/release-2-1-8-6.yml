release:
  version: "2.1.8.6"
  date: "2026-10-11"
  latest: true
  type:
    en: "Added batch tag editing, custom project tag deletion, and Modern Karaoke. Updated project selection."
    zh-TW: "新增歌曲標籤批次編輯、專案自訂標籤刪除及 Modern Karaoke，並更新專案選擇頁面。"
    zh-CN: "新增歌曲标签批量编辑、项目自定义标签删除及 Modern Karaoke，并更新项目选择页面。"
    ja: "曲タグの一括編集、プロジェクトのカスタムタグの削除、Modern Karaoke を追加し、プロジェクト選択画面を更新しました。"
    ko: "곡 태그 일괄 편집, 프로젝트 사용자 지정 태그 삭제와 Modern Karaoke를 추가하고 프로젝트 선택 화면을 개선했습니다."
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.8.6"
  summary:
    en: "Added batch tag editing, custom project tag deletion, and Modern Karaoke. Updated project selection."
    zh-TW: "新增歌曲標籤批次編輯、專案自訂標籤刪除及 Modern Karaoke，並更新專案選擇頁面。"
    zh-CN: "新增歌曲标签批量编辑、项目自定义标签删除及 Modern Karaoke，并更新项目选择页面。"
    ja: "曲タグの一括編集、プロジェクトのカスタムタグの削除、Modern Karaoke を追加し、プロジェクト選択画面を更新しました。"
    ko: "곡 태그 일괄 편집, 프로젝트 사용자 지정 태그 삭제와 Modern Karaoke를 추가하고 프로젝트 선택 화면을 개선했습니다."
  items:
    en:
      - "Added batch editing for performer, genre, and language tags. Use the song context menu to make multiple edits without reopening it."
      - "Added deletion of custom project tags. After confirmation and saving song settings, the tag is removed from every song using it in the current project."
      - "Added Modern Karaoke, a single-line lyric style with word-by-word fill from soft gray to warm white. Adjust the font, sung and unsung text colors, outline, position, and size."
      - "Updated project selection: preview song counts, playlists, performers, and genres, and search projects. Built-in genre tags follow the interface language and wrap; playlists and performers use two columns, or one in narrow windows."
    zh-TW:
      - "新增演出者、曲風及語言標籤的批次編輯，可透過歌曲右鍵選單連續設定。"
      - "新增刪除專案自訂標籤功能，確認並儲存後會從本專案所有使用歌曲移除。"
      - "新增 Modern Karaoke：單行歌詞由柔灰逐字填成暖白，可調整字型、已唱與未唱文字色、描邊及位置大小。"
      - "更新專案選擇頁，可預覽歌曲數、歌單、演出者與曲風並快速搜尋；內建曲風依介面語言顯示，標籤會自動換行，歌單及演出者清單依空間切換雙欄或單欄。"
    zh-CN:
      - "新增演出者、曲风及语言标签的批量编辑，可通过歌曲右键菜单连续设置。"
      - "新增删除项目自定义标签功能，确认并保存后会从本项目所有使用该标签的歌曲中移除。"
      - "新增 Modern Karaoke：单行歌词从柔灰逐字填成暖白，可调整字体、已唱与未唱文字颜色、描边及位置大小。"
      - "更新项目选择页面，可预览歌曲数、歌单、演出者与曲风并快速搜索；内置曲风按界面语言显示，标签自动换行，歌单及演出者列表随空间切换双列或单列。"
    ja:
      - "歌手・演奏者、ジャンル、言語のタグを一括編集できるようになりました。曲の右クリックメニューを開いたまま、続けて設定できます。"
      - "プロジェクトのカスタムタグを削除できるようになりました。確認して曲設定を保存すると、現在のプロジェクト内でそのタグを使用しているすべての曲から削除されます。"
      - "Modern Karaoke を追加しました。歌唱に合わせて、1 行の歌詞が文字ごとに柔らかなグレーから温かみのある白へ変わります。フォント、歌唱済み・未歌唱の文字色、縁取り、位置とサイズを調整できます。"
      - "プロジェクト選択画面を更新しました。曲数、プレイリスト、アーティスト、ジャンルを確認して検索できます。標準ジャンルは表示言語に合わせて表示され、タグは折り返されます。プレイリストとアーティストは 2 列、狭い画面では 1 列で表示します。"
    ko:
      - "가수·연주자, 장르, 언어 태그를 일괄 편집할 수 있습니다. 곡의 마우스 오른쪽 버튼 메뉴를 열린 상태로 유지하면서 연속으로 설정할 수 있습니다."
      - "프로젝트의 사용자 지정 태그를 삭제할 수 있습니다. 확인 후 곡 설정을 저장하면 현재 프로젝트에서 해당 태그를 사용하는 모든 곡에서 제거됩니다."
      - "Modern Karaoke를 추가했습니다. 한 줄 가사가 노래 진행에 따라 부드러운 회색에서 따뜻한 흰색으로 글자별로 채워집니다. 글꼴, 부른 부분과 아직 부르지 않은 부분의 글자 색, 외곽선, 위치와 크기를 조절할 수 있습니다."
      - "프로젝트 선택 화면을 개선했습니다. 곡 수, 재생 목록, 아티스트와 장르를 미리 확인하고 프로젝트를 검색할 수 있습니다. 기본 장르 태그는 인터페이스 언어로 표시되고 자동 줄바꿈되며, 재생 목록과 아티스트는 두 열로, 좁은 화면에서는 한 열로 표시됩니다."

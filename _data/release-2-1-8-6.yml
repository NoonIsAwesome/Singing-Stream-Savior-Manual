release:
  version: "2.1.8.6"
  date: "2026-10-11"
  latest: true
  type:
    en: "Added batch tag editing, custom project tag deletion, and Modern Karaoke. Updated project selection."
    zh-TW: "新增歌曲標籤批次編輯、專案自訂標籤刪除及 Modern Karaoke，並更新專案選擇頁面。"
    zh-CN: "新增歌曲标签批量编辑、项目自定义标签删除及 Modern Karaoke，并更新项目选择页面。"
    ja: "曲タグの一括編集、プロジェクトのカスタムタグの削除、Modern Karaoke を追加し、プロジェクト選択画面を更新しました。"
    ko: "곡 태그 일괄 편집, 프로젝트 사용자 지정 태그 삭제와 Modern Karaoke를 추가하고 프로젝트 선택 화면을 개선했습니다."
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.8.6"
  summary:
    en: "Added batch song tags, richer project previews, Modern Karaoke animated lyrics, and custom project tag deletion."
    zh-TW: "新增歌曲標籤批次設定、專案內容預覽與 Modern Karaoke 動態鴿子，並支援刪除專案自訂標籤。"
    zh-CN: "新增歌曲标签批量设置、项目内容预览与 Modern Karaoke 动态歌词，并支持删除项目自定义标签。"
    ja: "曲タグの一括設定、プロジェクト内容のプレビュー、Modern Karaoke の歌詞アニメーション、カスタムタグの削除に対応しました。"
    ko: "곡 태그 일괄 설정, 프로젝트 내용 미리보기, Modern Karaoke 가사 애니메이션과 사용자 지정 태그 삭제를 추가했습니다."
  items:
    en:
      - "Select multiple songs at once to add performer, genre, or language tags."
      - "Improved the project screen with details such as playlists, performers, and genres."
      - "Added Modern Karaoke animated lyrics."
      - "Delete custom tags from the current project. Confirm and save song settings to remove the tag from every song using it."
    zh-TW:
      - "現在可一次選取多首歌曲，加入演出者、曲風或語言標籤。"
      - "改善專案畫面，可查看歌單、演出者、曲風等詳情。"
      - "新增 Modern Karaoke 動態鴿子。"
      - "可從本專案刪除自訂標籤；確認並儲存歌曲設定後，會從所有使用此標籤的歌曲移除。"
    zh-CN:
      - "现在可一次选中多首歌曲，添加演出者、曲风或语言标签。"
      - "改善项目页面，可查看歌单、演出者、曲风等详情。"
      - "新增 Modern Karaoke 动态歌词。"
      - "可从当前项目删除自定义标签；确认并保存歌曲设置后，会从所有使用该标签的歌曲中移除。"
    ja:
      - "複数の曲をまとめて選択し、歌手・演奏者、ジャンル、言語のタグを追加できます。"
      - "プロジェクト画面を改善し、プレイリスト、アーティスト、ジャンルなどの詳細を確認できるようになりました。"
      - "Modern Karaoke の歌詞アニメーションを追加しました。"
      - "現在のプロジェクトからカスタムタグを削除できます。確認して曲設定を保存すると、そのタグを使うすべての曲から削除されます。"
    ko:
      - "여러 곡을 한 번에 선택하여 가수·연주자, 장르 또는 언어 태그를 추가할 수 있습니다."
      - "프로젝트 화면을 개선하여 재생 목록, 아티스트, 장르 등의 세부 정보를 확인할 수 있습니다."
      - "Modern Karaoke 가사 애니메이션을 추가했습니다."
      - "현재 프로젝트의 사용자 지정 태그를 삭제할 수 있습니다. 확인 후 곡 설정을 저장하면 해당 태그를 사용하는 모든 곡에서 제거됩니다."

release:
  version: "2.2.1.3"
  date: "2026-11-03"
  latest: true
  type:
    en: "Clearer BGM visualization and theme settings, with Bubble Drift and audio-output fixes"
    zh-TW: "改善 BGM 訊號與主題設定，修正泡泡排版及音訊輸出"
    zh-CN: "改善 BGM 信号与主题设置，修复气泡排版及音频输出"
    ja: "BGM の可視化とテーマ設定を改善し、バブル配置と音声出力を修正"
    ko: "BGM 시각화와 테마 설정을 개선하고 버블 배치 및 오디오 출력을 수정했습니다"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.2.1.3"
  summary:
    en: "Clearer BGM visualization and theme settings, with Bubble Drift and audio-output fixes."
    zh-TW: "改善 BGM 訊號與主題設定，修正泡泡排版及音訊輸出。"
    zh-CN: "改善 BGM 信号与主题设置，修复气泡排版及音频输出。"
    ja: "BGM の可視化とテーマ設定を改善し、バブル配置と音声出力を修正。"
    ko: "BGM 시각화와 테마 설정을 개선하고 버블 배치 및 오디오 출력을 수정했습니다."
  items:
    en:
      - "**The S3S user Discord is open.** Ask questions, report issues, request features, chat with other users and receive update news. [Join the Discord](https://discord.gg/3ST7NyCSrT)"
      - "Fix weak or missing BGM visualization in Signal Veil, Signal Tide and Frequency Orbit when the microphone is silent. Improve the display of quiet BGM without changing playback volume."
      - "Fix Bubble Drift display-area bounds and keep ordinary English words such as Photograph together when they fit. Long titles can still use multiple rows or pages."
      - "Unify theme and animated-lyrics color controls. Make supported Set List and queue numbering styles easier to select, and hide scrolling-speed controls where they do not apply."
      - "Update Card and CD thumbnails to match their centered song titles. Card automatically manages Set List scrolling speed."
      - "Prevent invalid audio samples from reaching direct audio output and allow normal audio to recover."
      - "Keep the UVR queue at the current song when retrying, changing output settings, importing results or removing completed rows."
      - "Improve batched YouTube metadata lookup: one timed-out song no longer fails untouched queued songs, and removing songs cancels lookups that are no longer needed."
    zh-TW:
      - "**開放 S3S 使用者 Discord 群組。** 提供發問、問題回報、功能許願、交流與更新通知。[加入群組](https://discord.gg/3ST7NyCSrT)"
      - "修正麥克風安靜時，Signal Veil、Signal Tide 與 Frequency Orbit 的 BGM 動態不明顯或未顯示。改善低音量 BGM 的視覺訊號，不改變實際播放音量。"
      - "修正 Bubble Drift 的歌單顯示區域；像 Photograph 這類可容納的英文單字會盡量保持完整，長歌名仍可分行或分頁顯示。"
      - "統一主題與動態歌詞的色彩控制項；支援的已唱與待播清單可直接選擇編號樣式，並隱藏不適用的捲動速度選項。"
      - "更新 Card 與 CD 縮圖，對應置中的演唱歌名；Card 的 Set List 捲動速度由主題自動處理。"
      - "攔截直接音訊輸出中的異常取樣值，避免傳到輸出裝置，並讓後續正常音訊恢復。"
      - "UVR 重試、調整輸出設定、匯入結果或清除已完成歌曲時，保留目前瀏覽的歌曲與捲動位置。"
      - "改善批次加入 YouTube 歌曲的資訊解析：單首逾時不再連帶判定尚未解析的歌曲失敗；移除歌曲也會取消不再需要的解析工作。"
    zh-CN:
      - "**开放 S3S 用户 Discord 群组。** 提供提问、问题反馈、功能许愿、交流与更新通知。[加入群组](https://discord.gg/3ST7NyCSrT)"
      - "修复麦克风安静时，Signal Veil、Signal Tide 与 Frequency Orbit 的 BGM 动态不明显或未显示。改善低音量 BGM 的视觉信号，不改变实际播放音量。"
      - "修复 Bubble Drift 的歌单显示区域；像 Photograph 这类可容纳的英文单词会尽量保持完整，长歌名仍可分行或分页显示。"
      - "统一主题与动态歌词的颜色控件；支持的已唱与待播列表可直接选择编号样式，并隐藏不适用的滚动速度选项。"
      - "更新 Card 与 CD 缩略图，对应居中的演唱歌名；Card 的 Set List 滚动速度由主题自动处理。"
      - "拦截直接音频输出中的异常采样值，避免传到输出设备，并让后续正常音频恢复。"
      - "UVR 重试、调整输出设置、导入结果或清除已完成歌曲时，保留当前浏览的歌曲与滚动位置。"
      - "改善批量添加 YouTube 歌曲的信息解析：单首超时不再连带判定尚未解析的歌曲失败；移除歌曲也会取消不再需要的解析任务。"
    ja:
      - "**S3S ユーザー Discord を開設。** 質問、不具合報告、機能リクエスト、交流、更新情報の確認に利用できます。[Discord に参加](https://discord.gg/3ST7NyCSrT)"
      - "マイクが無音のとき、Signal Veil、Signal Tide、Frequency Orbit の BGM 表示が弱くなる、または消える問題を修正。実際の再生音量を変えず、小音量の BGM を見やすくします。"
      - "Bubble Drift の表示領域を修正。Photograph など、収まる英単語はできるだけ分割せず表示します。長い曲名は引き続き改行やページ切り替えに対応します。"
      - "テーマと動的歌詞の色設定を統一。対応する Set List と待機リストの番号スタイルを直接選択でき、非対応のスクロール速度設定は非表示になります。"
      - "Card と CD のサムネイルを中央揃えの曲名に合わせて更新。Card の Set List スクロール速度はテーマが自動管理します。"
      - "直接音声出力の異常なサンプル値を遮断し、後続の正常な音声が復帰できるようにします。"
      - "UVR の再試行、出力設定の変更、結果のインポート、完了曲の削除でも、表示中の曲とスクロール位置を保ちます。"
      - "YouTube 曲の一括追加時の情報取得を改善。1 曲のタイムアウトで未処理の曲まで失敗にならず、削除した曲の不要な取得処理も取り消します。"
    ko:
      - "**S3S 사용자 Discord를 개설했습니다.** 질문, 문제 제보, 기능 요청, 사용자 교류와 업데이트 소식을 확인할 수 있습니다. [Discord 참여](https://discord.gg/3ST7NyCSrT)"
      - "마이크가 조용할 때 Signal Veil, Signal Tide, Frequency Orbit의 BGM 움직임이 약해지거나 표시되지 않는 문제를 수정했습니다. 실제 재생 음량을 바꾸지 않고 작은 음량의 BGM을 더 잘 표시합니다."
      - "Bubble Drift의 표시 영역을 수정했습니다. Photograph처럼 공간에 들어가는 영어 단어는 가능한 한 나누지 않으며, 긴 곡명은 여러 줄이나 페이지로 표시할 수 있습니다."
      - "테마와 동적 가사의 색상 설정을 통일했습니다. 지원되는 Set List와 대기 목록의 번호 스타일을 직접 선택할 수 있으며, 적용되지 않는 스크롤 속도 설정은 숨깁니다."
      - "Card와 CD의 썸네일을 가운데 정렬된 곡명에 맞게 갱신했습니다. Card의 Set List 스크롤 속도는 테마가 자동으로 관리합니다."
      - "직접 오디오 출력의 비정상 샘플 값을 차단하고 이후 정상 오디오가 복구되도록 했습니다."
      - "UVR 재시도, 출력 설정 변경, 결과 가져오기 또는 완료된 곡 삭제 시 현재 보고 있는 곡과 스크롤 위치를 유지합니다."
      - "YouTube 곡 일괄 추가 시 정보 조회를 개선했습니다. 한 곡이 시간 초과되어도 아직 조회하지 않은 곡까지 실패 처리하지 않으며, 곡을 삭제하면 불필요해진 조회도 취소합니다."

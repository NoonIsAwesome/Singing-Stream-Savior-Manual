release:
  version: "2.1.5.3"
  date: "2026-09-19"
  latest: false
  type:
    en: "Stability update"
    zh-TW: "穩定性更新"
    zh-CN: "稳定性更新"
    ja: "安定性アップデート"
    ko: "안정성 업데이트"
  release_url: "https://github.com/NoonIsAwesome/Singing-Stream-Savior-Updates/releases/tag/v2.1.5.3"
  summary:
    en: "Several stability improvements across the app."
    zh-TW: "軟體多項穩定性更新"
    zh-CN: "软件多项稳定性更新"
    ja: "アプリ全体の安定性を改善しました。"
    ko: "앱 전반의 안정성을 개선했습니다."
  items:
    en:
      - "Improves data retention when linked audio or attachment files are temporarily unavailable."
      - "Improves recording stability when recordings finish, fail, or are interrupted."
      - "Improves stability for YouTube playback resolving, background downloads, and fallback playback."
      - "Improves Collect Project Media so custom cover art is collected as well."
      - "Improves OBS Timeline timestamp accuracy when OBS status queries time out."
      - "Improves UVR temporary-file cleanup during batch processing to reduce disk usage on large batches."
      - "Fixes several other small issues and improves overall stability."
      - "I just finished reading Kaiju No. 8, and it was honestly way too good. Now that I’ve finished it, it feels like I’ve lost some purpose in life. I hope I can find another great manga soon…"
    zh-TW:
      - "改善專案中音檔或附件暫時找不到時的資料保留機制。"
      - "改善錄音完成、失敗與中斷時的穩定性。"
      - "改善 YouTube 播放解析、背景下載與備援流程的穩定性。"
      - "改善「收集專案媒體」功能，現在也會一併收集自訂封面。"
      - "改善 OBS Timeline 在連線逾時時的時間記錄準確度。"
      - "改善 UVR 批次處理時的暫存檔管理，減少大量歌曲處理時的磁碟空間占用。"
      - "修正一些其他小問題並提升整體穩定性。"
      - "最近剛看完《怪獸8號》，有點太好看了，看完彷彿人生失去了什麼目標，希望我可以趕快找到下一部好看的漫畫…"
    zh-CN:
      - "改善项目中音频或附件暂时找不到时的数据保留机制。"
      - "改善录音完成、失败与中断时的稳定性。"
      - "改善 YouTube 播放解析、后台下载与备用流程的稳定性。"
      - "改善“收集项目媒体”功能，现在也会一并收集自定义封面。"
      - "改善 OBS Timeline 在连接超时时的时间记录准确度。"
      - "改善 UVR 批量处理时的临时文件管理，减少大量歌曲处理时的磁盘空间占用。"
      - "修复一些其他小问题并提升整体稳定性。"
      - "最近刚看完《怪兽8號》，有点太好看了，看完之后仿佛人生失去了什么目标，希望我可以赶快找到下一部好看的漫画…"
    ja:
      - "リンク先の音声ファイルや添付ファイルが一時的に見つからない場合も、曲やプロジェクトの設定を保持するよう改善しました。"
      - "録音の完了・失敗・中断時の安定性を改善しました。"
      - "YouTube の再生情報取得、バックグラウンドダウンロード、フォールバック再生の安定性を改善しました。"
      - "「プロジェクトメディアを収集」機能を改善し、カスタムカバー画像も一緒に収集できるようにしました。"
      - "OBS Timeline で OBS のステータス取得がタイムアウトした場合の時刻記録精度を改善しました。"
      - "UVR のバッチ処理中に一時ファイルを順次整理し、大量の曲を処理する際のディスク使用量を抑えるよう改善しました。"
      - "そのほか細かな問題を修正し、全体的な安定性を改善しました。"
      - "最近『怪獣８号』を読み終えたんですが、ちょっと面白すぎました。読み終わったら人生の目標を何か失ったような気分になってしまったので、早く次にハマれる面白い漫画を見つけたいです…"
    ko:
      - "연결된 오디오 파일이나 첨부 파일을 일시적으로 찾을 수 없어도 곡과 프로젝트 설정을 유지하도록 개선했습니다."
      - "녹음 완료, 실패 및 중단 시의 안정성을 개선했습니다."
      - "YouTube 재생 정보 확인, 백그라운드 다운로드 및 대체 재생 과정의 안정성을 개선했습니다."
      - "‘프로젝트 미디어 수집’ 기능을 개선해 사용자 지정 커버 이미지도 함께 수집하도록 했습니다."
      - "OBS Timeline에서 OBS 상태 조회가 시간 초과될 때의 타임스탬프 정확도를 개선했습니다."
      - "UVR 일괄 처리 중 임시 파일을 작업별로 정리해 많은 곡을 처리할 때의 디스크 사용량을 줄였습니다."
      - "그 밖의 여러 작은 문제를 수정하고 전반적인 안정성을 개선했습니다."
      - "최근에 《괴수 8호》를 다 봤는데, 너무 재미있었습니다. 다 보고 나니 인생에서 뭔가 목표 하나를 잃은 것 같은 기분이라, 빨리 다음 재미있는 만화를 찾고 싶어요…"

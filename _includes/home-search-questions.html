<section class="section home-faq" id="streaming-questions" aria-labelledby="home-faq-title">
  <div class="wrap">
    <h2 class="section-title" id="home-faq-title">{{ home_search.faq_title | escape }}</h2>
    <div class="home-faq-list">
      {% for question in home_search.questions %}
      <details id="home-faq-{{ question.id | escape }}">
        <summary>{{ question.question | escape }}</summary>
        <div class="home-faq-answer">
          <p>{{ question.answer | escape }}</p>
          <a class="text-link" href="{{ home_links[question.guide] | relative_url }}">{{ question.link_label | escape }}</a>
        </div>
      </details>
      {% endfor %}
    </div>
  </div>
</section>
